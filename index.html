        { side: "right", speaker: "高市総理", text: "年金積立金を活用して社会保険料を引き下げることは、将来世代の給付水準の低下につながり得るため、適当ではないと考えています。" },

      noteUrl: "https://note.com/tamakitext/n/nf18e5c63411c",
      fullUrl: "full/2026-10-22-iizumi.html",
      bubbles: [
        { side: "left", speaker: "古屋圭司団長", text: "調査団は9月2日から13日まで、スイス、ハンガリー、イタリアの3か国を訪問しました。いずれも憲法改正を度々行っている国です。関心事項は、第1に国防・安全保障、第2に緊急事態条項、第3に国民投票の3つで、各国の政府・議会・有識者と意見交換を行いました。" },

        { side: "left", speaker: "古屋圭司団長", text: "ハンガリーの国防の基本原則は、自国軍による個別防衛、NATOによる集団防衛、そして憲法31条1項に定める「すべての国民による祖国防衛の義務」の3つです。同国は2011年の基本法制定後も改正を重ねており、現政権はこの秋から1年半〜2年をかけて新憲法制定のプロセスを進める予定だとの説明でした。一方でハンガリーの要人からは、80年近く改正されていない日本国憲法の安定性への羨望も一様に示されました。" },

        { side: "left", speaker: "古屋圭司団長", text: "イタリア憲法は11条で戦争の「拒絶」を、52条1項で市民の祖国防衛義務を定めています。両条文は合わせて読み、ポイントは「平和を保つための防衛」だとの説明でした。52条2項の兵役義務は2005年に停止され、現在は志願制です。なお国防省の政務次官は「個人的には」と断った上で、市民が軍の価値観を理解するために一定の兵役経験は重要だとの見解を示し、強制ではなく任意の兵役制度の法案を作ったものの、2020年に廃案になったと紹介しました。" },
        { side: "left", speaker: "古屋圭司団長", text: "緊急事態条項について。スイス憲法には議員任期延長の明文規定がなく、学会でも意見が分かれているとのことでした。ハンガリーでは事態が戦争事態・緊急事態・危険事態の3つに整理され、議員任期の延長も可能ですが、国会は政府の緊急命令を廃止でき、「何より早期に選挙を実施すること」が大原則だと強調されました。イタリアでは戦争状態の認定は国会が行い、政府の緊急法律命令は2025年に39件出されるなど増えており、「数が多すぎる点は反省すべき」との認識も示されました。" },
        { side: "left", speaker: "古屋圭司団長", text: "国民投票について。スイスには10万人の署名で国民が憲法改正を発案できる仕組みがあり、直接民主制は国のアイデンティティと結びついているとの認識でした。ハンガリーでは、憲法改正に国民投票を導入することが選択肢として検討されていますが、情報操作への懸念から反対する個人的見解も述べられました。イタリアでは今年3月、司法組織改革の憲法改正が国民投票で否決されました。「国民投票は名称こそ中立的だが、実際はまさに政治的な投票にならざるを得ない」との評価も聞かれました。" },
        { side: "left", speaker: "飯泉嘉門", text: "スイスは職業軍人ではなく、徴兵による民兵が原則の国です。10万人規模の動員には有職者を集めるため1.4倍の14万人が必要になるとの話があり、「職業軍人の方が合理的ではないか」と質問を向けたところ、有職者の知識や技術を軍に活かすことができ、災害対応や警察への支援も可能になるとの答えでした。ただし最近は人を集めづらくなり、銃を持ちたくない人向けの代替任務を選ぶ人が圧倒的になっていて、制度の改編が急務とされている、とのことでした。" },
        { side: "left", speaker: "飯泉嘉門", text: "ハンガリーでは、2011年の改正で平和主義の象徴だった戦争放棄の条項が変わり、「国が国民を守るためには戦争のできる国になる必要がある」とされた経緯について、「国民はどう反応したか」と尋ねたところ、「国民は問題としなかった」との回答がありました。イタリアでは、変えてはならない条文は139条の共和政体のみで、11条と52条は変更不可の規定ではないとの説明を受けました。あわせて、ワイマール憲法が骨抜きにされナチスの台頭を許した歴史的事実も踏まえる必要がある、と考えています。" },
        { side: "right", speaker: "玉木雄一郎", text: "国民投票を考える上では、SNSの影響にしっかりルールを定めることが必要です。認知戦による選挙への介入は、緊迫感の高い国では対応が当たり前になっています。国民投票法でも具体的なルールを深めることを提案します。また、スイスのように投票用紙と解説パンフレットが事前に郵送される仕組みを踏まえ、広報協議会がどういう形で何を伝えるのかを具体的に定めることが極めて重要です。さらに、国民投票が時の政権への信任投票になってしまう問題を避けるため、大型国政選挙と国民投票の同日実施は基本的には避けるべきだと考えます。" },
        { side: "right", speaker: "玉木雄一郎", text: "来年の自民党大会で本当に発議をするのであれば、この臨時国会でどのようなスケジュールで何を議論するか定めてください。また代表質問でも総理に聞きましたが、自衛隊が軍隊なのか否か、ネガティブリストでいけるのかどうかについて、まず与党間で考え方を整理していただきたい。限られた時間で発議に行くのであれば、議論が煮詰まってきた緊急事態条項と合区の解消に絞って進めていただくことをお願いします。" },
        { side: "right", speaker: "新藤義孝（自民党）", text: "ハンガリーの要人からは「憲法を政権の都合で頻繁に改正すれば国は不安定なままだ。長期間改正しなくて済んでいる日本は羨ましい限りだ」との言葉がありました。国家の安定にとって憲法の存在は決定的に重要で、政権が変わっても揺るがない基本原則を定めることが大切だと受け止めました。その上で、時代の変化や国際情勢に応じて必要な憲法の見直しを行っていくことが重要だと、今回の意見交換を通じて実感しました。" },
        { side: "right", speaker: "西村ちなみ（中道）", text: "憲法改正が最優先の課題とは思えません。憲法によって国家権力を制限し、国民の自由や人権を守るのが立憲主義です。改正を権力を持つ側である政府や与党が積極的に提案してくる場合、その理由の正当性、必要性を厳しく判断することは当然だと考えます。団長報告にあった、ハンガリーの要人が日本国憲法の安定性に羨望を示したという点や、憲法が権力維持に利用された経緯は、我が国にとって示唆に富むものでした。" }
      ],
      memo: "この日の中心は「改正を重ねてきた国々から何を学ぶか」で、結論は出ていない。とりわけ切り取られやすいのが「徴兵」という言葉だが、本文の言及はすべて、ハンガリー・イタリア・スイスの担当者が自国の制度を説明した内容の報告であり、日本に徴兵制を導入しようという提案は、報告にも各委員の発言にも存在しない。ハンガリーの説明でも「復活の動きは現時点でない」ことが明記されている。次は審査会で玉木議員が求めた「議論の絞り込みとスケジュール」が示されるかどうかを追う。"

  { id: "tamaki-press", cats: [{ id: "money", label: "税とお金", icon: "💰", preview: "2年後に中間層が大増税になる——住民税の恒久減税で防ぐ対案「現役世代減税法案」と約4.6兆円の財源を提示" }], name: "玉木雄一郎（定例会見）", initial: "玉", dateLabel: "10/20", unread: 1, addedOn: "2026-10-26",
    preview: "2年後に中間層が大増税になる——住民税の恒久減税で防ぐ対案「現役世代減税法案」と財源を提示",
    articles: [{
      date: "2026年10月20日", committee: "定例記者会見",
      title: "「2年後の中間層増税」を止めよ——対案「現役世代減税法案」を提示",
      summary: "党の対案「現役世代減税法案」（正式名：就業者の租税及び社会保険料による負担軽減のために講ずべき措置に関する法律案）の発表。玉木代表は、政府案への賛否は住民税の恒久減税が入ることが必要条件だと明言。財源約4.6兆円など数字はいずれも党の試算・提示。",
      noteUrl: "https://note.com/tamakitext/n/n419afb5c1025",
      fullUrl: "full/2026-10-20-tamaki-press.html",
      bubbles: [
        { side: "left", speaker: "司会", text: "国民民主党は先ほど、衆議院に「就業者の租税及び社会保険料による負担軽減のために講ずべき措置に関する法律案」、通称「現役世代減税法案」を提出してまいりました。まず玉木代表から説明をお願いいたします。（※冒頭は法案提出に伴うぶら下がりで、記者の質問ではなく司会の進行による）" },
        { side: "right", speaker: "玉木雄一郎", text: "今日から本会議で、飲食料品の消費税減税と支援金制度の審議が始まります。我が党は反対ありきではありませんが、現行法案の問題点への対案として法案を提出しました。最大の問題は、2029年度に消費税率が戻ったとき、支援金の対象とならない年収300万円以上の中間層が大増税になることです。課税最低限を119万円程度から178万円を目指して引き上げ、5万円程度の住民税減税を恒久的に行うことが法案の骨子です。「178万円の壁」の引き上げの時限措置の解消もセットで盛り込みました。財源は合計約4.6兆円分を具体的に示しています。" },
        { side: "left", speaker: "記者", text: "国民民主党案を与党が受け入れる可能性と見通しをどう見ていますか。（Japan In-depth）" },
        { side: "right", speaker: "玉木雄一郎", text: "飲んでいただきたいですね。政府案は、給付付き税額控除を目指して作ったのに「税額控除なき給付」、単なる低所得者向け給付措置になっています。総理も代表質問で「諦めていません」とおっしゃった。根こそぎ変えろと言っているのではなく、明らかに欠けている部分を補う法案ですから、政調会長同士か税調会長同士か、真摯に協議に臨みたいと思います。" },
        { side: "left", speaker: "記者", text: "「178万円の壁」の引き上げが2年の時限措置で、所得制限も残っている点は、年末の税制改正でどう扱ってほしいのですか。（フリーランス）" },
        { side: "right", speaker: "玉木雄一郎", text: "残った宿題を解消する所得税法の改正も、この法案の中に入れています。年末の交渉では住民税が中心になりますが、所得税の減税も忘れていません。時限措置の延長に加え、基本的には所得に関わらない控除制度にしていくことをきちんと書きました。住民税と所得税を合わせて「個人課税の減税」として提案しています。" },
        { side: "left", speaker: "記者", text: "合わせて示された「早期に講ずべき物価上昇対策」の狙いを説明してください。（NHK）" },
        { side: "right", speaker: "玉木雄一郎", text: "政府の減税と給付は来年4月からで、それまで何もないことが問題です。課税所得のある方には、昨年の控除引き上げで今年の年末調整で1人3万円から6万円が戻りますが、所得の低い方には年内・年度内に何もありません。9月で切れた電気代・ガス代の支援、灯油の支援、そして給付の前倒しを、予備費の活用や必要に応じた補正予算で今年度から行うべきだと、法案とは別に予算措置として提案しています。" },
        { side: "left", speaker: "記者", text: "食料品だけの消費税減税には、外食や農家の懸念が訴えられています。今回の対案は、その懸念を見込んだ上でのものですか。（日経新聞）" },
        { side: "right", speaker: "玉木雄一郎", text: "消費税を減税するなら一律減税が今でもベストで、食料品だけ下げるのは「筋が悪い」と言わざるを得ません。インボイスも要らなくなります。ただ、総理のこだわりで変えられないということであれば、弊害を最小にするしかない。最大の弊害は、2年後に大増税になる中間層が放ったらかしになっていることです。我々の控除額引き上げによる減税は、民間の皆さんに追加負担がありません。" },
        { side: "left", speaker: "記者", text: "住民税減税が受け入れられれば政府案に賛成する可能性もあるのですか。逆に、それが入らなければ他の譲歩があっても賛成は難しいのでしょうか。（時事通信社）" },
        { side: "right", speaker: "玉木雄一郎", text: "2年後の中間層増税をいかに避けられるかということと、本来目指していた給付付き税額控除の姿にすること。これをやっていただくことが、賛成の必要条件だと思います。農家や外食への対応は、いずれにせよ対応しなければいけない課題です。" },
        { side: "left", speaker: "記者", text: "IMFの見通しでは日本の経済規模が順位を下げていきます。経済規模の目標を立てて取り組むべきではないですか。（FACTA）" },
        { side: "right", speaker: "玉木雄一郎", text: "国民民主党に経済政策を任せていただければ、もう一度日本を第3位まで戻します。日本の問題は潜在成長率の低さですし、時価総額100兆円企業が1社もないことも課題です。総理の掲げる370兆円の投資も、官民比率や分野ごとの内訳がまだ決まっていません。お金を積むだけでは投資は増えません。規制緩和やインフラ整備まで含め、経済が花開く環境を作ることが必要です。" }
      ],
      memo: "この会見は国会質疑ではなく、党の対案の発表の場。玉木代表の説明は、政府案の「空白」——支援金の対象と金額が分からないこと、2年後に支援が切れる中間層への手当てがないこと——を突く構成だった。財源も4.6兆円分を項目ごとに示したが、いずれも党の見積もりであり、与党が受け入れるかはこれからの協議次第。政府案への賛否の条件を「住民税減税が入ること」と明言した点が、この日のいちばんのニュース。"
    }] },

  { id: "okano", cats: [{ id: "health", label: "医療・福祉", icon: "🏥", preview: "海外工場のトラブルで小児の便秘薬が供給制限に。政府は優先供給で「影響は最小限」、供給網の強靭化の具体策は示されず" }, { id: "children", label: "子ども・家族", icon: "👶", preview: "1歳から使える慢性便秘症の第一選択薬が供給制限に。子どもへの優先供給は取られたが、長期化すれば影響が広がる恐れ" }], name: "岡野純子", initial: "岡", dateLabel: "10/23", unread: 1, addedOn: "2026-10-26",
    preview: "海外工場のトラブルで小児の便秘薬が供給制限に。政府は「影響は最小限」、強靭化の具体策は示されず",
    articles: [{
      date: "2026年10月23日", committee: "衆議院・厚生労働委員会",
      title: "薬の供給は海外頼み、障害を理由に手術を断られる現実も",
      summary: "論点は2つ。医薬品の安定供給（モビコールの供給制限、薬機法改正、供給網の強靭化）と、障害を理由とする手術拒否。政府は「障害のみを理由に断ることは応召義務の正当な事由とは言えない」との見解を示した。",
      noteUrl: "https://note.com/tamakitext/n/n60d2d291becd",
      fullUrl: "full/2026-10-23-okano.html",
      bubbles: [
        { side: "left", speaker: "岡野純子", text: "慢性便秘症の薬モビコールが、英国の製造所の品質問題で供給が制限され、通常出荷の再開は来年6月が目処とされています。代替薬に切り替えても効果が得られない声があり、1歳から使える小児の治療では特に切り替えが困難です。患者や医療現場への影響をどう把握し、販売元のEAファーマにどう指導・要請を行いましたか。" },
        { side: "right", speaker: "安藤医薬産業振興審議官", text: "モビコールは学会ガイドラインで小児の慢性便秘症の第一選択薬とされる、医療現場で必要性の高い医薬品です。厚労省はEAファーマに医療機関・薬局への適切な情報提供を指導し、小児の患者さんへ優先的に供給されるよう協力を求めたほか、英国の規制当局にも早期の問題解決を働きかけました。現時点で影響は最小限に抑えられていますが、長引くと小児への供給にさらなる影響が生じる恐れがあります。" },
        { side: "left", speaker: "岡野純子", text: "昨年の薬機法改正で安定供給の制度が強化され、施行から間もなく1年です。限定出荷・供給停止は薬価削除予定品目を除き1366品目で、数字上は改善傾向にあります。法改正によって供給不安を早い段階で把握できた、供給不足そのものを回避できたといった具体的な変化はありましたか。運用を通じて明らかになった課題も伺います。" },
        { side: "right", speaker: "安藤医薬産業振興審議官", text: "従前は行政指導により求めていた供給不安や供給状況の報告が法律上の義務となり、確実に行われることで、代替薬の調整といった対策を講じやすくなりました。令和9年5月からは、製造販売業者に供給体制の管理責任者の設置や安定供給に向けた手順書の作成も義務づけられます。また供給確保医薬品を指定する仕組みが創設され、約1万6000品目の中から医療上の必要性が高いものに対策の優先順位をつけられるようになりました。" },
        { side: "left", speaker: "岡野純子", text: "医薬品の製造や原薬は海外に頼るところが大きく、今回も海外工場のトラブルが発端でした。国内の製造基盤の確保、製造拠点・調達先の複数化、必要な備蓄を組み合わせて、供給網の強靭化をさらに加速していくべきです。政府の認識と今後の方針を伺います。" },
        { side: "right", speaker: "安藤医薬産業振興審議官", text: "サプライチェーンの脆弱性については、厚生労働省としても強い問題意識を持っています。抗菌性物質製剤を経済安全保障推進法に基づく特定重要物資に指定し、国内での原薬製造体制の整備を進めるほか、原薬の調達先の複数化に取り組む企業を支援してきました。製剤の製造拠点と原薬の関係を調べる「マッピング」も含め、医療上の必要性が高い医薬品から順次サプライチェーン調査を実施し、潜在的なリスクの点検も進めています。（※岡野はこの後、政府全体で人員と予算を確保し「国家的な危機管理」として取り組むべきだと求めたが、直接の答弁はなかった）" },
        { side: "left", speaker: "岡野純子", text: "統合失調症のある知人が腰の病気で手術を必要とした際、一般病院で「うちの病院では障害のある方の対応ができません」と言われ、手術を受けることができませんでした。障害があることを理由に、個々の患者の状態を十分確認せずに予防的に手術を断るケースがあるのではないかと懸念します。厚労省はこの事態をどのように把握し、どう考えますか。" },
        { side: "right", speaker: "佐々木医政局長", text: "障害者差別解消法は、医療機関を含む事業者が障害を理由としてサービス等の提供を拒否することを禁止しており、このような事例は適切ではないものと考えております。医師法の応召義務についても、正当な事由に当たるかは個々の事情に即して判断する必要がありますが、一般的には、障害があることのみを理由として診療を拒否することは、正当な事由があるものとは言えないと考えております。" },
        { side: "left", speaker: "岡野純子", text: "対応できないと判断した場合も、医学的な理由なのか、設備や人員の問題なのか、具体的な理由を患者本人に伝えることが重要です。医療計画の指針が示す、精神・身体双方に対応できる医療機関の整備や連携体制について伺います。状態が安定している方の予定手術も対象として想定されていますか。対応できる医療機関の明確化や連携はどこまで進んでいますか。" },
        { side: "right", speaker: "水谷障害保健福祉部長", text: "指針において身体合併症への対応を求めており、本年6月には指針の見直しを行い、地域における協議の場で議論することも求めました。身体合併症には、手術を要するような急性疾患から慢性疾患まで含まれますので、精神疾患が比較的安定している患者さんが身体疾患の予定手術を受ける場合も対象に含まれると考えてございます。改正医療法で精神医療が地域医療構想に位置づけられ、本年9月からワーキンググループで病床機能の在り方も含めて議論が行われています。" }
      ],
      memo: "モビコール問題で政府は「小児への優先供給で影響は最小限」としたが、通常出荷の再開は来年6月の目処で、政府自身が「長引けば小児への影響が広がる恐れ」を認めた。手術拒否の問題では「障害のみを理由に断ることは正当な事由とは言えない」との見解と、予定手術も指針の対象に含まれるとの答弁を引き出したのが収穫。次は、対応できる医療機関の明確化が実際に進むかと、モビコールの供給再開の見通しを追う。"
    }] },
  { id: "hino", cats: [{ id: "health", label: "医療・福祉", icon: "🏥", preview: "傷病手当金は5年で約1.6倍に増加。発達障害と障害年金の取扱いは「一律同一疾病ではない」と政府が説明" }, { id: "children", label: "子ども・家族", icon: "👶", preview: "子どもの発達障害の受診が、将来の障害年金の落とし穴に？ 親の不安に大臣は「受診を控える事態は望ましくない」" }], name: "日野さりあ", initial: "日", dateLabel: "10/23", unread: 0,
    preview: "子どもの発達障害受診が将来の年金の落とし穴に？ 政府は「一律同一疾病ではない」、具体策は示されず",
    articles: [{
      date: "2026年10月23日", committee: "衆議院・厚生労働委員会",
      title: "発達障害の早期受診が“将来の落とし穴”になる矛盾。親の叫びに対する大臣の答弁は",
      summary: "論点は大きく3つ。発達障害と障害年金の取扱い／傷病手当金の急増／社会保障の財源。政府は「一律同一疾病ではない」と公式に説明したが、見直しや救済の具体策は示されなかった。",
      noteUrl: "https://note.com/tamakitext/n/n4c8b5b6d1e3d",
      fullUrl: "full/2026-10-23-hino.html",
      bubbles: [
        { side: "left",  speaker: "日野さりあ", text: "消費税は社会保障を支える重要な財源です。減税の穴埋めで医療や介護、子育て支援が削られないよう、「社会保障の財源に手を付けない」と総理に申し入れていただけますか。" },
        { side: "right", speaker: "上野厚生労働大臣", text: "財源は租税特別措置や補助金の見直しなど、歳出歳入全般の見直しで確保されるものと承知しています。社会保障財源に穴が開くことにはならない、という認識です。" },
        { side: "left",  speaker: "日野さりあ", text: "傷病手当金の支給額は2018年度の約3,800億円から2023年度には約6,100億円へ、5年で約1.6倍に増えました。精神疾患の総患者数は微減しているのに、なぜですか。（※金額・倍率は日野議員が質問で提示した数字）" },
        { side: "right", speaker: "宮崎保険局長", text: "要因は労働環境や受診行動の変化、高齢化、賃上げなど複合的で、一概にはお答えできません。協会けんぽでは精神・行動の障害が支給額の41％を占め、この間の伸びは約2.0倍です。" },
        { side: "left",  speaker: "日野さりあ", text: "「誰でも傷病手当金を受給できる」と誤認させる申請支援ビジネスについて、保険者や医師、経営者から具体的な事例が私たちに寄せられています。厚労省に寄せられた声に、どう対応してきましたか。" },
        { side: "right", speaker: "上野厚生労働大臣", text: "業者の存在は承知していますが、個別の詳細な事例の報告は届いていない状況です。保険者へのヒアリングで実態把握を進め、必要に応じて対応を検討します。" },
        { side: "left",  speaker: "日野さりあ", text: "福祉避難所の情報が自治体のホームページの避難所一覧に載っていないという声があります。ガイドラインに沿った指定福祉避難所は全ての市町村に準備されているのですか。妊婦への周知はどうしていますか。" },
        { side: "right", speaker: "西田内閣副大臣", text: "令和7年10月現在、福祉避難所は全国26,784か所、1,740市町村のうち1,671市町村に設置されています。好事例を年2回の全国会議で横展開し、周知に努めます。" },
        { side: "left",  speaker: "日野さりあ", text: "子どもの頃の発達障害の受診が初診日になると、将来うつ病を発症しても障害厚生年金の対象外になることがあると聞きます。なぜ発達障害とうつ病を同一疾病として扱うのですか。医学的根拠でしょうか。" },
        { side: "right", speaker: "伊澤大臣官房年金管理審議官", text: "疑義照会は、発達障害とうつ病を一律に同一疾病として取り扱うと示したものではありません。発症が発達障害に起因するかは、経過や症状、就労状況などから個々の事案ごとに医学的に総合判断しています。" },
        { side: "left",  speaker: "日野さりあ", text: "その取扱いのせいで、必要な早期受診をためらう保護者が出ています。初診日や同一疾病の取扱いを見直すのか、別の救済措置を検討するのか、受診をためらわずに済む具体的な対応策を示してください。" },
        { side: "right", speaker: "上野厚生労働大臣", text: "早期受診を控える事態は望ましくありません。早期支援の重要性の周知に取り組み、疑義照会についても誤解が生じないよう、どういった対応ができるか考えていきたいと思います。" }
      ],
      memo: "この日決まったことはほぼなし。「一律同一疾病ではない」と政府が公式に説明したのが最大の収穫だが、見直しや救済の具体策、総理への申し入れ、介護の基本報酬引上げ率はすべて示されなかった。次は疑義照会への対応方針と、令和9年度介護報酬改定の審議会論議を追う。"
    }] },
  { id: "ido", cats: [{ id: "children", label: "子ども・家族", icon: "👶", preview: "韓国の保護出産をめぐる調査では、登録されなかった子249人の死亡が判明。「まず登録を」と迫るが、政府は戸籍の趣旨を理由に慎重姿勢" }, { id: "justice", label: "法務・人権", icon: "⚖️", preview: "「売春は違法」と大臣が明言し、法案は「速やかに提出」。一方、本籍の見直しは「意義を失っていない」と政府、本籍なき登録には局長が否定的" }], name: "井戸まさえ", initial: "井", dateLabel: "10/23", unread: 1, addedOn: "2026-10-26",
    preview: "韓国の保護出産を引き合いに戸籍の壁を問う。本籍は「意義を失っていない」、法整備の時期も示されず",
    articles: [{
      date: "2026年10月23日", committee: "衆議院・法務委員会",
      title: "「まず登録を」——韓国の保護出産から戸籍と本籍の壁を問う",
      summary: "論点は2つ。売買春の法整備（時期と法律の名称）と、戸籍・本籍・無戸籍問題。大臣は「売春は違法」と明言し法案は「速やかに提出」としたが時期は示されず、本籍の見直しには「意義を失っていない」と答えた。",
      noteUrl: "https://note.com/tamakitext/n/n92fae38704c2",
      fullUrl: "full/2026-10-23-ido.html",
      bubbles: [
        { side: "left", speaker: "井戸まさえ", text: "現行の売春防止法は売春を禁止していますが、行為自体を一律に処罰する仕組みにはなっていません。まず、売春は違法であることを確認させてください。その上で、法整備の具体的なプロセスとタイムスケジュールをお示しください。" },
        { side: "right", speaker: "山下法務大臣", text: "売春は違法ということでございます。検討会の取りまとめを踏まえ、買う側による勧誘等に関する処罰規定など、具体的な内容の検討を進めているところです。法案提出の時期は今はお話しできませんが、できるだけ速やかに国会に提出するようにしていきたいと思います。" },
        { side: "left", speaker: "井戸まさえ", text: "「売春防止法」という名称は、売る側だけに焦点を当て、買う側の存在を見えなくしてしまっています。買う側の関与も規制していく方針が示された以上、「売買春防止法」に改めるべきだと考えますが、大臣の御所見を伺います。" },
        { side: "right", speaker: "山下法務大臣", text: "名称を改めた場合、売春をする者の保護支援の視点がかえってぼやけてしまうのではないかと、慎重に検討すべきだという見解もあります。こうした検討会の議論も踏まえて、必要な法整備について検討を進めていきたいと考えております。（※名称変更への賛否自体は、この日示されなかった）" },
        { side: "left", speaker: "井戸まさえ", text: "韓国では、病院が付けた臨時番号のまま出生届が出されなかった子が2236人と判明し、うち249人の死亡が確認されました。2024年7月には出生通知制度と保護出産（内密出産）が同時施行されました。番号や仮名でまず登録できるデジタル化こそ、制度の狭間に落ちる子どもを救う鍵です。" },
        { side: "right", speaker: "山下法務大臣", text: "デジタル化の進展に向けて適切な技術を取り入れることは重要と認識しております。一方で、親族的身分関係を公証するという戸籍の趣旨もしっかり確保しなければなりません。制度の趣旨を没却しない範囲で、戸籍のデジタル化を進めていきたいと考えております。" },
        { side: "left", speaker: "井戸まさえ", text: "本籍とは何でしょうか。マイナンバー時代に本籍は本当に必要なのか。これは私の問いではなく、法務省の戸籍制度に関する研究会自身が立てた問いです。紙の時代は市町村に置く必要がありましたが、今も本籍を市町村に定める必要があるのでしょうか。" },
        { side: "right", speaker: "松井民事局長", text: "本籍は、戸籍の編成基準である一定の場所であって、戸籍の所在する市町村を明らかにするとともに、特定の戸籍を他の戸籍と区別して表示するために用いられてきたものであり、重要な意義・役割を有するものと考えております。" },
        { side: "left", speaker: "井戸まさえ", text: "本籍はある日突然消えることがあります。サハリンでは日本領でなくなった瞬間に本籍がなくなり、本籍を持っていた方々は無戸籍になりました。災害で紙の戸籍が流されることもあります。生活と関わりのない場所に置かれた本籍に、今どのような実質的な意味があるのでしょうか。" },
        { side: "right", speaker: "山下法務大臣", text: "本籍地の市町村が戸籍事務を担うという管轄の基準でもあり、本籍には戸籍やそこに記載された個人を特定する機能も有しております。本籍を基準とすることは、いまだ意義を失っていないのではないかと考えております。" },
        { side: "left", speaker: "井戸まさえ", text: "無戸籍の子どもたちにとって、まずは登録することが何よりも大事な第一歩です。父未定であることに注記をつけて登録し、これから必要になる裁判手続きを一人一人に通知することも、デジタル化すれば可能になるのではないでしょうか。" },
        { side: "right", speaker: "松井民事局長", text: "嫡出推定が重なる場合でも法律上の父は定まっており、内密出産の場合とは異なると考えています。それにもかかわらず父未定という戸籍を作成することは、戸籍制度の機能に照らして困難であると考えております。" }
      ],
      memo: "この日の収穫は、大臣が「売春は違法」と明言し、法案提出に前向きな姿勢を示したこと。一方で本籍をめぐっては、政府は「意義を失っていない」の一点張りで、法務省の研究会が投げかけた「マイナンバー時代に本籍は必要か」という問いへの答えは示されなかった。「父未定」の注記付き登録にも局長は否定的で、韓国式の出生通知・保護出産を導入するかどうかに政府は一切触れなかった。次は売買春の法案がいつ国会に出てくるかを追う。"
    }] },
  { id: "asano", cats: [{ id: "work", label: "働き方", icon: "💼", preview: "裁量労働制の拡大、政府の根拠は「時間が著しく長くはならない」「約8割が満足」。浅野は「生産性・成果で評価すべき」と評価軸の追加を求めた" }, { id: "health", label: "医療・福祉", icon: "🏥", preview: "企業立病院への税制上の措置、大臣は「医療法の考え方から難しい」。地域医療を担う病院への支援は「応援できる部分は応援したい」" }, { id: "money", label: "税とお金", icon: "💰", preview: "支援金の満額も対象範囲も「検討中」。モデル世帯の試算も示されず、2年後の負担をめぐる主張は平行線" }], name: "浅野さとし", initial: "浅", dateLabel: "10/23", unread: 2, addedOn: "2026-10-26",
    preview: "裁量労働制は「時間」でなく「成果」で測れ。政府の根拠データは労働時間と満足度が中心、生産性・創造性の検証はこれから",
    articles: [{
      date: "2026年10月23日", committee: "衆議院・厚生労働委員会",
      cats: ["work", "health"],
      title: "裁量労働制は「時間」でなく「成果」で測れ——拡大議論の根拠を問う",
      summary: "論点は3つ。技能五輪全国大会の開催転換／裁量労働制の拡大を検討する根拠データと評価軸／企業立病院への税制措置。拡大の是非は労政審で議論中で、生産性・創造性の検証はこれから。税制措置は「難しい」と答弁された。",
      noteUrl: "https://note.com/tamakitext/n/n722781340e59",
      fullUrl: "full/2026-10-23-asano.html",
      bubbles: [
        { side: "left", speaker: "浅野さとし", text: "2028年度の技能五輪全国大会は、当初は国際大会の愛知開催に伴い見送る予定でしたが、開催すると発表されました。一度は見送りと公表されたものが、なぜ開催する判断に変わったのですか。どのような意見が寄せられ、どのような検討を経たのか、お答えください。" },
        { side: "right", speaker: "青山人材開発統括官", text: "競技関係者のご負担を考慮して見送ることとしておりましたが、開催を希望するご意見が寄せられ、国会でのご議論や超党派議員連盟の決議も踏まえ、競技関係者に改めて書面調査を実施いたしました。開催を希望する職種が多数だったことなどから、本年8月、2028年度技能五輪全国大会を2029年2月に開催することといたしました。" },
        { side: "left", speaker: "浅野さとし", text: "2028年の技能五輪国際大会は21年ぶりに愛知県で開かれます。全国大会は国際大会の代表選手の選考も兼ねています。愛知大会の成功に向けて、全国大会をどのように位置づけ、選手の裾野の拡大や技能尊重の機運づくりにつなげていくのか、大臣の認識を伺います。" },
        { side: "right", speaker: "上野厚生労働大臣", text: "技能五輪国際大会は、我が国の優れた技能を伝える絶好の機会です。全国大会は国際大会の選手選考を兼ねており、青年技能者の水準向上や選手の裾野の拡大を図る上で大変重要です。全世代型リスキリング国民運動による周知広報や教材による職業技能教育の促進などを通じて、技能の魅力を伝え、技能を尊重する機運の醸成に取り組んでまいります。" },
        { side: "left", speaker: "浅野さとし", text: "過労死に関する労災請求・支給決定件数が過去最多を記録するなど、過労死等ゼロにはまだ道のりがあります。労働時間規制を見直すのであれば、その根拠となるデータが示されるべきです。裁量労働制の拡大を検討する根拠として、これまでどのようなデータが示されてきたのですか。" },
        { side: "right", speaker: "岸本労働基準局長", text: "令和元年に実施した裁量労働制実態調査によりますと、1日の平均実労働時間数は適用労働者の方が非適用労働者よりも若干長い一方、専門型・企画型ともに約8割が制度の適用に満足していると回答しております。また調査結果を回帰分析したところ、制度の適用によって労働時間が著しく長くなるとは言えない、処遇が低くなるとは言えない、健康状態が悪化するとは言えないこと等が明らかになっております。" },
        { side: "left", speaker: "浅野さとし", text: "労働時間が長めでも満足していることを、裁量労働制を肯定する理由にしてはいけません。裁量労働制の本質は、本人が仕事の内容や進め方を自分で決められることです。ですから評価の軸は労働時間ではなく、本人の生産性や成果であるべきです。政府の分析は十分なのでしょうか。" },
        { side: "right", speaker: "岸本労働基準局長", text: "裁量労働制の本質については、ご指摘のとおりであると思います。働く本人に裁量を与えて仕事の進め方を任せ、その代わりに成果を重視した評価を行う、そのことで労使双方にメリットがある形で運用される場合に、制度の意義は最大限に発揮されます。一方で、長時間労働の助長や、時間外労働手当の節約手段として使われる例があるのではないかといった懸念も従来から寄せられており、そうした点も調査をしてきたものでございます。" },
        { side: "left", speaker: "浅野さとし", text: "適用範囲を拡大すべきかどうかを議論するには、創造性や生産性を高める効果が出ているかどうかのデータが必要です。今年度行われている実態調査では、労働時間の観点だけでなく、生産性・創造性の観点と、本当に自己裁量のもとで働けているかどうかを評価軸に入れていただきたい。" },
        { side: "right", speaker: "岸本労働基準局長", text: "裁量労働制の実態調査については、改めて今年度調査を今行っているところでございまして、その結果がまとまりましたら、関係の審議会にもご提出をし、議論の材料にしていただきたいと考えております。なお意識の面では、裁量が与えられることでメリハリのある仕事ができる、ワークライフバランスが確保できるといった項目で、適用者の方が非適用の方よりも高い率で回答しているというデータもございます。" },
        { side: "left", speaker: "浅野さとし", text: "過労死や労災申請件数が過去最高を更新し続けている今、裁量労働制の議論を進めるのであれば、上限規制の検証や勤務間インターバル制度の導入など、働き方改革の一層の強化と同時に進めるべきではないですか。大臣のお考えを伺います。" },
        { side: "right", speaker: "上野厚生労働大臣", text: "働くことで命を落としたり健康を損なうということはあってはならないと考えております。裁量労働制の対象のあり方については、健康確保、長時間労働防止、適切な処遇確保などの乱用防止措置を前提に見直しの検討を行うこととされております。同時に、連続勤務規制や勤務間インターバル制度の法的な位置づけ、いわゆる「つながらない権利」のあり方などについても検討を進めることとされており、現在、労政審において労使の皆様のご意見を十分にお伺いしながら議論を進めているところでございます。" },
        { side: "left", speaker: "浅野さとし", text: "企業立病院は、公立病院と同じ救急・周産期・小児などの政策医療を担いながら、法人税や事業税、固定資産税などが全て課税されています。誰が担っているかではなく、どのような医療を担っているかに着目し、政策医療の実績に応じて、企業立病院にも税制上の措置や継続的な財政支援が及ぶ仕組みを検討すべきではないでしょうか。" },
        { side: "right", speaker: "上野厚生労働大臣", text: "医療法の下では、医療機関の開設者は営利を目的とする法人でないことが求められております。企業立病院は、地域の医療機関が不足していた時代背景の下で、主として従業員の福利厚生のために設置されたものに限って認めてきた経緯があり、昭和41年を最後に設立されておりません。こうした考え方に照らせば、株式会社などの営利法人に対して新たに税制措置を設けるというのは、なかなか難しいと考えております。もっとも、地域医療を守る観点から、そうした病院の役割は重要だと認識しておりますので、応援ができる部分があれば応援をしていきたいと考えております。" }
      ],
      memo: "この日の収穫は2つ。技能五輪全国大会の開催転換の経緯が明確になったことと、裁量労働制の議論で労働基準局長が「本質は指摘のとおり」と認め、評価の軸をめぐる論点が残ったこと。肝心の拡大の是非は労政審に委ねられたままで、今年度の実態調査に生産性・創造性の評価軸が入るかどうかが焦点になる。次は今年度の実態調査の結果と労政審の議論を追う。"
    }, {
      date: "2026年10月20日", committee: "衆議院・本会議（政府提出法案への質問）",
      cats: ["money"],
      title: "「年収300万円の崖」はあるのか——支援金の空白を本会議で問う",
      summary: "論点は年内の低所得者対策、支援金の対象外の人への対応、支援金の金額と対象範囲、2029年4月に税率が8%に戻った後の負担、景気条項の是非。総理は景気条項は設けず確実に税率を戻すと明言したが、支援金の満額・上限・下限とモデル世帯の試算は示されなかった。",
      noteUrl: "https://note.com/tamakitext/n/nec530849e15e",
      fullUrl: "full/2026-10-20-asano.html",
      bubbles: [
        { side: "left", speaker: "浅野さとし", text: "国民民主党の提案で実現した「年収の壁」の178万円への引き上げにより、年末調整では働く方々に減税分が戻ります。しかし住民税非課税世帯などには、この恩恵は届きません。電気・ガスの補助も9月で終了しました。来年4月までの間、低所得者対策が示されないままで良いのでしょうか。" },
        { side: "right", speaker: "高市総理", text: "ガソリン・軽油の暫定税率廃止、燃料油補助や電気・ガス料金支援などに取り組んできました。年末調整では納税者1人当たり3万円から6万円の所得税負担軽減をお届けします。予備費の活用も含め、必要なときにはタイミングを逸することなく対応してまいります。" },
        { side: "left", speaker: "浅野さとし", text: "年金で暮らす方や、病気や障害で働けない方は、就業者負担軽減支援金の対象外です。政府は働いていない高齢者などへの対応を2030年までに決めるとしていますが、この空白の間、支援の届かない方々の暮らしをどう守るのか、総理の答弁を求めます。" },
        { side: "right", speaker: "高市総理", text: "令和9年度、10年度は、飲食料品の消費税率の1%への引き下げと支援金の先行的な導入を合わせて行います。令和11年度からの本格導入に当たっては、年金制度や生活保護制度などの既存の社会保障制度での対応との関係を整理し、次期年金法改正が予定されている令和12年までに結論を得ることとしています。" },
        { side: "left", speaker: "浅野さとし", text: "法案には、対象となる年収も金額も書かれていません。支援金の満額はいくらで、年収いくらからいくらまでの方が満額を受け取れるのか。また、年収がいくらを超えると支援金はゼロになるのか、明確にお答えください。下限についても、週10時間以上働き社会保険料を納めている方は対象にすべきだと考えます。" },
        { side: "right", speaker: "高市総理", text: "支援基本額については、純負担率の国際比較、就業促進などの効果などを踏まえつつ、恒久財源の確保と合わせて検討することとしております。諸外国の類似制度の対象者の割合を我が国に当てはめると2000万人程度となり、粗く申し上げれば年収100万円から350万円の収入層の方が概ね2000万人程度です。下限額についても、国会でのご審議を踏まえて検討してまいります。（※満額・上限・下限の具体額はいずれも示されなかった）" },
        { side: "left", speaker: "浅野さとし", text: "2029年4月、食料品の税率は8%に戻ります。年収300万円程度以下の方には支援金が本格支給される一方、それを超える中間層は給付ゼロ。いわば「年収300万円の崖」です。年収300万円、500万円、700万円のモデル世帯で、税率が戻った後の負担がどう変わるのか、政府の試算をお示しください。" },
        { side: "right", speaker: "高市総理", text: "飲食料品の消費税率を8%から1%に引き下げた場合の減収額は、国・地方の合計で年間約4.3兆円、機械的に計算すると国民1人当たり約3万6000円と見込まれます。収入階層別・世帯別にお示しするには様々な仮定を置く必要があり、現段階で特定のモデルケースをお示しすることは適切ではないと考えます。なお、支援金について年収300万円を上限とすると決めた事実はありません。" },
        { side: "left", speaker: "浅野さとし", text: "しかも負担増は2段階で生じます。所得税控除額の178万円までの上乗せは2027年分で終わり、翌年には消費税が8%に戻ります。政府はこの2段階の負担増を認識していたのでしょうか。私たちは所得税控除額の上乗せ措置は恒久化すべきと考えますが、総理の見解を伺います。" },
        { side: "right", speaker: "高市総理", text: "時限的な対応を元に戻すことをもって直ちに負担増とする考え方は、馴染まないと考えております。所得税の基礎控除の上乗せ特例の措置期間が終了したあとのあり方については、就業者負担軽減支援金との関係も含め、その時点の経済、物価状況等を踏まえ適切に判断してまいります。" },
        { side: "left", speaker: "浅野さとし", text: "総理は8%への復帰に景気条項を設けないとしています。一方で、大規模災害などの際は臨機応変に判断するとも答弁されました。税率の操作は時の総理の責任のもとではなく、憲法84条の租税法律主義に基づいて行われるべきです。2年後の税率復元を延期しうる条件を、あらかじめ法律に書くべきではありませんか。" },
        { side: "right", speaker: "高市総理", text: "2年後には責任を持って確実に税率を元に戻してまいります。景気を理由に延期することは考えていないため、国民に信を問うことは想定しておりません。大規模災害や感染症の大規模な拡大といった事態は予見できず、臨機応変に判断すべきものであることから、ご指摘のような条件を法律に盛り込むことは考えておりません。" }
      ],
      memo: "この日の主戦場は「数字があるかどうか」だった。浅野が求めた支援金の満額・上限・下限、モデル世帯の試算、政策の総額はほぼ示されず、総理は「検討中」「お示しすることは適切ではない」を繰り返した。一方で、税収の上振れ（国税で年平均約6兆円）や減税の減収額（年約4.3兆円）には総理自身が数字を出したのも事実。次は委員会審議で、支援金の支給要件がどこまで具体化するかを追う。"
    }] },
  { id: "usuki", cats: [{ id: "infra", label: "交通・インフラ", icon: "🚃", preview: "鉄道貨物の目標は2030年度に221億トンキロ。北海道の黄線区の行方は、令和8年度末の改善方策と新たな協議の場に委ねられた" }], name: "臼木ひでたけ", initial: "臼", dateLabel: "10/23", unread: 1, addedOn: "2026-10-26",
    preview: "北海道の黄線区から船員教育まで。大臣は「令和8年度末までに改善方策」と答えたが、財政の抜本見直しは示されず",
    articles: [{
      date: "2026年10月23日", committee: "衆議院・国土交通委員会",
      title: "黄線区の先行きは令和8年度末の改善方策に——暮らしのライフラインを問う",
      summary: "論点は公共交通のグランドデザイン、鉄道貨物のモーダルシフト、北海道のJR黄線区、二種免許ドライバー、建築確認の長期化、船員養成。黄線区は「令和8年度末までに改善方策を取りまとめ」という期限と協議の場が示された。",
      noteUrl: "https://note.com/tamakitext/n/n63f60dc9833b",
      fullUrl: "full/2026-10-23-usuki.html",
      bubbles: [
        { side: "left", speaker: "臼木ひでたけ", text: "インフラの大規模更新が必要な今こそ、公共交通のグランドデザインを中長期の視点で考え直すべきです。鉄道の大量輸送・定時性など、交通モードごとの特性や長所を発揮できるリデザインが必要ではないですか。" },
        { side: "right", speaker: "井林国土交通大臣", text: "交通政策基本法第5条では、交通はそれぞれの特性に応じて適切に役割分担し、連携することを旨とされています。本年1月に取りまとめた交通政策基本計画のもと、モードごとの特性を考慮しつつ、中長期的な観点からも適切に取り組んでまいりたいと考えております。" },
        { side: "left", speaker: "臼木ひでたけ", text: "鉄道貨物の目標は2030年度に221億トンキロですが、前大綱の目標209億トンキロに対し、2024年の実績は164億トンキロまで減っています。モーダルシフトを確実に進めるため、政府として制度改正や政策誘導が必要ではないですか。" },
        { side: "right", speaker: "井林国土交通大臣", text: "貨物鉄道の輸送量はここ数年おおむね横ばいであり、輸送力の増強や災害対応、荷主が利用しやすい環境整備が課題です。大型コンテナの導入やコンテナホームの拡幅、貨物駅の施設整備を支援し、JR貨物の増発や荷主への働きかけも後押しして、目標達成に全力で取り組みます。" },
        { side: "left", speaker: "臼木ひでたけ", text: "網走・北見から札幌まで約350キロ。北海道の農産品は、重くて単価が安く距離の長い輸送で、鉄道以外では代替が効きません。黄線区を含む鉄路について、防衛関係予算の鉄道維持への活用など、既存の枠組みにとらわれない分野横断的な制度・財政の見直しが必要です。" },
        { side: "right", speaker: "井林国土交通大臣", text: "JR北海道の黄線区については、令和8年度末までに抜本的な改善方策を取りまとめるよう監督命令で求めています。今月からはJR北海道と沿線自治体との協議の場を、国や北海道も関与する形で立ち上げました。まずはこの場で関係者の合意形成に取り組みます。（※防衛関係予算の活用など他省庁に関わる点は、「関係省庁ともしっかり連携しながら取り組む」と述べるにとどまった）" },
        { side: "left", speaker: "臼木ひでたけ", text: "普通二種免許は、旅客の生命・身体の安全を預かるプロのドライバーであることを確認する制度です。タクシーの人手不足対策は急務ですが、利便性や効率性を重視しすぎて安全基準を後退させることのないよう、二種免許を持つドライバーの育成・雇用促進を進めるべきです。" },
        { side: "right", speaker: "井林国土交通大臣", text: "バス・タクシーの運転士不足は極めて喫緊の課題です。二種免許の取得費用の支援、運賃改定手続の迅速化による賃上げの促進、配車アプリ導入やキャッシュレス化への支援などを進めています。安全基準を後退させることなく、あらゆる政策ツールを総動員して取り組みます。" },
        { side: "left", speaker: "臼木ひでたけ", text: "建築物省エネ法の改正後、建築確認や省エネ適判の審査に手戻りが増え、長期化していると現場から聞いています。実態を引き続き把握し、審査が長期化している審査機関への重点的な支援や手続の改善につなげるべきではないですか。" },
        { side: "right", speaker: "井林国土交通大臣", text: "施行から約1年半の時点で改めて実態調査を行い、一定の改善は見られるものの、一部の民間の審査機関では審査日数が長い実態を把握しています。AIを活用した申請図書の事前チェックや審査補助ツールの開発支援などで、円滑化に向けた対策を講じてまいります。" },
        { side: "left", speaker: "臼木ひでたけ", text: "船を作っても、働く人がいなければ意味がありません。船員養成の中核である海技教育機構は、設備の老朽化や教員への対応不足が指摘されています。安定的な船員養成のため、運営交付金などの予算をしっかり確保すべきです。" },
        { side: "right", speaker: "井林国土交通大臣", text: "海技教育機構を取り巻く環境は厳しさを増していると認識しております。令和9年度概算要求において、教員や乗組員の人件費、老朽化した学校施設や練習船の修繕費、訓練に必要な船舶燃料費などを要求しているところであり、必要な予算の確保に努めてまいります。" }
      ],
      memo: "黄線区については「令和8年度末までに改善方策」という期限と、新たな協議の場が示されたのがこの日の具体的な前進。ただ、それは存続・廃止の結論ではなく、財政の負担のあり方も協議行きである。鉄道貨物の目標と現状の開き、防衛予算の活用といった踏み込んだ提案には、大臣は既存の支援策の説明と「関係省庁と連携」で答えるにとどまった。次は協議の場で黄線区の費用負担がどう議論されるかを追う。"
    }] },
  { id: "iizumi", cats: [{ id: "justice", label: "法務・人権", icon: "⚖️", preview: "再犯時に無職だった人は72.2%。保護司は過去最少の4万5033人、拘禁刑のもとで再犯防止の実効性を問う" }, { id: "work", label: "働き方", icon: "💼", preview: "協力雇用主は約2万5000社が登録するも、実際に雇用しているのは約800社。出所者の就労をどう広げるかは示されず" }, { id: "defense", label: "防衛", icon: "🛡️", preview: "欧州3か国の国防規定と兵役制度を現地で調査。「徴兵」への言及は各国の制度説明の報告で、日本への導入提案ではない" }], name: "飯泉嘉門", initial: "飯", dateLabel: "10/23", unread: 2, addedOn: "2026-10-26",
    preview: "再犯時に無職だった人は72.2%。協力雇用主は約2万5000社登録も、実際に雇用しているのは約800社",
    articles: [{
      date: "2026年10月23日", committee: "衆議院・法務委員会",
      cats: ["justice", "work"],
      title: "再犯した人の7割が無職だった——拘禁刑と再犯防止の実効性を問う",
      summary: "論点は拘禁刑の趣旨、保護司のなり手不足と安全対策、出所者の就労支援、刑務作業を通じた技能維持。協力雇用主の実雇用を増やす具体策や数値目標は示されなかった。",
      noteUrl: "https://note.com/tamakitext/n/n5c6c84eff0de",
      fullUrl: "full/2026-10-23-iizumi.html",
      bubbles: [
        { side: "left", speaker: "飯泉嘉門", text: "「罪を憎んで人を憎まず」。出所した人が再犯をしないためには、社会から孤立させず、責任ある社会人として地域に復帰してもらうことが重要です。昨年6月に施行された拘禁刑への一本化、この明治以来の大改革の趣旨・目的を教えてください。" },
        { side: "right", speaker: "佐藤刑事局長", text: "令和4年の刑法等の一部改正により、懲役及び禁錮が廃止されて拘禁刑が創設されました。刑法犯の検挙人員のうち約5割を再犯者が占めていた状況を踏まえ、個々の受刑者の特性に応じた処遇をきめ細やかに行うことを可能にして、より一層の改善更生・再犯防止を図るためです。" },
        { side: "left", speaker: "飯泉嘉門", text: "更生保護の第一線を担う保護司は、今何人ですか。その数は統計開始以来の過去最少で、令和6年5月には大津市で保護観察中の男が担当保護司を殺害する事件も起きました。なり手不足への対策をお聞かせください。" },
        { side: "right", speaker: "滝田保護局長", text: "保護司は令和8年1月1日現在、全国で4万5033人となっており、減少傾向が続いています。本年12月1日施行の改正保護司法には、適任者確保や安全確保のための施策についての国の責務が明記されました。自宅以外の面接場所の確保（公的施設7793箇所）や、1人の対象者を複数の保護司で担当する複数指名制などに取り組んでいます。" },
        { side: "left", speaker: "飯泉嘉門", text: "再犯の要因で一番大きいのは経済苦だと言われてきました。昨今の状況はどのようになっていますか。" },
        { side: "right", speaker: "滝田保護局長", text: "経済的な困窮は再犯に結びつき得る重要な要因の一つであると認識しております。参考になる統計として、令和7年において刑務所に再び入所した者のうち72.2%が、再犯時に無職であったというものがあります。就労を確保できなかったことが再犯の大きな原因になっていると考えられます。" },
        { side: "left", speaker: "飯泉嘉門", text: "民間企業に雇用を求めるだけでなく、「隗より始めよ」で、国や地方公共団体が特別の枠を設けて率先して雇い、再犯防止と経済苦をカバーする。こうした点はいかがでしょうか。" },
        { side: "right", speaker: "滝田保護局長", text: "出所者等を承知の上で雇用する協力雇用主は約2万5000社が登録していますが、実際に雇用しているのは約800社にとどまります。地方公共団体では71団体が保護観察対象者等を雇用する取組を実施し、これまで延べ87名を雇用しました。マッチングや支援の充実で、実際の雇用につながるよう努めてまいります。" },
        { side: "left", speaker: "飯泉嘉門", text: "拘禁刑では刑務作業が義務ではなくなりました。手に職のある受刑者が、施設にいる間に技能やモチベーションを落とさないよう、特性や年齢に応じた対応はどのようになっていますか。" },
        { side: "right", speaker: "山本矯正局長", text: "一人ひとりの受刑者が有する全ての特殊な技能について、その維持に向けた処遇を個々に実施することは、実務上非常に困難です。もっとも、受刑者の技能や職歴等も勘案しながら処遇を実施しており、資格や職歴を生かした作業のほか、つがる塗りや藍染めなど伝統産業の人材養成の作業を通じて、技能の習得と意欲の維持を図っています。" },
        { side: "left", speaker: "飯泉嘉門", text: "拘禁刑の導入は明治以来のパラダイムシフトです。大臣の任期中に「これを成し遂げたのは山下大臣だ」と言われるよう、この大改革への決意表明をお願いします。" },
        { side: "right", speaker: "山下法務大臣", text: "新たな被害者を生まない安全で安心な社会を実現するために、再犯防止の取組は必要です。懲らしめではなく、拘禁刑を通じて更生してもらうことが非常に重要だと考えております。保護司の活動環境の改善や担い手の確保、協力雇用主についてもこの割合をもっと高めるということで、民間の皆さんとも連携しながら力強く政策を進めてまいります。" }
      ],
      memo: "この日明らかになったのは数字の重さだ。保護司は4万5033人で過去最少、協力雇用主は登録約2万5000社に対して実雇用は約800社、再入所者の72.2%は再犯時に無職だった。一方で、実雇用をどう増やすかの具体策や数値目標は示されず、受刑者の技能維持も「困難」との答弁で、大臣の言葉は決意の表明にとどまった。次は改正保護司法が12月に施行された後、保護司の数がどう動くかを追う。"
    }, {
      date: "2026年10月22日", committee: "衆議院・憲法審査会",
      cats: ["defense", "justice"],
      title: "欧州3か国の憲法と国民投票を調査——海外調査の報告と各党の受け止め",
      summary: "憲法審査会の調査団（自民・中道・維新・国民民主・チームみらいの7名）がスイス、ハンガリー、イタリアを訪問した海外調査の報告と、各党委員の意見表明。政府への質疑ではなく、この日に結論や合意はなし。「徴兵」への言及はすべて各国の制度説明の報告で、日本への導入提案ではない。",
      noteUrl: "https://note.com/tamakitext/n/nf18e5c63411c",
      fullUrl: "full/2026-10-22-iizumi.html",
      bubbles: [
        { side: "left", speaker: "古屋圭司団長", text: "調査団は9月2日から13日まで、スイス、ハンガリー、イタリアの3か国を訪問しました。いずれも憲法改正を度々行っている国です。関心事項は、第1に国防・安全保障、第2に緊急事態条項、第3に国民投票の3つで、各国の政府・議会・有識者と意見交換を行いました。" },
        { side: "left", speaker: "古屋圭司団長", text: "スイスの安全保障の基本は中立です。中立を厳格に捉えウクライナ支援を控えるべきだという保守派と、EUの枠組みの下で柔軟に捉えるべきだというリベラル派で理解が分かれているとの説明でした。政府は中立の概念を固定しないことが重要だとして、厳格な中立を憲法に書き込む改正案に反対。帰国後の9月27日の国民投票では反対が7割を占め、改正案は否決されました。" },
        { side: "left", speaker: "古屋圭司団長", text: "ハンガリーの国防の基本原則は、自国軍による個別防衛、NATOによる集団防衛、そして憲法31条1項に定める「すべての国民による祖国防衛の義務」の3つです。同国は2011年の基本法制定後も改正を重ねており、現政権はこの秋から1年半〜2年をかけて新憲法制定のプロセスを進める予定だとの説明でした。一方でハンガリーの要人からは、80年近く改正されていない日本国憲法の安定性への羨望も一様に示されました。" },
        { side: "left", speaker: "古屋圭司団長", text: "ハンガリーの徴兵制について説明を受けました。徴兵制は2004年の憲法改正で「廃止された」と一般的には説明されていますが、それは誤解で、正確には徴兵制の一時停止、すなわち平時における徴兵の廃止であり、有事となった場合は国会はいつでも徴兵制を復活できるとのことでした。ただし、徴兵制の復活に対しては国民の反発が見込まれ、また現時点でもそのような動きはないとのことでした。（※これはハンガリー側の説明を報告したもので、日本への導入提案ではない）" },
        { side: "left", speaker: "古屋圭司団長", text: "イタリア憲法は11条で戦争の「拒絶」を、52条1項で市民の祖国防衛義務を定めています。両条文は合わせて読み、ポイントは「平和を保つための防衛」だとの説明でした。52条2項の兵役義務は2005年に停止され、現在は志願制です。なお国防省の政務次官は「個人的には」と断った上で、市民が軍の価値観を理解するために一定の兵役経験は重要だとの見解を示し、強制ではなく任意の兵役制度の法案を作ったものの、2020年に廃案になったと紹介しました。" },
        { side: "left", speaker: "古屋圭司団長", text: "緊急事態条項について。スイス憲法には議員任期延長の明文規定がなく、学会でも意見が分かれているとのことでした。ハンガリーでは事態が戦争事態・緊急事態・危険事態の3つに整理され、議員任期の延長も可能ですが、国会は政府の緊急命令を廃止でき、「何より早期に選挙を実施すること」が大原則だと強調されました。イタリアでは戦争状態の認定は国会が行い、政府の緊急法律命令は2025年に39件出されるなど増えており、「数が多すぎる点は反省すべき」との認識も示されました。" },
        { side: "left", speaker: "古屋圭司団長", text: "国民投票について。スイスには10万人の署名で国民が憲法改正を発案できる仕組みがあり、直接民主制は国のアイデンティティと結びついているとの認識でした。ハンガリーでは、憲法改正に国民投票を導入することが選択肢として検討されていますが、情報操作への懸念から反対する個人的見解も述べられました。イタリアでは今年3月、司法組織改革の憲法改正が国民投票で否決されました。「国民投票は名称こそ中立的だが、実際はまさに政治的な投票にならざるを得ない」との評価も聞かれました。" },
        { side: "left", speaker: "飯泉嘉門", text: "スイスは職業軍人ではなく、徴兵による民兵が原則の国です。10万人規模の動員には有職者を集めるため1.4倍の14万人が必要になるとの話があり、「職業軍人の方が合理的ではないか」と質問を向けたところ、有職者の知識や技術を軍に活かすことができ、災害対応や警察への支援も可能になるとの答えでした。ただし最近は人を集めづらくなり、銃を持ちたくない人向けの代替任務を選ぶ人が圧倒的になっていて、制度の改編が急務とされている、とのことでした。" },
        { side: "left", speaker: "飯泉嘉門", text: "ハンガリーでは、2011年の改正で平和主義の象徴だった戦争放棄の条項が変わり、「国が国民を守るためには戦争のできる国になる必要がある」とされた経緯について、「国民はどう反応したか」と尋ねたところ、「国民は問題としなかった」との回答がありました。イタリアでは、変えてはならない条文は139条の共和政体のみで、11条と52条は変更不可の規定ではないとの説明を受けました。あわせて、ワイマール憲法が骨抜きにされナチスの台頭を許した歴史的事実も踏まえる必要がある、と考えています。" },
        { side: "right", speaker: "玉木雄一郎", text: "国民投票を考える上では、SNSの影響にしっかりルールを定めることが必要です。認知戦による選挙への介入は、緊迫感の高い国では対応が当たり前になっています。国民投票法でも具体的なルールを深めることを提案します。また、スイスのように投票用紙と解説パンフレットが事前に郵送される仕組みを踏まえ、広報協議会がどういう形で何を伝えるのかを具体的に定めることが極めて重要です。さらに、国民投票が時の政権への信任投票になってしまう問題を避けるため、大型国政選挙と国民投票の同日実施は基本的には避けるべきだと考えます。" },
        { side: "right", speaker: "玉木雄一郎", text: "来年の自民党大会で本当に発議をするのであれば、この臨時国会でどのようなスケジュールで何を議論するか定めてください。また代表質問でも総理に聞きましたが、自衛隊が軍隊なのか否か、ネガティブリストでいけるのかどうかについて、まず与党間で考え方を整理していただきたい。限られた時間で発議に行くのであれば、議論が煮詰まってきた緊急事態条項と合区の解消に絞って進めていただくことをお願いします。" },
        { side: "right", speaker: "新藤義孝（自民党）", text: "ハンガリーの要人からは「憲法を政権の都合で頻繁に改正すれば国は不安定なままだ。長期間改正しなくて済んでいる日本は羨ましい限りだ」との言葉がありました。国家の安定にとって憲法の存在は決定的に重要で、政権が変わっても揺るがない基本原則を定めることが大切だと受け止めました。その上で、時代の変化や国際情勢に応じて必要な憲法の見直しを行っていくことが重要だと、今回の意見交換を通じて実感しました。" },
        { side: "right", speaker: "西村ちなみ（中道）", text: "憲法改正が最優先の課題とは思えません。憲法によって国家権力を制限し、国民の自由や人権を守るのが立憲主義です。改正を権力を持つ側である政府や与党が積極的に提案してくる場合、その理由の正当性、必要性を厳しく判断することは当然だと考えます。団長報告にあった、ハンガリーの要人が日本国憲法の安定性に羨望を示したという点や、憲法が権力維持に利用された経緯は、我が国にとって示唆に富むものでした。" }
      ],
      memo: "この日の中心は「改正を重ねてきた国々から何を学ぶか」で、結論は出ていない。とりわけ切り取られやすいのが「徴兵」という言葉だが、本文の言及はすべて、ハンガリー・イタリア・スイスの担当者が自国の制度を説明した内容の報告であり、日本に徴兵制を導入しようという提案は、報告にも各委員の発言にも存在しない。ハンガリーの説明でも「復活の動きは現時点でない」ことが明記されている。次は審査会で玉木議員が求めた「議論の絞り込みとスケジュール」が示されるかどうかを追う。"
    }] },
  { id: "hashimoto", cats: [{ id: "defense", label: "防衛", icon: "🛡️", preview: "F-2の共食い整備、大臣は「件数は約4割減」と説明。全面解消の時期は示されず、現場の知見を生かす仕組みの見直しが論点に" }], name: "橋本みきひこ", initial: "橋", dateLabel: "10/23", unread: 1, addedOn: "2026-10-26",
    preview: "F-2の共食い整備、大臣は「件数は約4割減」と説明。全面解消には至らず、現場の知見を生かす仕組みの見直しが論点に",
    articles: [{
      date: "2026年10月23日", committee: "衆議院・安全保障委員会",
      title: "「共食い整備」はどこまで減ったのか——元整備員の目で装備の仕組みを問う",
      summary: "論点はF-2の共食い整備の現状と整備員の負担、現場の知見を開発・調達に反映する仕組み、P-1への会計検査院の指摘、GCAPの改修の自由。共食い整備の全面解消の時期は示されなかった。",
      noteUrl: "https://note.com/tamakitext/n/n7103bd964f1b",
      fullUrl: "full/2026-10-23-hashimoto.html",
      bubbles: [
        { side: "left", speaker: "橋本みきひこ", text: "私は航空自衛隊でF-2戦闘機の整備の現場におり、共食い整備（部品が足りず他の機体から部品を取り合う整備）が行われていた部隊にいました。予算も増え、F-2の維持整備費も増やされています。その結果、共食い整備はどこまで減ったのか、大臣から伺いたいと思います。" },
        { side: "right", speaker: "宮本プロジェクト管理部長", text: "F-2戦闘機についても、共食い整備を行う必要がなくなったとは言い難い状況であることは事実です。ただ、必要な部品を適時適切に確保することにより、令和5年度以降は改善傾向にあります。部品の安定供給態勢の構築などを進め、部品不足による非可動の解消に向けて取り組んでまいります。" },
        { side: "left", speaker: "橋本みきひこ", text: "共食い整備では、部品を取り付ける前に別の機体から取り外す仕事や、その記録が増えます。F-2整備部隊の勤務、休養、教育訓練への影響と、その追加作業を防衛省としてどのように把握し、改善しているのか伺いたいと思います。" },
        { side: "right", speaker: "宮本プロジェクト管理部長", text: "共食い整備は部品の取り外し、取り付け、作業内容の記録などを伴うため、整備員に追加的な作業負担が生じ得るものと認識しております。勤務、休養、教育訓練への影響は一定程度あるものと考えております。引き続き、部品の安定供給態勢の構築などを進め、現場の負担軽減に取り組んでまいります。" },
        { side: "left", speaker: "橋本みきひこ", text: "操縦者や整備員の知見、あるいは日本の運用環境を、要求、設計、試験運用にどのように反映しているのですか。開発中だけではなく、量産後の意見によっても改良する仕組みも含めてお答えいただきたいと思います。" },
        { side: "right", speaker: "宮本プロジェクト管理部長", text: "操縦者や整備員といった経歴を持つ隊員を幕僚幹部や防衛装備庁といった中央機関にも配置し、開発の各段階で部隊運用の実態や専門的な知見を踏まえながら、要求内容の具体化、設計、各種の試験、評価を進めてきました。導入後も、不具合や使いにくさがあれば技術的に検討し、必要な改修等につなげる一連の管理プロセスを設けております。" },
        { side: "left", speaker: "橋本みきひこ", text: "海上自衛隊が警戒監視に使っている国産機P-1については、会計検査院が、過去の機種で得た知見が設計に生かされていないという問題を指摘しています。問題を見つけて要求や計画を直していく日本の仕組みそのものを見直す必要があるのではないですか。" },
        { side: "right", speaker: "小泉防衛大臣", text: "F-2戦闘機における共食い整備の件数は、令和4年度と令和7年度を比較した場合に概ね約40％程度減少しています。ただ、撤退してしまった企業がいた時に、その穴を埋めていくサプライチェーンの再構築には、ものすごく時間がかかります。防衛産業こそ防衛力そのものであるという危機感のもと、基盤の強化を政策として進めていきたいと思います。" },
        { side: "left", speaker: "橋本みきひこ", text: "要求の段階で、サプライチェーンも含めた供給態勢を反映していかなければならなかったのではないですか。戦闘機は何十年も使うものです。P-1やF-2であったようなことを二度とやらないということも含め、日本国政府としてメッセージを示していく必要があると思いますが、大臣、いかがでしょうか。" },
        { side: "right", speaker: "小泉防衛大臣", text: "要求の段階から反映するというのは、整備計画局長が各幕と話し、統幕長も含めて全体を見ながら行っています。一方で、不足というのは今の航空機の共食いだけではありません。全体を見た上で、どこを守り、どこに一定程度の改善で理解をいただくかを見極めながら、部隊の精強性とモチベーションが上がっていくように努めていきたいと思います。" },
        { side: "left", speaker: "橋本みきひこ", text: "次期戦闘機GCAPでは、改修の自由を最大限確保しなければなりません。ソフトウェアをアップデートするだけで能力が大幅に変わってくる環境です。特にソフトウェアの改修の自由、私が「ソフトウェア主権」と呼んでいるものについて、各国間で連携していただきたいと思いますが、大臣、いかがでしょうか。" },
        { side: "right", speaker: "小泉防衛大臣", text: "日本として、日本の運用要求の反映や改修の自由に加え、安定した維持整備、部品供給、国内の生産技術基盤を確保することが重要だと考えています。日英伊の3か国でさまざまなレベルで日々協議しており、今、ご指摘のような点も、わが国の利益につながらなければならないという思いで、議論を積み上げていきたいと思います。" }
      ],
      memo: "政府が数字で示したのは「F-2の共食い件数は令和4年度比で概ね約4割減」。ただし件数の絶対数は示されず、共食い整備は陸海空に残っていると大臣自身が認めた。橋本の問いの軸は個別の装備ではなく、現場の知見が要求・設計・評価にどう届くかという仕組み論で、大臣も仕組みの不断の改善の必要性には同感を示した。ただ、独立した評価組織や条約に基づく監査など具体策は先送りされた。次はGCAP交渉で改修の自由と部品供給がどこまで確保されるかを追う。"
    }] },
  { id: "kondo", cats: [{ id: "money", label: "税とお金", icon: "💰", preview: "国債の持ち手を個人へ。個人向け国債は「中途解約でも元本割れなし」の特徴を踏まえ見直しを検討、具体策は「予断をもって申し上げる段階ではない」" }, { id: "work", label: "働き方", icon: "💼", preview: "REVIC「レビキャリ」のマッチングは530件、登録人材は8,190人に。補正予算での拡充が続いてきた事業の継続と当初予算計上を求めた" }], name: "近藤雅彦", initial: "近", dateLabel: "10/21", unread: 1, addedOn: "2026-10-26",
    preview: "国債の持ち手を個人へ。個人向け国債は「中途解約でも元本割れなし」の特徴を踏まえ見直しを検討、具体策は示されず",
    articles: [{
      date: "2026年10月21日", committee: "衆議院・財務金融委員会",
      cats: ["money", "work"],
      title: "国債もNISAで買えるようになる？——国債の個人シフトと元本割れ防止を問う",
      summary: "論点はPBの複数年度管理、国債の個人シフトと個人向け国債の商品性、暗号資産の規制、熊本地震の復興支援ファンド、REVIC「レビキャリ」の実績と予算。国債のNISA対象化という党提案への政府の答弁はなく、見直しの具体策も示されなかった。",
      noteUrl: "https://note.com/tamakitext/n/ne721c953b912",
      fullUrl: "full/2026-10-21-kondo.html",
      bubbles: [
        { side: "left", speaker: "近藤雅彦", text: "総理は、債務残高の対GDP比を安定的に引き下げ、プライマリーバランスは複数年度で管理すると述べました。食料品の消費税減税は令和8年度・9年度のPBに大きく影響します。複数年を単位とする具体的な管理政策はあるのですか。" },
        { side: "right", speaker: "片山財務大臣", text: "飲食料品の消費税率引き下げ等の財源は、特例公債に頼らずに確保すると法律にも明記しております。骨太2026に基づき、PBは債務残高対GDP比の安定的低下と整合するように複数年度で改善管理し、通年の国債発行額を適切にコントロールしてまいる方針でございます。" },
        { side: "left", speaker: "近藤雅彦", text: "金融機関は保有国債の含み損を抱え、国債への投資余力がなくなってきています。マクロの金融市場の観点から、国債の保有者、いわゆる持ち手を個人にシフトさせていく必要について、どのような認識をお持ちですか。" },
        { side: "right", speaker: "阿久澤理財局長", text: "国債の安定消化の観点から、個人を含めた国内外の幅広い投資家に国債を保有していただく努力は一層重要になっていると考えております。骨太方針2026でも個人向け国債の魅力向上による国内投資家層の拡大がうたわれており、商品性の見直しや新商品の設計を早急に具体化していきたいと考えております。" },
        { side: "left", speaker: "近藤雅彦", text: "個人向けに販売する国債について、今後も含めて、満期まで保有すれば額面上元本割れはしない、そういった貯蓄性のある商品設計をお考えなのか、ご検討の状況を教えていただけますか。" },
        { side: "right", speaker: "阿久澤理財局長", text: "具体的な見直し内容につきましては、現時点では予断をもって申し上げる段階ではございません。もっとも個人向け国債は、中途解約をした場合も含めて元本割れがない、また小口での購入が可能であることといった特徴があり、それも踏まえて家計のポートフォリオで選ばれ得る商品となるよう検討を進めてまいります。" },
        { side: "left", speaker: "近藤雅彦", text: "改正金商法で暗号資産の規制は資金決済法から金商法に移管され、施行まで1年以内となりました。インサイダー取引規制や無登録業者への対応、自主規制団体によるルール作りの取り組み状況をお聞かせください。" },
        { side: "right", speaker: "いのうえ企画市場局長", text: "金融庁といたしましては、関連する政令、内閣府令等の策定を鋭意進めるとともに、暗号資産交換業者や自主規制機関において不公正取引にかかる売買審査や利用者保護等のための体制整備が適切に進められるよう、自主規制機関等との緊密な連携を図っているところでございます。" },
        { side: "left", speaker: "近藤雅彦", text: "令和8年熊本地震の復興について、大臣は8月に被災地を訪問され、地域金融機関や経済団体と直接意見交換をされました。どのような課題について要望があり、最大50億円規模の復興支援ファンドの設立や制度設計にどう反映されたのでしょうか。" },
        { side: "right", speaker: "片山財務大臣", text: "平成28年熊本地震や近年の豪雨により「四重苦・4重ローン」の状態に陥り、負担軽減の必要性が非常に高いこと、それから事業再生支援ファンドの組成が必要と、こういった強いご要望をお伺いいたしました。これを踏まえREVICが地元金融機関等と協議を行った結果、10月9日にオール熊本態勢による新たなファンドを設立する方針が公表されました。既往債務の債権買取を主たる支援手段として、多重債務の解消と事業再建を後押しする仕組みです。" },
        { side: "left", speaker: "近藤雅彦", text: "REVICの「レビキャリ」は、昨年末316件から今年9月には500件まで伸びてきており、政府は2027年度までに登録人材1万人を目標に掲げています。人口減少下の地域経済を支える恒常的な取り組みとして、これまでの事業予算や実績状況を確認させてください。" },
        { side: "right", speaker: "いしだ銀行証券監督局長", text: "レビキャリは地域の中堅・中小企業の経営人材確保を目的に、令和3年10月から実施している事業でございます。これまで補正予算で実施してきておりますが、直近の令和7年度補正予算では約15億円を計上しております。本年9月末時点で、大企業人材の登録者数が8,190名、活用する地域金融機関が264機関、実現したマッチング数は530件となっております。" }
      ],
      memo: "この日の軸は「国債を誰が持つのか」。金融機関の国債投資余力が細る中で、財務省は個人を含む幅広い投資家層の拡大を「一層重要」と認め、個人向け国債の見直しを「早急に具体化」と一歩踏み込んだ。一方で見直しの中身は「予断をもって申し上げる段階ではない」とされ、国債のNISA対象化という党提案への直接の言及もなかった。次は商品性の見直し案と、暗号資産規制の政令等がいつ姿を見せるかを追う。"
    }] },
  { id: "hamano", cats: [{ id: "money", label: "税とお金", icon: "💰", preview: "国債は日銀当座預金で買われ、政府支出で預金が生まれる——日銀は実務の仕組みを確認したが、「財政は破綻しない」との結論までは示されず" }, { id: "health", label: "医療・福祉", icon: "🏥", preview: "年金のマクロ経済スライドを物価連動に変えるべきだと提案。厚労大臣は「やめれば将来世代の給付水準が低下する」と現行維持の立場" }], name: "浜野よしふみ", initial: "浜", dateLabel: "10/19", unread: 1, addedOn: "2026-10-26",
    preview: "国債は日銀当座預金で買われ、政府支出で預金が生まれる——日銀は実務の仕組みを確認したが、「財政は破綻しない」との結論は示されず",
    articles: [{

      cats: ["money", "health"],
      title: "「国債は日銀当座預金で買われている」——財政の実務を日銀に一つずつ確認",
      summary: "論点は経済停滞の現状認識とPB黒字化目標、国債・日銀当座預金・マネーストックの実務の仕組み、令和8年度予算の規模、消費税減税の財源。日銀は実務の仕組みを確認したが、「国債が増えても財政は破綻しない」との結論は示されなかった。",

      fullUrl: "full/2026-10-19-hamano.html",
      bubbles: [
        { side: "left", speaker: "浜野よしふみ", text: "国民民主党は30年余りの経済停滞から、何としても早期に抜け出さなければならないと考えております。まず総理に伺います。30年余りの経済停滞について、脱却しつつあると思っておられるのか、現状認識をお伺いします。" },
        { side: "right", speaker: "高市総理", text: "30年近く続いたデフレ的な経済構造と、働いても賃金が上がらない時代を経験してきました。ただ足元では、春季労使交渉で3年連続5%台の賃上げ、2025年度の設備投資は128兆円と過去最高水準に達し、成長の好循環に踏み出せるかどうかの分岐点に立っていると思っております。" },

        { side: "right", speaker: "植田日銀総裁", text: "一時的な要因を除いた基調的な物価上昇率は徐々に高まってきており、足元では2%にかなり近づいていると評価しております。その上で現在は、基調的な物価上昇率を2%程度の水準に安定させていくという観点がより重要な局面になっています。" },
        { side: "left", speaker: "浜野よしふみ", text: "骨太の方針でプライマリーバランス黒字化を中核的な指標から外したことを評価します。総理に伺います。PB黒字化目標により、本来必要な投資までが抑制されてきたものと理解しますが、見解を伺います。" },
        { side: "right", speaker: "高市総理", text: "単年度のプライマリーバランス黒字化そのものを目標にしてしまうと、国が必要かつ緊要性の高い投資まで抑制することになるという問題意識を持ち続けてまいりました。PBが足元でほぼ均衡する中、今後は複数年で管理してまいります。" },
        { side: "left", speaker: "浜野よしふみ", text: "骨太の方針は「政府財政の持続可能性」を追求するとしていますが、そもそも政府財政の持続可能性が失われることがあるのか疑問です。持続可能性との両立などと言わず、強い経済を徹底的に追求すべきではないですか。" },
        { side: "right", speaker: "高市総理", text: "強い経済と財政の持続可能性は二者択一ではありません。必要な政策や改革は先送りせず、強い経済と財政の持続可能性をともに実現する新しい経済財政運営を始めてまいるということです。" },
        { side: "left", speaker: "浜野よしふみ", text: "ここからは日銀に実務の実態を一つ一つ確認します。国債を購入する代表的存在である民間金融は、日銀当座預金によって国債を購入していると考えますが、見解を伺います。" },
        { side: "right", speaker: "なかむら日銀理事", text: "民間金融機関が日銀当座預金などに手元資金を潤沢に保有している場合、通常は委員ご指摘の通り日銀当座預金を使って国債を購入すると考えられます。手元資金が不足する場合は、短期金融市場等で必要な資金調達を行い、その資金を使って購入することになります。" },
        { side: "left", speaker: "浜野よしふみ", text: "民間金融が国債を購入すると、政府では政府預金と国債が同額増え、日銀では当座預金が減り政府預金が増え、民間金融では国債が増え当座預金が減り、企業・家計は変化なし。各部門のバランスシートはこのように変化すると考えますが、いかがですか。" },
        { side: "right", speaker: "なかむら日銀理事", text: "ただいま委員がご指摘された通りのことでございます。" },
        { side: "left", speaker: "浜野よしふみ", text: "民間金融が国債を購入しても、当座預金が国債に置き換わるだけで、世の中に出回っている預金、すなわちマネーストックを吸い上げることにはなっていないと考えますが、見解を伺います。" },
        { side: "right", speaker: "なかむら日銀理事", text: "この点につきましても委員ご指摘の通りでございます。" },
        { side: "left", speaker: "浜野よしふみ", text: "日銀は民間金融の国債を購入し、日銀当座預金を供給することにより、金利を下げることができると考えますが、見解を伺います。" },
        { side: "right", speaker: "なかむら日銀理事", text: "大規模な国債買入れは、金利全体の低下を通じて経済・物価を押し上げる効果を発揮したと考えております。ただし現在は短期金利の操作を主たる手段としており、国債買入れが財政資金の調達をサポートしていると市場に受け止められれば、長期金利が不安定化する可能性がある点には留意が必要です。" },
        { side: "left", speaker: "浜野よしふみ", text: "政府が財政支出をすると預金が生み出されるのが実態だと考えます。また、日銀がマネーストックと呼ぶ貨幣は、政府支出と銀行の貸付という2つのルートで生み出されていると理解しますが、いかがですか。" },
        { side: "right", speaker: "なかむら日銀理事", text: "国債を民間金融機関が購入する場合、財政支出が行われた段階で民間金融機関の負債側に同額の預金が発生し、信用創造が行われることになります。マネーストックは主として政府支出と銀行貸出によって生み出されていると考えております。" },
        { side: "left", speaker: "浜野よしふみ", text: "財政支出を無制限に行えるわけではなく、需要が供給を大きく上回る過度なインフレは避けなければなりません。日銀総裁に伺います。財政支出と物価の関係について、どう考えるべきでしょうか。" },
        { side: "right", speaker: "植田日銀総裁", text: "財政支出は総需要に働きかけることで景気を刺激し、需給ギャップや労働需給が改善すれば、物価や賃金の上昇につながります。他方、こうした支出が供給力の向上にもつながる場合には、長い目で見れば物価上昇圧力を抑制する方向に作用することも考えられます。" },
        { side: "left", speaker: "浜野よしふみ", text: "財務大臣に伺います。令和8年度予算は前年度と比べ、歳入は税収・その他収入合わせて0.4兆円の減、歳出は一般歳出・地方交付税交付金等合わせて11.1兆円の減です。相当な緊縮になってしまっていると理解しますが、見解を伺います。" },
        { side: "right", speaker: "片山財務大臣", text: "比較は「令和7年度補正予算と令和8年度当初予算の合計額」と、前年度側の補正・当初予算の合計額で行うことが適切と考えております。その合計では、一般歳出と地方交付税交付金等の合計額は約109兆円と約7兆円の増加となっており、緊縮とのご指摘は当たらないと考えております。（※浜野議員は「比べるのは令和8年度予算と令和7年度予算が当然」と反論し、令和8年度中の追加支援を求めた）" },
        { side: "left", speaker: "浜野よしふみ", text: "消費税減税の財源確保について、特例公債の発行はしないとされています。これこそ従来の延長線上の考え方ではないでしょうか。必要に応じて国債を発行することは真っ当な対応と考えますが、見解を伺います。" },
        { side: "right", speaker: "高市総理", text: "財源は歳出・歳入両面の見直しを進めるとともに、債務残高対GDP比を安定的に引き下げていく中で可能となる財政規模を精査し、当初予算と補正予算を通じた通年の国債発行額を適切にコントロールいたします。これは国債の発行を否定するものではありません。" }
      ],
      memo: "この日の質疑の型は「確認」だった。浜野議員がバランスシートの変化を一項目ずつ読み上げ、日銀理事が「委員ご指摘の通り」と応じる場面が続いた。ただし確認されたのは、国債の売買や政府支出が当座預金と預金をどう動かすかという実務の仕組みまでで、「だから財政は破綻しない」という結論を日銀や政府が述べたわけではない。次は令和9年度予算の編成と、浜野議員が求めた令和8年度中の追加支援（補正予算）の有無を追う。"
    }] },
  { id: "hamaguchi", cats: [{ id: "money", label: "税とお金", icon: "💰", preview: "支援金の対象・水準・子ども加算は示されず「政令で定める」。農家の減収額も政府は未把握で、具体策は予算編成過程に先送り" }, { id: "infra", label: "交通・インフラ", icon: "🚃", preview: "高速道路のワンコイン500円定額乗り放題と1年間の実証実験を提案。政府は他の交通機関への影響や道路債務を理由に、実験にも慎重な姿勢" }], name: "浜口誠", initial: "浜", dateLabel: "10/16", unread: 1, addedOn: "2026-10-26",
    preview: "農家の減収額は政府も「数字を持っていない」。支援金の対象・金額も示されず、具体策は予算編成過程へ先送り",
    articles: [{
      date: "2026年10月16日", committee: "参議院・予算委員会",
      cats: ["money", "infra"],
      title: "「具体策はまだ白紙」——置き去りの農家と外食、支援金の骨格を問う",
      summary: "論点は減税の実施時期、農家・外食への支援、支援金の制度骨格と中間層の負担増、高速道路の定額制。農家の減収額は政府も「具体的な数字を持っていない」とし、支援金の対象・金額・子ども加算は政令で定めるとされた。",
      noteUrl: "https://note.com/tamakitext/n/n9a50a5972438",
      fullUrl: "full/2026-10-16-hamaguchi.html",
      bubbles: [
        { side: "left", speaker: "浜口誠", text: "食料品の値上げは昨年・今年とも年2万品目規模で、電気・ガス代の補助も終了しました。来年4月の消費税減税では遅い。今年度中に家計を守る支援策を実施すべきではないですか。" },
        { side: "right", speaker: "高市総理", text: "今年度中に給付をするということについては、現時点で考えておりません。給付には過去の例で6か月から8か月程度はかかり、今年度中に行き渡らせるのは非常に難しい。年末調整で1人3万円から6万円が戻りますし、来年4月から実行できるのが最速だと思います。" },
        { side: "left", speaker: "浜口誠", text: "今回の食料品の消費税減税によって、農林水産事業者の収入が全体でどの程度減る見通しですか。農林水産省として減収額の全体像を把握しているのか、確認したいと思います。" },
        { side: "right", speaker: "武部農林水産大臣", text: "どれだけの減収があるかということは、まだ具体的な数字を持っているわけではございません。個々の事業者で経営規模が異なりますので、税制の考え方や本則課税で還付を受ける場合とのバランスを踏まえつつ、経営継続の観点から合理的な水準となるよう検討してまいりたいと思います。" },
        { side: "left", speaker: "浜口誠", text: "農家の皆さんは心配しています。減収した分は支援金でカバーし、減税する前と同じ収入が確保できる、安心できる制度にしていただきたい。その点、総理いかがですか。" },
        { side: "right", speaker: "高市総理", text: "経営継続が困難とならないよう、個別の売上高を踏まえた金額を給付する仕組みを導入する方針を、先般閣議決定した大綱に明記しております。その考え方のもと、給付金の水準も含めて、関係者のご意見に耳を傾けながら、予算編成過程で現場の納得が得られるよう支援内容をしっかり具体化いたします。（※「減収分をカバーする」との明言はなかった）" },
        { side: "left", speaker: "浜口誠", text: "外食産業への支援は「的確な支援」と言うだけでは分かりません。居酒屋の倒産が過去最高の水準です。プレミアム商品券やGo To Eatのような需要喚起策を求める声に、政府はどう答えるのですか。" },
        { side: "right", speaker: "武部農林水産大臣", text: "外食にも様々な業態があり、生じる影響もそれぞれ異なります。事業者の実情を確認しつつ、実際に影響を受ける方々に向けて的確な支援を講じることが重要だと考えております。ご指摘のプレミアム商品券やGo To Eatも含めて、過去の取り組みの成果や課題を踏まえながら有効な対策について検討を深め、予算編成過程の中で支援内容を具体化してまいりたいと思います。（※総理も、予算編成の中で実施する可能性はあるとの認識を示した）" },
        { side: "left", speaker: "浜口誠", text: "2029年4月から導入される就業者負担軽減支援金は、支給が始まる所得、金額の水準、子ども加算、対象の所得上限がまだ見えていません。就労者の約3割・2000万人が対象になるなら、今の給与所得の分布では年収300万円程度が目安になるのではないですか。" },
        { side: "right", speaker: "片山担当大臣", text: "所得下限については、国民会議で被用者保険の適用ラインを超える給与収入約106万円超などのご意見がありました。所得上限は、純負担率の国際比較では、夫婦と子ども2人の世帯で世帯収入510万円以下の場合に我が国の純負担率が高くなっており、こうしたデータを参考に、恒久財源の確保と合わせて検討してまいります。「300万円」という報道は、この510万円からの想像ではないかと思います。" },
        { side: "left", speaker: "浜口誠", text: "2年後、消費税率が1%から8%に戻れば中間層は年3.6万円の負担増、所得税の基礎控除の上乗せ特例が終われば年3万から6万円の負担増、そして支援金は対象外。これらを合わせれば年7万から10万円の「トリプルパンチ」です。しっかり認識して対策を講じるべきです。" },
        { side: "right", speaker: "高市総理", text: "時限的な対応を元に戻すことをもって直ちに負担増とする考え方は、馴染まないと思っております。税率を戻す際には支援金により、中所得・低所得の現役勤労者は所得に応じてこれまでより一層手取りが増え、その大宗は消費税率引き下げの効果を上回る支援を受けられるようになります。所得税の上乗せ特例の終了後のあり方も今後検討していくので、決め打ちの「トリプルパンチ」とのご指摘は当たらないと考えております。" },
        { side: "left", speaker: "浜口誠", text: "高速道路を活用して地方を活性化するため、ワンコイン500円で距離に関係なく定額乗り放題の料金制度を提案します。せめて1年間、定額制の実証実験を行い、渋滞や他の交通機関への影響をデータで検証すべきではないですか。" },
        { side: "right", speaker: "井林国土交通大臣", text: "ご提案の定額制については、距離に応じた運賃となる鉄道、航空機など他の交通機関への影響、高速道路への過度な交通集中、老朽化対策や防災・減災対策の安定的な実施、道路債務の返済への影響などを踏まえると、1年間に限定した社会実験だったとしても、慎重に考えていく必要があると考えております。（※総理も同様の課題を挙げ、対距離制を基本とする考えを示した）" }
      ],
      memo: "この日の軸は「決まっていることと、決まっていないことの差」だった。総理は財源について「規模が見えている」「2年分は心配していない」と自信を示し、Go To Eatなどの実施可能性にも触れた。一方、農家の減収額は大臣が「具体的な数字は持っていない」と認め、支援金の対象・水準・子ども加算は政令事項として先送りされた。次は委員会審議で支援金の目安となる数字がどこまで示されるかと、予算編成過程で農家・外食支援がどう具体化するかを追う。"
    }] },
  { id: "nagatomo", cats: [{ id: "disaster", label: "防災・被災", icon: "⛑️", preview: "被災地で痛感した「支援したい人をつなぐ仕組みがない」。全国統一の災害支援登録制度と個人ボランティアの身分証を提案、創設の約束は得られず" }, { id: "agriculture", label: "農業・食料", icon: "🌾", preview: "い草の織機・作業場の再取得には最大10分の9の補助。米国産生鮮ばれいしょは「合意がなければ解禁されない」と局長が明言" }], name: "長友しんじ", initial: "長", dateLabel: "10/14", unread: 1, addedOn: "2026-10-26",
    preview: "被災地で痛感した「支援したい人をつなぐ仕組みがない」。全国統一の災害支援登録制度と個人ボランティアの身分証を提案、上限額の引き上げは示されず",
    articles: [{
      date: "2026年10月14日", committee: "衆議院・予算委員会",
      cats: ["disaster", "agriculture"],
      title: "「支援したい人」をつなぐ仕組みを——災害支援登録制度の創設を提案",
      summary: "論点は令和8年熊本地震の応急修理（住宅・井戸とも上限75万7000円）と井戸の復旧体制、全国統一の災害支援登録制度の提案、い草農家への支援、米国産生鮮ばれいしょ輸入。登録制度の創設は約束されず、身分証は「検討させていただきたい」の段階。",
      noteUrl: "https://note.com/tamakitext/n/n41d482d94cfa",
      fullUrl: "full/2026-10-14-nagatomo.html",
      bubbles: [
        { side: "left", speaker: "長友しんじ", text: "令和8年熊本地震で被災した住宅の応急修理は、半壊以上で上限75万7000円です。しかし物価高の中、この上限では十分な復旧はできないとの声が現地から上がっています。資材価格に応じた支給上限額の増額が必要と考えますが、総理の見解を伺います。" },
        { side: "right", speaker: "高市総理", text: "応急修理の限度額は物価動向を踏まえて毎年見直しを行っており、適切に対応してまいります。また熊本では地下水への依存が高い特殊な状況を踏まえ、住宅の応急修理に加えて、井戸の修理についても別途75万7000円を上限に支援を実施しております。" },
        { side: "left", speaker: "長友しんじ", text: "井戸の復旧には100万円、場合によっては200万円かかります。八代市では約4400個の井戸が被災し、掘削業者は順番待ちで「復旧に2年かかる」との声もあります。業者を被災地に集約するなど、掘削をスムーズに進める取り組みを強化していただきたい。" },
        { side: "right", speaker: "細野防災担当大臣", text: "給水については災害救助法に基づき給水ポイントを増やし、高齢者など要配慮者への配慮を熊本県と協議しています。井戸の工事ができる業者は県内に限られるため、全国から業者の皆さんに集まっていただく呼びかけを行い、県外業者の掛かり増し費用についてもしっかり支援する態勢で対応してまいります。" },
        { side: "left", speaker: "長友しんじ", text: "被災地で痛感したのは、支援したい人材を平時から把握し、必要な地域へ迅速につなぐ仕組みが不十分だということです。自治体を窓口とした全国統一の「災害支援登録制度」を創設し、支援者の能力や経験を平時から把握する体制を整えるべきと考えますが、大臣の見解を伺います。" },
        { side: "right", speaker: "細野防災担当大臣", text: "現在、二つの制度が動いております。一つは昨年の災害対策基本法で創設した「被災者援護協力団体登録制度」で、現在38団体が登録しております。もう一つは「避難生活支援リーダー・サポーター研修」で、修了者はまだ1800人ということでございます。貴重なご提案ですので、この二つの制度が動くように前に進めてまいりたいと思います。" },
        { side: "left", speaker: "長友しんじ", text: "サポーター研修の修了者は1800人とのことですが、何人ぐらいまで増やせれば理想だとお考えですか。" },
        { side: "right", speaker: "細野防災担当大臣", text: "指定避難所の数から逆算すると、数万人、もしくはさらに多くの規模にならないといけないと考えています。仕事を持つ方々が災害時にできるだけフルに関わっていただけるような仕組み作りも含めて、南海トラフにも耐えうる避難所を作ることを目指していかなければならないと思っております。" },
        { side: "left", speaker: "長友しんじ", text: "現行の登録制度は団体が対象で、実際に活動する個人の身分保障につながっていません。県外から駆けつけた支援者が不審者と間違われる場面も現地でありました。自治体が責任を持って本人確認を行い、全国共通で使用できる災害支援者の掲示物や章標を発行する仕組みを作っていただきたい。" },
        { side: "right", speaker: "細野防災担当大臣", text: "身分証みたいなものがあると被災された方も安心だと思いますので、もう少し制度化することによって、現場で示せるようなものというのは検討の余地があると思います。非常に貴重なご提案だと思いますので、しっかり中で検討させていただきたいと思います。" },
        { side: "left", speaker: "長友しんじ", text: "い草の産地・八代市では、収穫後のい草を保管する小屋が全壊し、専用の織機も被害を受けました。現地では8軒のうち7軒の生産者が離農を考えていると聞きました。前年の大雨被害とも重なり、このままでは国産のい草は消滅の危機を迎えます。産地と関連業界への手厚い財政支援が必要です。" },
        { side: "right", speaker: "簗農林水産大臣", text: "織機等の機械や作業場の修繕、再取得に向けた支援を手厚くするため、国の補助に県、市、町の上乗せをいただいて、最大で10分の9まで補助率を高めた事業を措置してございます。製織作業を再開するために織機やい草を別の場所に移送したり、共同の製織作業をする場所を確保したりすることも、併せて支援してまいります。" },
        { side: "left", speaker: "長友しんじ", text: "米国産の一般流通用の生鮮ばれいしょは、消費者の手元に広く届き、病害虫の侵入経路はこれまでとは次元が異なります。最終判断の前倒しも報じられていますが、他国の事例だけで安全性が確保されたと判断すべきではありません。植物防疫と国内生産基盤を最優先に、慎重な検討を行うべきです。" },
        { side: "right", speaker: "おおしま消費・安全局長", text: "一般家庭で使用されることや、栽培に使われる可能性もあり得るということは認識しております。転用されるリスクを加味した病害虫リスク評価を行い、我が国の農業に悪影響を与えるおそれがある21種の病害虫を特定し、先般公表いたしました。双方が納得できる合意が見出されない限りは、輸入が解禁されることはないというのが基本姿勢でございます。" }
      ],
      memo: "この日の軸は、長友議員自身の「現場の目」だった。2週間のボランティアで見た給水の負担、支援者が不審者と間違われる場面、い草農家の離農の意向まで、数字と事例の大半は議員の現地報告に基づく。政府の答弁は、応急修理の上限引き上げには踏み込まず、登録制度も「既存の二つの制度を前に進める」で応じ、新制度の創設は約束されなかった。次は身分証の検討結果と、11月に設置される防災庁のもとで登録制度がどう設計されるかを追う。"
    }] },
  { id: "fukuda", cats: [{ id: "health", label: "医療・福祉", icon: "🏥", preview: "費用対効果評価59品目で薬価の引き上げはゼロ。救急救命士のアドレナリン投与は、検討会で追加の方針が了承され令和8年度末までに結論へ" }, { id: "money", label: "税とお金", icon: "💰", preview: "病院が払いっぱなしの「控除対象外消費税」。総理は診療報酬の上乗せで全体として100％超の補填と説明、ゼロ税率化は「課税への転換が大きなハードル」と大臣" }], name: "福田とおる", initial: "福", dateLabel: "10/14", unread: 1, addedOn: "2026-10-26",
    preview: "「補填率は全体で100％超」と総理、福田は「問題は平均でなく分散」と反論。費用対効果評価59品目で薬価の引き上げはゼロだった",
    articles: [{
      date: "2026年10月14日", committee: "衆議院・予算委員会",
      cats: ["health", "money"],
      title: "「補填率は平均100％超、でも現場は足りない」——医療の消費税と薬価を問う",
      summary: "論点は医療機関の「控除対象外消費税」と補填のばらつき、病院の建て替え支援、薬価改定と費用対効果評価、高齢者救急、救急救命士のアドレナリン投与。補填率は医科全体で100％超と総理が説明し、ゼロ税率化は「非課税から課税への転換が大きなハードル」とされた。",
      noteUrl: "https://note.com/tamakitext/n/n9dbcc7aa0a88",
      fullUrl: "full/2026-10-14-fukuda.html",
      bubbles: [
        { side: "left", speaker: "福田とおる", text: "医療機関はCTやMRIから注射器1本まで、すべて消費税を払って購入しています。一方で保険診療は非課税で、患者さんから消費税を受け取ることができず、払った消費税の還付も受けられません。この「控除対象外消費税」で、多くの医療機関、特に大病院・急性期病院の経営が圧迫されている実態を把握していますか。" },
        { side: "right", speaker: "高市総理", text: "社会保険診療は非課税で仕入税額控除ができないため、診療報酬に仕入れ時の消費税額相当分を上乗せして手当てをいたしております。補填率の調査では、直近の令和6年度で病院と一般診療所を合わせた医科全体では100％を超えており、全体としては必要な手当てがなされていると考えております。一方で、個々の医療機関の間で補填の状況にばらつきが生じ得ることも認識しております。" },
        { side: "left", speaker: "福田とおる", text: "問題は平均ではなく分散です。高額な機器を買い難しい手術を担う大病院は、払う消費税が大きいのに外来が少なく、初診料・再診料の上乗せでは補填がまったく足りません。まず補填率を平均ではなく分散で確認してください。その上で、保険診療を非課税ではなく0％税率にして還付を受けられるようにすべきです。0％税率による還付と診療報酬による補填、どちらが実態に近い数字になりますか。" },
        { side: "right", speaker: "上野厚生労働大臣", text: "推計・検証をより精緻化し、実情に近づける努力はこれからもやってまいります。税制上の措置で個別具体的に把握した方がより正確ではないか、という考え方もあり得ますが、社保診療を課税化することは消費税の本質にも関わり、0％が適切か、他の非課税項目との関係、事業主の負担など課題は多岐にわたります。非課税から課税への転換自体が非常に大きなハードルであり、慎重に検討すべき課題だと考えております。" },
        { side: "left", speaker: "福田とおる", text: "地域医療構想のガイドラインでは、救急の実績が地域で一番の病院でも、建物が老朽化し経営状況が悪ければ急性期拠点機能を担えない場合があると読めます。築40年を超える病棟は全国に1600あり、建築費用は10年前の約1.88倍です。地域に欠かせない医療機関の建て替えや改修を、十分な金額で補助してもらえませんか。" },
        { side: "right", speaker: "上野厚生労働大臣", text: "基金や福祉医療機構（WAM）の融資などを通じて、施設整備の支援を行ってまいりました。骨太の方針2026でも、老朽化・災害対策を含む地域に不可欠な施設の計画的な整備への必要な支援のあり方を検討するとされており、令和9年度の概算要求として事項要求を行っております。将来需要を踏まえ、地域で必要な医療を受けられる体制を、施設整備の面からもしっかり応援できる体制をとってまいります。" },
        { side: "left", speaker: "福田とおる", text: "骨太の方針2026は革新的新薬のイノベーションのさらなる評価を掲げていますが、薬業界の現場からは「さらに締め上げるのか」という声が聞こえてきます。総理は来年度の中間年薬価改定を明言されています。国民の命を守る薬を確保し、薬業界を支えるために、どのような薬価改定を行うのですか。" },
        { side: "right", speaker: "高市総理", text: "薬価制度については、革新的な新薬について特許期間中の薬価を原則として維持し、製品の特性に応じた有用性を評価して薬価に反映してきました。令和9年度の薬価改定については、骨太方針2026を踏まえ、創薬イノベーション、医薬品の安定供給、国民負担の軽減の観点から必要な対応を検討してまいります。（※福田議員が「評価を上げる、つまり薬価を上げるということで間違いないか」と確認したのに対し、上野大臣は「革新的な医薬品についてはイノベーションの評価を行っていくことが大事」と述べるにとどまり、薬価の引き上げ自体は明言しなかった）" },
        { side: "left", speaker: "福田とおる", text: "費用対効果評価で保険収載の直後に薬価が下げられては、製薬業界の成長や市場の魅力が大きく損なわれます。これまで費用対効果評価が終了したのは何品目で、薬価が引き上がったもの、維持となったもの、引き下げとなったものはそれぞれ何件ですか。" },
        { side: "right", speaker: "上野厚生労働大臣", text: "平成31年に制度を導入して以降、令和8年10月13日までに59品目の医薬品に対して評価を実施いたしました。そのうち13品目で価格を維持し、46品目で価格の引き下げとの結果となっております。なお、価格を引き上げる条件については令和8年度から明確化するなど、制度的には価格の引き上げが十分可能な仕組みとなっていることは申し添えさせていただきます。（※福田議員はこの答弁を受け、「引き上がったものはゼロ」と指摘した）" },
        { side: "left", speaker: "福田とおる", text: "ガイドラインは、高齢者救急の地域急性期機能と急性期拠点機能を1つの医療機関が担わない前提ですが、軽症から重症まで限られた救命救急センターが受けている地域は多く、役割分担が本当に実現するか懸念があります。高齢者救急は、認知症などで病歴があてにならず、診断自体が非常に難しい医療です。今後は専門医の少ない医療機関が担っていきます。急性期拠点機能だけでなく、高齢者救急・地域急性期機能にも十分な診療報酬上の評価をすると約束いただけませんか。" },
        { side: "right", speaker: "上野厚生労働大臣", text: "高齢者救急は、入院の早期からリハビリテーションや在宅医療・介護との連携など「治し支える医療」が求められる、大変重要な医療だと考えております。2040年に向け需要はますます高まると想定され、令和6年度の診療報酬改定においても一定の入院料等を新設したところであります。地域の実情に応じて高齢者救急の位置づけを明確にしていただく必要があり、重要な部分を担っていただくところについて、しっかり応援ができるような体制が必要かと考えております。（※診療報酬上の「十分な評価」を約束するという形の明言はなかった）" },
        { side: "left", speaker: "福田とおる", text: "アナフィラキシーで、我が国では年間50名から70名が命を落としています。救急救命士がアドレナリンを打てるよう、実証事業は「有害事象の報告はなく、安全に完了した」と7月の検討会資料にあります。この命を救う1本の注射、いつ頃から始めることができそうでしょうか。" },
        { side: "right", speaker: "上野厚生労働大臣", text: "救急救命士の処置の範囲にアナフィラキシーに対するアドレナリンの筋肉内投与を追加することについては、令和5年度と6年度に研究・実証を行い、令和7年度には一部地域で時限的に実証を行っております。本年7月の検討会において、医師の具体的指示のもとで実施される救急救命処置として追加する方針が構成員により了承され、現在、関連通知の発出に向けて準備を進めているところでございます。規制改革実施計画では「令和8年度末までに結論を得て速やかに措置をする」とされておりますので、そうしたスケジュール感を前提に作業を進めてまいります。（※具体的な開始時期の明示はなかった）" }
      ],
      memo: "この日の軸は「全体の平均と、現場の実態のずれ」だった。総理は補填率が医科全体で100％を超えると数字で応じ、福田議員は「問題は平均ではなく分散だ」と切り返した。ゼロ税率化には、大臣が「非課税から課税への転換自体が大きなハードル」と最大の壁を名指ししつつ、導入の約束には至らなかった。いちばん硬い数字が出たのは費用対効果評価で、59品目のうち引き上げはゼロ。一方、救急救命士のアドレナリン投与は「令和8年度末までに結論」という、この日もっとも具体的な日程が示された。次は中間年薬価改定の議論でイノベーション評価がどう扱われるかと、アドレナリン投与の通知発出を追う。"
    }] },
  { id: "muraoka", cats: [{ id: "agriculture", label: "農業・食料", icon: "🌾", preview: "備蓄米は100万トン程度への回復を総理も「必要」と答弁。食料品の消費税減税で影響を受ける農業者への給付は、方針は示されたが具体化は予算編成過程に" }, { id: "disaster", label: "防災・被災", icon: "⛑️", preview: "避難所になる学校体育館の空調設置率は31.7%。クマ出没は4〜8月で1万9789件、通学の安全に向けスクールバスの要件緩和を概算要求中" }, { id: "money", label: "税とお金", icon: "💰", preview: "免税・簡易課税の農業者への給付方針は大綱に明記。ただし給付割合「5.4%」は未決定と財務大臣が明言し、還付の実施体制も具体化の途中" }], name: "村岡としひで", initial: "村", dateLabel: "10/14", unread: 1, addedOn: "2026-10-26",
    preview: "備蓄米の100万トン回復は総理も「必要」と答弁。農業者への給付や体育館エアコンの具体策はこれから",
    articles: [{
      date: "2026年10月14日", committee: "衆議院・予算委員会",
      cats: ["agriculture", "disaster", "money"],
      title: "「どこに住んでも、命と暮らしに格差を生じさせてはいけない」——農業支援・体育館エアコン・クマ対策を問う",
      summary: "論点は農業者の給付と備蓄米、避難所となる体育館のエアコン、GX戦略地域とデータセンター、クマ対策とスクールバス、火葬場。備蓄米の100万トン回復は総理も「必要」と答弁したが、給付の算定方法やスクールバスの予算化は未確定。",
      noteUrl: "https://note.com/tamakitext/n/n553f406a507f",
      fullUrl: "full/2026-10-14-muraoka.html",
      bubbles: [
        { side: "left", speaker: "村岡としひで", text: "体育館は災害時の避難所になりますが、エアコンがないため体育館で体調を崩し、車に避難する人もいます。財政基盤の弱い地域では設置がゼロのところも多い。設置の状況と、政府の取り組みを教えてください。" },
        { side: "right", speaker: "関文部科学大臣", text: "公立小中学校の空調設置率は、体育館等が31.7%、そのうち避難所指定校の体育館等は33.1%です（令和8年5月1日時点）。整備を進めるため、補助率を3分の1から2分の1へ引き上げ、地方債の活用と合わせて実質の地方負担を25%に抑えるほか、補助単価の引き上げや、体育館空調の光熱費への交付税措置、相談窓口による伴走支援を行っています。" },
        { side: "left", speaker: "村岡としひで", text: "食料品の消費税1%で影響を受ける農業者について、免税業者は平均で年19.4万円、簡易課税業者は184万6000円の自己負担になるとの試算があります（パネル提示）。収益が大きく減らないよう、対策をしっかり取っていただけますか。" },
        { side: "right", speaker: "片山財務大臣", text: "先般閣議決定した大綱に、資金繰りへの支援や、本則課税への移行が困難な簡易課税・免税の農林漁業者への、個別の売上高を踏まえた金額の給付などの方針を明記しています。現場の実情をしっかり確認し、安心して経営を継続できるよう、予算編成過程で具体化を進めてまいります。なお給付の割合とされる「5.4%」の報道については、決定された事実は全くありません。" },
        { side: "left", speaker: "村岡としひで", text: "還付の手続きを農協が担うのかも、まだ決まっていません。農協が担うことになった場合に、加盟していない農業者が受けられないという状況はおかしいと思います。" },
        { side: "right", speaker: "片山財務大臣", text: "申請の方法や実施時期、関係団体や市町村の役割も含めて、実施体制の具体化を急いでいるところです。農協に加入しているかどうかで給付の可否に差が生じるようなことは絶対にしないようにします。事務費の支援も含め、漏れのないようにきっちりと対応してまいります。" },
        { side: "left", speaker: "村岡としひで", text: "平成5年の大凶作では、259万トンの米を緊急輸入しました。備蓄の適正水準は100万トンと決めたはずですが、放出が重なって今は59万トンしかありません。早急に100万トンに戻すべきではないですか。" },

const NOTE_TOP = "https://note.com/tamakitext";

const threadView = document.getElementById("threadView");

let currentTab = "cats";
function addKokuusaRow(filter) {
  if (!("こくうさ" + KOKUUSA.dateLabel + "質疑" + KOKUUSA.count + "星座占い").includes(filter)) return;
  const row = document.createElement("div");
  row.className = "talk";
  row.dataset.key = "kokuusa";
  row.innerHTML =
    '<div class="avatar pic"><img src="kokuusa-icon.png" alt="こくうさ"></div>' +
    '<div class="talk-main"><div class="talk-top"><span class="talk-name">こくうさ</span>' +
    '<span class="talk-date">7:00</span></div>' +
    '<div class="talk-preview">' + KOKUUSA.dateLabel + "の質疑は" + KOKUUSA.count + "件｜今日の星座占いも配信中" + "</div></div>";
  row.addEventListener("click", () => openKokuusa());
  talkList.appendChild(row);
}
function articleTime(a) {
  const mm = /([0-9]+)年([0-9]+)月([0-9]+)日/.exec(a.date || "");
  return mm ? Date.UTC(+mm[1], +mm[2] - 1, +mm[3]) - 9 * 3600 * 1000 : null;
}
function articleDateLabel(a) {
  const mm = /([0-9]+)月([0-9]+)日/.exec(a.date || "");
  return mm ? (+mm[1]) + "/" + (+mm[2]) : null;
}
function latestArticle(m) {
  let best = null, bestT = -1;
  (m.articles || []).forEach(a => { const t = articleTime(a); if (t !== null && t > bestT) { bestT = t; best = a; } });
  return best;
}
function latestArticleTime(m) {
  let best = null;
  (m.articles || []).forEach(a => {
    const mm = /([0-9]+)年([0-9]+)月([0-9]+)日/.exec(a.date || "");
    if (mm) {
      const t = Date.UTC(+mm[1], +mm[2] - 1, +mm[3]) - 9 * 3600 * 1000;
      if (best === null || t > best) best = t;
    }
  });
  return best;
}
function showBadge(m) {
  return !!m.unread;
}
function readState() { try { return JSON.parse(localStorage.getItem("kt-read") || "{}"); } catch (e) { return {}; } }
function badgeKey(m) { return m.addedOn || (latestArticle(m) || {}).date || ""; }
function unreadNow(m) {
  if (!showBadge(m)) return 0;
  const r = readState()[m.id];
  if (r && r.key === badgeKey(m)) return Math.max(0, (m.unread || 0) - (r.unread || 0));
  return m.unread || 0;
}
function markRead(m) {
  try {
    const st = readState();
    st[m.id] = { key: badgeKey(m), unread: m.unread || 0 };
    localStorage.setItem("kt-read", JSON.stringify(st));
  } catch (e) {}
}
function renderList(filter = "") {
  talkList.innerHTML = "";
  if (currentTab === "members") {
    addKokuusaRow(filter);
    MEMBERS
      .filter(m => (m.name + m.preview + m.cats.map(c => c.label).join("")).includes(filter))
      .sort((x, y) => (latestArticleTime(y) || 0) - (latestArticleTime(x) || 0))
      .forEach(m => {
        const row = document.createElement("div");
        row.className = "talk";
        row.dataset.key = m.id;
        row.innerHTML =
          '<div class="avatar' + (unreadNow(m) ? " new" : "") + '">' + m.initial + "</div>" +
          '<div class="talk-main"><div class="talk-top"><span class="talk-name">' + m.name + '</span>' +
          '<span class="talk-date">' + (articleDateLabel(latestArticle(m) || {}) || m.dateLabel) + "</span></div>" +
          '<div class="talk-preview">' + m.preview + "</div></div>" +
          (unreadNow(m) ? '<div class="badge">' + unreadNow(m) + "</div>" : "");
        row.addEventListener("click", () => openThread(m));
        talkList.appendChild(row);
      });
  } else {
    addKokuusaRow(filter);
    const rooms = {};
    MEMBERS.forEach(m => m.cats.forEach(c => {
      (rooms[c.id] = rooms[c.id] || { cat: c, entries: [] }).entries.push({ member: m, entry: c });
    }));
    Object.values(rooms)
      .filter(({ cat, entries }) => (cat.label + entries.map(e => e.member.name + (e.entry.preview || e.member.preview)).join("")).includes(filter))
      .map(({ cat, entries }) => {
        let first = entries[0], dateText = entries[0].member.dateLabel, sortTime = -1;
        entries.forEach(e => {
          e.member.articles.forEach(a => {
            if (a.cats && !a.cats.includes(cat.id)) return;
            const t = articleTime(a);
            if (t !== null && t > sortTime) { sortTime = t; first = e; dateText = articleDateLabel(a) || dateText; }
          });
        });
        return { cat, entries, first, dateText, sortTime };
      })
      .sort((x, y) => y.sortTime - x.sortTime)
      .forEach(({ cat, entries, first, dateText }) => {
        const newCount = entries.filter(e => unreadNow(e.member) > 0).length;
        const row = document.createElement("div");
        row.className = "talk";
        row.dataset.key = cat.id;
        row.innerHTML =
          '<div class="avatar">' + cat.icon + "</div>" +
          '<div class="talk-main"><div class="talk-top"><span class="talk-name">' + cat.label + '</span>' +
          '<span class="talk-date">' + dateText + "</span></div>" +
          '<div class="talk-preview">' + (first.entry.preview || first.member.preview) + "（" + first.member.name + "）</div>" +
          '<div class="cat-meta">質疑 ' + roomArticleCount(entries, cat.id) + "件</div></div>" +
          (newCount ? '<div class="badge">' + newCount + "</div>" : "");
        row.addEventListener("click", () => openCategory(cat.id));
        talkList.appendChild(row);
      });
  }
  if (!talkList.children.length) {
    talkList.innerHTML = '<div style="padding:22px;text-align:center;color:#8a97a3;font-size:13px;">見つかりませんでした</div>';
  }
}

function markSelected(key) {
  document.querySelectorAll(".talk").forEach(r => r.classList.toggle("selected", r.dataset.key === key));
  const bar = document.getElementById("findBar");
  if (bar) bar.style.display = "";
}

function setTab(tab) {
  currentTab = tab;

function renderArticle(body, member, a) {
  const date = document.createElement("div");
  date.className = "date-chip"; date.textContent = a.date + "｜" + member.name;
  body.appendChild(date);
  if (a.committee) {
    const c = document.createElement("div");
    c.className = "committee-chip"; c.textContent = a.committee;
    body.appendChild(c);
  }
  if (a.pending) {
    const p = document.createElement("div");
    p.className = "pending";
    p.innerHTML = "<strong>" + a.title + "</strong><br>この記事の吹き出し要約は準備中です。全文はnoteで読めます。";
    body.appendChild(p);
    const link = document.createElement("a");
    link.className = "full-link"; link.href = NOTE_TOP; link.target = "_blank"; link.rel = "noopener";
    link.textContent = "noteで全文を読む";
    body.appendChild(link);
    return;
  }
  const card = document.createElement("div");
  card.className = "card";
  card.innerHTML = '<b class="label">1分要約</b><br><strong>' + a.title + "</strong><br>" + a.summary;
  body.appendChild(card);
  a.bubbles.forEach(b => {
    const row = document.createElement("div");
    row.className = "row " + b.side;
    const isRight = b.side === "right";
    row.innerHTML =
      (isRight ? "" : '<div class="mini-avatar">' + member.initial + "</div>") +
      '<div class="bubble-wrap"><div class="speaker">' + b.speaker + '</div><div class="bubble">' + b.text + "</div></div>";
    body.appendChild(row);
  });
  const memo = document.createElement("div");
  memo.className = "card memo";
  memo.innerHTML = '<b class="label">鶴亀のメモ</b><br>' + a.memo;
  body.appendChild(memo);
  if (a.fullUrl) {
    const link = document.createElement("a");
    link.className = "full-link"; link.href = a.fullUrl;
    link.textContent = "全文文字起こしを読む";
    link.addEventListener("click", ev => { ev.preventDefault(); openFull(member, a); });
    body.appendChild(link);
    const sub = document.createElement("a");
    sub.className = "full-link"; sub.href = a.noteUrl; sub.target = "_blank"; sub.rel = "noopener";
    sub.style.fontSize = "13px"; sub.style.opacity = "0.75";
    sub.textContent = "noteでも読む";
    body.appendChild(sub);
  } else {
    const link = document.createElement("a");
    link.className = "full-link"; link.href = a.noteUrl; link.target = "_blank"; link.rel = "noopener";
    link.textContent = "全文文字起こしを読む（note）";
    body.appendChild(link);
  }
}

async function openFull(member, a) {
  const body = document.getElementById("threadBody");
  try {
    const res = await fetch(a.fullUrl);
    if (!res.ok) throw new Error("fetch failed");
    const html = await res.text();
    const doc = new DOMParser().parseFromString(html, "text/html");
    const content = doc.querySelector("#articleBody");
    if (!content) throw new Error("no article body");
    body.innerHTML = "";
    const back = document.createElement("button");
    back.className = "full-back"; back.type = "button";
    back.textContent = "← 要約に戻る";
    back.addEventListener("click", () => openThread(member));
    body.appendChild(back);
    const head = document.createElement("div");
    head.className = "card";
    head.innerHTML = "<strong>" + a.title + "</strong><br>" + a.date + "｜" + member.name + "｜全文文字起こし";
    body.appendChild(head);
    const wrap = document.createElement("div");
    wrap.className = "full-doc";
    wrap.innerHTML = content.innerHTML;
    body.appendChild(wrap);
    document.getElementById("findInput").value = ""; clearHits();
    document.getElementById("threadPlaceholder").style.display = "none";
    const bar = document.getElementById("findBar");
    if (bar) bar.style.display = "";
    if (!isDesktop()) listView.style.display = "none";
    threadView.style.display = "flex";
    window.scrollTo(0, 0);
    body.scrollTop = 0;
  } catch (e) {
    window.location.href = a.fullUrl;
  }
}


function roomArticleCount(entries, catId) {
  const seen = new Set();
  entries.forEach(e => e.member.articles.forEach(a => {
    if (!a.cats || a.cats.includes(catId)) seen.add(a.fullUrl || a.noteUrl || a.title);
  }));
  return seen.size;
}
function openCategory(catId) {
  const group = MEMBERS.filter(m => m.cats.some(c => c.id === catId));
  if (!group.length) return;
  const cat = group[0].cats.find(c => c.id === catId);
  document.getElementById("threadName").textContent = cat.icon + " " + cat.label;
  document.getElementById("threadSub").textContent = "テーマ別の質疑";
  const body = document.getElementById("threadBody");
  body.innerHTML = "";
  const seenRoom = new Set();
  const roomItems = [];
  group.forEach(m => m.articles.forEach(a => { if (!a.cats || a.cats.includes(catId)) roomItems.push({ m, a }); }));
  roomItems.sort((x, y) => (x.a.entrance ? 1 : 0) - (y.a.entrance ? 1 : 0));
  roomItems.forEach(({ m, a }) => { const key = a.fullUrl || a.noteUrl || a.title; if (seenRoom.has(key)) return; seenRoom.add(key); renderArticle(body, m, a); });
  document.getElementById("findInput").value = ""; clearHits();
  document.getElementById("threadPlaceholder").style.display = "none";
  if (!isDesktop()) listView.style.display = "none";
  threadView.style.display = "flex";
  window.scrollTo(0, 0);
  group.forEach(markRead);
  renderList(document.getElementById("searchBox").value.trim());
  markSelected(catId);
}

function openThread(member) {
  document.getElementById("threadName").textContent = member.name;

  threadView.style.display = "flex";
  window.scrollTo(0, 0);

}

/* in-article find */
let hitMarks = [], hitIdx = -1;
function clearHits() {
  document.querySelectorAll("#threadBody mark.hit").forEach(m => m.replaceWith(document.createTextNode(m.textContent)));
  document.getElementById("threadBody").normalize();
  hitMarks = []; hitIdx = -1;
  document.getElementById("findCount").textContent = "";
}
function runFind() {
  clearHits();
  const q = document.getElementById("findInput").value.trim();
  if (!q) return;
  const body = document.getElementById("threadBody");
  const walker = document.createTreeWalker(body, NodeFilter.SHOW_TEXT, {
    acceptNode: n => n.nodeValue.includes(q) ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_REJECT
  });
  const nodes = [];
  while (walker.nextNode()) nodes.push(walker.currentNode);
  nodes.forEach(node => {
    const frag = document.createDocumentFragment();
    let rest = node.nodeValue;
    while (true) {
      const i = rest.indexOf(q);
      if (i < 0) { frag.appendChild(document.createTextNode(rest)); break; }
      if (i > 0) frag.appendChild(document.createTextNode(rest.slice(0, i)));
      const mk = document.createElement("mark");
      mk.className = "hit"; mk.textContent = q;
      frag.appendChild(mk); hitMarks.push(mk);
      rest = rest.slice(i + q.length);
    }
    node.replaceWith(frag);
  });
  if (hitMarks.length) { hitIdx = 0; showHit(); }
  else document.getElementById("findCount").textContent = "0件";
}
function showHit() {
  hitMarks.forEach((m, i) => m.classList.toggle("current", i === hitIdx));
  document.getElementById("findCount").textContent = (hitIdx + 1) + "/" + hitMarks.length + "件";
  hitMarks[hitIdx].scrollIntoView({ block: "center", behavior: "smooth" });
}
document.getElementById("findNext").addEventListener("click", () => {
  if (!hitMarks.length) { runFind(); return; }
  hitIdx = (hitIdx + 1) % hitMarks.length; showHit();
});
document.getElementById("findPrev").addEventListener("click", () => {
  if (!hitMarks.length) { runFind(); return; }
  hitIdx = (hitIdx - 1 + hitMarks.length) % hitMarks.length; showHit();
});
document.getElementById("findInput").addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); runFind(); } });
document.getElementById("findInput").addEventListener("search", runFind);

function horoDay() {
  const n = new Date();
  if (n.getHours() < 7) n.setDate(n.getDate() - 1);
  return n;
}
function fortuneHTML(i) {
  const d = horoDay();
  const seed = d.getFullYear() * 10000 + (d.getMonth() + 1) * 100 + d.getDate();
  const stars = 3 + ((seed + i * 7) % 3);
  const idx = (seed * 3 + i * 5) % FORTUNES.length;
  const text = FORTUNES[idx];
  const item = LUCKY[idx];
  return "<span class='stars'>" + "★".repeat(stars) + "</span> " + text +
    "<br><span class='lucky'>ラッキーアイテム：" + item + "</span>";
}
function openKokuusa() {
  document.getElementById("threadName").textContent = "こくうさ";
  document.getElementById("threadSub").textContent = "毎朝7時に配信";
  const body = document.getElementById("threadBody");
  body.innerHTML = "";
  const chip = document.createElement("div");
  chip.className = "date-chip";
  chip.textContent = KOKUUSA.dateLabel + " 7:00配信";
  body.appendChild(chip);
  const row = document.createElement("div");
  row.className = "row left";
  row.innerHTML =
    '<div class="mini-avatar pic"><img src="kokuusa-icon.png" alt="こくうさ"></div>' +
    '<div class="bubble-wrap"><div class="speaker">こくうさ</div><div class="bubble">' +
    "みんなおはよー。今日も元気かな？" + KOKUUSA.dateLabel + "の質疑は" + KOKUUSA.count + "件あるよ。" +
    KOKUUSA.detail + "。要約ができたらこのサイトに載るから、楽しみにしててね。" +
    "</div></div>";
  body.appendChild(row);
  const card = document.createElement("div");
  card.className = "card horo-card";
  card.innerHTML = '<b class="label">今日の星座占い</b><br><select id="horoSelect" aria-label="星座を選ぶ"></select><div class="horo-fortune" id="horoFortune"></div>';
  body.appendChild(card);
  const sel = card.querySelector("#horoSelect");
  const out = card.querySelector("#horoFortune");
  SIGNS.forEach((name, i) => {
    const o = document.createElement("option");
    o.value = i; o.textContent = name + "の今日の運勢";
    sel.appendChild(o);
  });
  let saved = 0;
  try { saved = Number(localStorage.getItem("kokuusa-sign") || 0); } catch (e) {}
  sel.value = String(Math.min(Math.max(saved, 0), 11));
  const draw = () => {
    out.innerHTML = fortuneHTML(Number(sel.value));
    try { localStorage.setItem("kokuusa-sign", sel.value); } catch (e) {}
  };
  sel.addEventListener("change", draw);
  draw();
  document.getElementById("findInput").value = ""; clearHits();
  document.getElementById("threadPlaceholder").style.display = "none";
  const bar = document.getElementById("findBar");
  if (bar) bar.style.display = "";
  if (!isDesktop()) listView.style.display = "none";
  threadView.style.display = "flex";
  window.scrollTo(0, 0);
  markSelected("kokuusa");
}
