      bubbles: [
        { side: "left", speaker: "岡野純子", text: "慢性便秘症薬モビコールが英国製造所の品質問題で供給制限に。通常出荷は来年6月再開が目処。1歳から使える小児は代替切替えが困難で効果が出ない声も。影響とEAファーマへの指導は。" },
        { side: "right", speaker: "安藤医薬産業振興審議官", text: "モビコールは小児の慢性便秘症の第一選択薬です。EAファーマに情報提供を指導し、小児への優先供給を求めました。現時点で影響は最小限ですが、長引けば小児への影響が広がる恐れがあります。" },
        { side: "left", speaker: "岡野純子", text: "薬機法改正から間もなく1年。限定出荷・供給停止は1366品目で改善傾向にある。法改正で供給不安を早期に把握できた、供給不足を回避できた等の具体的な変化は。課題は。" },
        { side: "right", speaker: "安藤医薬産業振興審議官", text: "供給不安の報告が法律上の義務となり、代替薬の調整がしやすくなりました。令和9年5月からは管理責任者の設置と手順書作成も義務化され、約1万6000品目から供給確保医薬品を指定します。" },
        { side: "left", speaker: "岡野純子", text: "製造や原薬は海外頼みで、今回も海外工場のトラブルが発端。国内基盤の確保、拠点・調達先の複数化、備蓄を組み合わせ、供給網の強靭化を加速すべきでは。認識と方針は。" },
        { side: "right", speaker: "安藤医薬産業振興審議官", text: "供給網の脆弱性に強い問題意識を持っています。抗菌性物質製剤を特定重要物資に指定し、原薬の国内製造や調達先複数化を支援し、調査も進めています。（※人員・予算への直接の答弁はなし）" },
        { side: "left", speaker: "岡野純子", text: "統合失調症のある知人が腰の手術を一般病院で「障害のある方の対応ができない」と断られた。状態を確認せず障害を理由に予防的に断るケースがあるのでは。厚労省の把握と考えは。" },
        { side: "right", speaker: "佐々木医政局長", text: "障害者差別解消法は障害を理由とする提供拒否を禁止しており、こうした事例は適切ではないと考えます。応召義務でも、障害のみを理由とする診療拒否は正当な事由とは言えません。" },
        { side: "left", speaker: "岡野純子", text: "対応できない場合も、医学的理由か設備・人員の問題か本人へ伝えるべきでは。精神・身体双方に対応できる医療機関の整備・連携はどこまで進んだか。安定した方の予定手術も対象か。" },
        { side: "right", speaker: "水谷障害保健福祉部長", text: "指針で身体合併症への対応を求め、本年6月に見直し、地域での協議も求めました。精神疾患が安定した方の身体疾患の予定手術も、対象に含まれると考えます。" }
      ],
      memo: "モビコール問題で政府は「小児への優先供給で影響は最小限」としたが、通常出荷の再開は来年6月の目処で、政府自身が「長引けば小児への影響が広がる恐れ」を認めた。手術拒否の問題では「障害のみを理由に断ることは正当な事由とは言えない」との見解と、予定手術も指針の対象に含まれるとの答弁を引き出したのが収穫。次は、対応できる医療機関の明確化が実際に進むかと、モビコールの供給再開の見通しを追う。"
    }] },
  { id: "hino", cats: [{ id: "health", label: "医療・福祉", icon: "🏥", preview: "傷病手当金は5年で約1.6倍に増加。発達障害と障害年金の取扱いは「一律同一疾病ではない」と政府が説明" }, { id: "children", label: "子ども・家族", icon: "👶", preview: "子どもの発達障害の受診が、将来の障害年金の落とし穴に？ 親の不安に大臣は「受診を控える事態は望ましくない」" }], name: "日野さりあ", initial: "日", dateLabel: "10/23", unread: 0,

      fullUrl: "full/2026-10-23-hino.html",
      bubbles: [
        { side: "left",  speaker: "日野さりあ", text: "消費税は社会保障を支える重要な財源だ。減税の穴埋めで医療・介護・子育て支援が削られないよう、「社会保障の財源に手を付けない」と総理に申し入れるか。" },
        { side: "right", speaker: "上野厚生労働大臣", text: "財源は租税特別措置や補助金の見直しなど、歳出歳入全般の見直しで確保されるものと承知しています。社会保障財源に穴が開くことはない、という認識です。" },
        { side: "left",  speaker: "日野さりあ", text: "支給額は2018年度の約3,800億円から2023年度約6,100億円へ、5年で約1.6倍に増えた。精神疾患の総患者数は微減しているのに、なぜか。（※日野議員が提示した数字）" },

        { side: "right", speaker: "上野厚生労働大臣", text: "業者の存在は承知していますが、個別事例の報告は届いていません。保険者へのヒアリングで実態把握を進め、必要に応じて対応を検討します。" },

        { side: "left",  speaker: "日野さりあ", text: "子どもの頃の発達障害の受診が初診日になると、将来うつ病を発症しても障害厚生年金の対象外になることがあるという。なぜ発達障害とうつ病を同一疾病として扱うのか。医学的根拠か。" },
        { side: "right", speaker: "伊澤大臣官房年金管理審議官", text: "疑義照会は、発達障害とうつ病を一律同一疾病として取り扱うと示したものではありません。発症が発達障害に起因するかは、経過や症状、就労状況などから事案ごとに医学的に総合判断しています。" },
        { side: "left",  speaker: "日野さりあ", text: "その取扱いのせいで、必要な早期受診をためらう保護者が出ている。取扱いを見直すのか、別の救済措置を検討するのか、ためらわずに済む具体策を示せ。" },
        { side: "right", speaker: "上野厚生労働大臣", text: "早期受診を控える事態は望ましくありません。早期支援の重要性の周知に取り組み、疑義照会も誤解が生じないよう、どういった対応ができるか考えていきたいと思います。" }
      ],
      memo: "この日決まったことはほぼなし。「一律同一疾病ではない」と政府が公式に説明したのが最大の収穫だが、見直しや救済の具体策、総理への申し入れ、介護の基本報酬引上げ率はすべて示されなかった。次は疑義照会への対応方針と、令和9年度介護報酬改定の審議会論議を追う。"
    }] },
  { id: "ido", cats: [{ id: "children", label: "子ども・家族", icon: "👶", preview: "韓国の保護出産をめぐる調査では、登録されなかった子249人の死亡が判明。「まず登録を」と迫るが、政府は戸籍の趣旨を理由に慎重姿勢" }, { id: "justice", label: "法務・人権", icon: "⚖️", preview: "「売春は違法」と大臣が明言し、法案は「速やかに提出」。一方、本籍の見直しは「意義を失っていない」と政府、本籍なき登録には局長が否定的" }], name: "井戸まさえ", initial: "井", dateLabel: "10/23", unread: 1, addedOn: "2026-10-26",
    preview: "韓国の保護出産を引き合いに戸籍の壁を問う。本籍は「意義を失っていない」、法整備の時期も示されず",
    articles: [{
      date: "2026年10月23日", committee: "衆議院・法務委員会",
      title: "「まず登録を」——韓国の保護出産から戸籍と本籍の壁を問う",
      summary: "論点は2つ。売買春の法整備（時期と法律の名称）と、戸籍・本籍・無戸籍問題。大臣は「売春は違法」と明言し法案は「速やかに提出」としたが時期は示されず、本籍の見直しには「意義を失っていない」と答えた。",
      noteUrl: "https://note.com/tamakitext/n/n92fae38704c2",
      fullUrl: "full/2026-10-23-ido.html",
      bubbles: [
        { side: "left", speaker: "井戸まさえ", text: "現行法は売春を禁止するが、行為自体は一律に処罰しない。売春は違法か。法整備のプロセスと時期は。" },
        { side: "right", speaker: "山下法務大臣", text: "売春は違法です。検討会を踏まえ、買う側の勧誘等への処罰規定など具体的内容を検討中です。提出時期はお話しできませんが、できるだけ速やかに提出したいと思います。" },
        { side: "left", speaker: "井戸まさえ", text: "「売春防止法」は売る側だけに焦点を当て、買う側を見えなくする。買う側も規制する以上、「売買春防止法」に改めるべきでは。" },
        { side: "right", speaker: "山下法務大臣", text: "改称すると売春をする者の保護支援の視点がぼやける恐れがあり、慎重に検討すべきとの見解もあります。検討会の議論を踏まえ検討します。（※賛否は示されなかった）" },
        { side: "left", speaker: "井戸まさえ", text: "韓国財団の資料では、臨時番号のまま未登録の子は2236人、うち死亡確認249人。2024年7月に出生通知と保護出産が施行。番号や仮名でまず登録できるデジタル化が鍵では。" },
        { side: "right", speaker: "山下法務大臣", text: "適切な技術の導入は重要と認識しています。一方で身分関係を公証する戸籍の趣旨も確保が必要です。趣旨を損なわない範囲でデジタル化を進めていきます。" },
        { side: "left", speaker: "井戸まさえ", text: "本籍とは何か。マイナンバー時代に本籍は必要か。これは法務省の研究会自身の問いだ。紙の時代はともかく、今も市町村に定める必要があるか。" },
        { side: "right", speaker: "松井民事局長", text: "本籍は戸籍の編成基準となる場所で、所在市町村を明らかにし、戸籍を区別して表示するために用いられてきました。重要な意義・役割があると考えています。" },
        { side: "left", speaker: "井戸まさえ", text: "本籍は突然消える。サハリンでは日本領でなくなった瞬間に本籍が消え、無戸籍になった。災害で紙の戸籍が流れることもある。生活と無関係な本籍に実質的な意味があるか。" },
        { side: "right", speaker: "山下法務大臣", text: "本籍地の市町村が戸籍事務を担う管轄の基準でもあり、戸籍や個人を特定する機能もあります。本籍を基準とすることは、いまだ意義を失っていないのではないかと考えています。" },
        { side: "left", speaker: "井戸まさえ", text: "無戸籍の子にはまず登録が第一歩だ。父未定に注記をつけて登録し、必要な裁判手続きを一人一人に通知することも、デジタル化で可能では。" },
        { side: "right", speaker: "松井民事局長", text: "嫡出推定が重なる場合でも法律上の父は定まっており、内密出産とは異なると考えています。それでも父未定の戸籍を作ることは、制度の機能上困難であると考えています。" }
      ],
      memo: "この日の収穫は、大臣が「売春は違法」と明言し、法案提出に前向きな姿勢を示したこと。一方で本籍をめぐっては、政府は「意義を失っていない」の一点張りで、法務省の研究会が投げかけた「マイナンバー時代に本籍は必要か」という問いへの答えは示されなかった。「父未定」の注記付き登録にも局長は否定的で、韓国式の出生通知・保護出産を導入するかどうかに政府は一切触れなかった。次は売買春の法案がいつ国会に出てくるかを追う。"
    }] },

        { side: "left", speaker: "浅野さとし", text: "年金暮らしの方や病気・障害で働けない方は就業者負担軽減支援金の対象外だ。対応は2030年までに決めるとするが、空白の間、届かない方の暮らしをどう守るか。" },
        { side: "right", speaker: "高市総理", text: "令和9・10年度は飲食料品の税率1%への引き下げと支援金の先行導入を合わせます。令和11年度の本格導入に向け、既存の社会保障制度との関係を整理し、令和12年までに結論を得ます。" },
        { side: "left", speaker: "浅野さとし", text: "法案には対象年収も金額もない。満額はいくらで、年収いくらからいくらまでが満額か。いくらを超えるとゼロか。週10時間以上働き保険料を納める方も対象にすべきでは。" },
        { side: "right", speaker: "高市総理", text: "基本額は国際比較等を踏まえ財源と合わせ検討中です。外国の割合では2000万人程度、粗く言えば年収100万〜350万円層が概ねそれです。下限も検討中です。（※具体額は示されず）" },
        { side: "left", speaker: "浅野さとし", text: "2029年4月に税率は8%に戻る。300万円程度以下は支援金の本格支給があるが、超える中間層はゼロ。「年収300万円の崖」だ。300万・500万・700万円の試算を示すべきだ。" },
        { side: "right", speaker: "高市総理", text: "飲食料品の減税の減収は国・地方合計で年約4.3兆円、機械的には1人約3万6000円です。モデル試算は仮定が必要で今は適切でないと考えます。300万円を上限と決めた事実はありません。" },
        { side: "left", speaker: "浅野さとし", text: "負担増は2段階だ。控除の178万円までの上乗せは2027年分で終わり、翌年には消費税が8%に戻る。政府は認識していたか。上乗せ措置は恒久化すべきでは。" },
        { side: "right", speaker: "高市総理", text: "時限措置を元に戻すことを直ちに負担増とする考え方は馴染まないと考えます。上乗せ終了後のあり方は、支援金との関係も含め、その時点の経済・物価を踏まえ適切に判断します。" },
        { side: "left", speaker: "浅野さとし", text: "8%復帰に景気条項は設けない一方、大規模災害時は臨機応変に判断するという。税率操作は憲法84条の租税法律主義に基づくべきだ。延期しうる条件を法律に書くべきでは。" },
        { side: "right", speaker: "高市総理", text: "2年後には責任を持って確実に税率を戻します。景気による延期は考えず、信を問うことも想定していません。災害などは予見できず臨機応変に判断すべきで、条件を法律に書く考えはありません。" }
      ],
      memo: "この日の主戦場は「数字があるかどうか」だった。浅野が求めた支援金の満額・上限・下限、モデル世帯の試算、政策の総額はほぼ示されず、総理は「検討中」「お示しすることは適切ではない」を繰り返した。一方で、税収の上振れ（国税で年平均約6兆円）や減税の減収額（年約4.3兆円）には総理自身が数字を出したのも事実。次は委員会審議で、支援金の支給要件がどこまで具体化するかを追う。"
    }] },
  { id: "usuki", cats: [{ id: "election", label: "選挙・政治改革", icon: "🗳️", preview: "統一地方選の統一率は3割弱で「意義は依然大きい」と総務相。住民投票と選挙の同日回避は附帯決議を選管に周知。演説妨害は「現場の判断が重要」と警察庁。" }, { id: "infra", label: "交通・インフラ", icon: "🚃", preview: "電子投票の経費への特別交付税は令和7年に単価引上げ。来年の統一地方選での実施自治体にヒアリングし財政・技術面の支援を検討と総務省。" }, { id: "agriculture", label: "農業・食料", icon: "🌾", preview: "米国産ジャガイモの輸入協議で「家庭や農場での栽培は排除できない」と農水省。種バレイショ基盤強化と抵抗性のないブランド品種の両立を議論" }, { id: "energy", label: "エネルギー・産業", icon: "⚡", preview: "生乳は夏の低温で過去10年最大の加工処理が必要に。奨励金と令和7年度導入のクロスコンプライアンスで系統外との不公平感解消を検討" }], name: "臼木ひでたけ", initial: "臼", dateLabel: "10/28", unread: 2, addedOn: "2026-10-28",
    preview: "住民投票と選挙の同日回避は「附帯決議を選管に周知」。電子投票は交付税単価を引上げ支援拡充へ、ポスター掲示場の減数は「網羅的に把握せず」、演説妨害は現場判断。",
    articles: [{
      date: "2026年10月28日", committee: "衆議院・政治改革に関する特別委員会",
      cats: ["election", "infra"],
      title: "住民投票の同日選回避は「附帯決議を選管に周知」、統一率3割弱は「意義は依然大きい」——臼木議員、電子投票支援・演説妨害対応・ポスター掲示場減数も問う",
      summary: "住民投票と統一地方選の同日実施の回避、統一率3割弱の現状、電子投票の導入支援、街頭演説妨害への対応、ポスター掲示場の減数を順に問うた。政府は期日は各選管が決めるため参院附帯決議を周知するとし、統一率は都道府県議選87%・指定都市議選85%で意義は依然大きいと答え、電子投票は特別交付税の単価を令和7年に引き上げ財政・技術面の支援を検討すると述べた。過去2回の住民投票が別日になった理由と掲示場を減らした自治体の全体像は「把握していない」とされ、演説妨害では有形力を伴わないものは吟味が必要として、現場が躊躇なく動ける具体策は示されなかった。",
      noteUrl: "https://note.com/tamakitext/n/n81526e8243bd",
      fullUrl: "full/2026-10-28-usuki.html",
      bubbles: [
        { side: "left", speaker: "臼木ひでたけ", text: "前回の副首都法案審議では同日選実施禁止法案の提出者だった。人を選ぶ選挙と、制度を選ぶ大都市法の住民投票の意義をどう整理しているか。" },
        { side: "right", speaker: "斎藤総務副大臣", text: "選挙は主権者が政治に参加する最も基本的な機会で民主主義の根幹です。大都市法の住民投票は特別区を置く自治体の在り方を問うものです。" },
        { side: "left", speaker: "臼木ひでたけ", text: "過去2回の住民投票は選挙とは別日で、1回目は統一地方選の後に住民説明をして1か月後に投票した。その理由を政府は把握しているか。" },
        { side: "right", speaker: "斎藤総務副大臣", text: "過去2回とも統一地方選とは別日です。投票期日は自治体の選挙管理委員会が決定するもので、理由は政府として把握していません。" },
        { side: "left", speaker: "臼木ひでたけ", text: "参議院の附帯決議は「住民投票期間と選挙期間が重複しないよう最大限調整」とした。具体的にどう進めるのか。" },
        { side: "right", speaker: "斎藤総務副大臣", text: "同日実施では有権者の判断が混乱するとの議論を受けた附帯決議と認識しています。期日は各選管が決めるため、内容を周知してまいります。" },
        { side: "left", speaker: "臼木ひでたけ", text: "統一地方選は第1回の統一率100%から、直近5回は30%を下回り横ばい。統一率が低い現状をどう認識するか。" },
        { side: "right", speaker: "島田選挙部長", text: "過去に年1回か2回に統一する議論が各党間で行われましたが合意に至りませんでした。現職の任期延長や地方分権との関係などが課題です。" },
        { side: "left", speaker: "臼木ひでたけ", text: "このまま特例法を続けても統一率は上がらず、関心の高まりと効率的執行という目的から遠のく。問題意識は。" },
        { side: "right", speaker: "藤井総務大臣", text: "来年の統一率は3割弱の見込みですが平成23年以降ほぼ変わっていません。都道府県議選は87%、指定都市議選は85%で、実施自治体の人口は総人口の9割超です。" },
        { side: "left", speaker: "臼木ひでたけ", text: "統一率5%未満の県も4県程度ある。投票率も低下の一途だ。電子投票は移動投票所やバリアフリーにも資する。導入支援を積極的に。" },
        { side: "right", speaker: "藤井総務大臣", text: "実施自治体からは画面タッチで投票時間も短くなったとの声があります。技術的条件の提示と特別交付税で支援しており、充実を検討します。" },
        { side: "left", speaker: "臼木ひでたけ", text: "来年の統一地方選で電子投票を使う自治体が複数出る。終了後早期にヒアリングし、利点と課題を取りまとめて横展開を。" },
        { side: "right", speaker: "島田選挙部長", text: "電子投票経費への特別交付税は令和6年の実施状況を踏まえ令和7年に単価を引き上げました。財政面・技術面の支援を検討します。" },
        { side: "left", speaker: "臼木ひでたけ", text: "沖縄県知事選では街頭演説への妨害が相次いだと報道された。野次は表現の自由だが限度を超えれば自由妨害罪だ。運用で対応できないか。" },
        { side: "right", speaker: "遠藤警察庁審議官", text: "刑事事件として取り上げるべきものがあれば法と証拠に基づき厳正に対処するよう指示しています。事案ごとに異なり現場の判断が重要です。" },
        { side: "left", speaker: "臼木ひでたけ", text: "「取り上げるべきものがあれば」が前提で、妨害側はギリギリを狙う。公共空間の平穏の維持も警察の職務だ。現場が躊躇なく動けるよう再度。" },
        { side: "right", speaker: "遠藤警察庁審議官", text: "有形力の行使を伴わないものは演説妨害に当たるか証拠や判例に照らし吟味が必要です。法と証拠に基づき対処し現場を指導します。" },
        { side: "left", speaker: "臼木ひでたけ", text: "先の衆院選では積雪寒冷地でポスター掲示場が法定数の半分以下になった。統一地方選で掲示場を減らす自治体があるとの報道は承知か。" },
        { side: "right", speaker: "島田選挙部長", text: "特別の事情がある場合、市区町村選管が都道府県選管と協議して総数を減らせます。減数の事例は承知していますが網羅的に把握していません。" },
        { side: "left", speaker: "臼木ひでたけ", text: "「減らしても執行できたから減らそう」という動きを懸念する。1投票区5〜10か所の法定基準について、選管から要望は来ているか。" },
        { side: "right", speaker: "島田選挙部長", text: "本年6月に指定都市選挙管理委員会連合会から、設置箇所数の基準を現行より緩和するよう要望を受けています。" },
        { side: "left", speaker: "臼木ひでたけ", text: "減らさざるを得ない事情は理解するが、有権者の判断機会を減らすだけではいけない。デジタルサイネージなど代替策の必要性への認識は。" },
        { side: "right", speaker: "藤井総務大臣", text: "減らした選管には特設サイトへ誘導する例もあります。掲示場は有効な手段で、減らす場合は代替手段の確保も含め適切な対応が重要です。" }
      ],
      memo: "臼木議員は副首都法案の審議で「同日選実施禁止法案」の提出者として答弁した当事者で、冒頭の住民投票の論点は直前の中野委員の質疑を引き継ぐ形。本題の統一地方選特例法については「統一率が3割を切ったまま特例法を繰り返しても目的から遠のく」と問題提起したが、大臣は都道府県議選87%・人口カバー9割超を挙げて「意義は依然大きい」と応じ、議論は各党協議会に委ねられた。電子投票では通告外の追加質問で「財政面・技術面の支援を検討」との答弁を引き出した。演説妨害については議員自身が各党協議会のメンバーであることに触れ、立法府の責任と警察の運用の両面から詰めた。"
    }, {
      date: "2026年10月27日", committee: "衆議院・農林水産委員会",
      cats: ["agriculture", "energy"],
      title: "「侵入リスクは排除できない」米国産ジャガイモ輸入協議で農水省が答弁——臼木議員、種芋基盤・生乳需給緩和・クロマグロ枠も問う",
      summary: "米国産生鮮バレイショの輸入解禁協議について、ナス科作物へのリスクと家庭栽培・廃棄物による拡散リスクの評価を問い、種バレイショの生産基盤強化、生乳の需給緩和対策、クロマグロ枠配分・昆布養殖・漁業経営安定も取り上げた。農水省は、リスク評価はナス科を含む寄主植物全体を対象とし、家庭や農場で栽培される可能性は「排除できない」と答弁。大臣は科学的根拠に基づき毅然と慎重に協議すると重ねて表明した。生乳はクロスコンプライアンスを令和7年度から導入し不公平感解消へ具体策を検討、クロマグロは国際会議後に国内配分を検討と答弁。漁業の直接交付金制度の検討には現行制度の説明にとどまり、明確な答えはなかった。",
      noteUrl: "https://note.com/tamakitext/n/n7711cd2bbea5",
      fullUrl: "full/2026-10-27-usuki.html",
      bubbles: [
        { side: "left", speaker: "臼木ひでたけ", text: "米国産生鮮バレイショの輸入解禁は断じて容認できない。SPS協定協議のリスク評価では何を考慮しているのか。線虫類はジャガイモだけの問題ではない。他のナス科作物へのリスクをどう見るか。" },
        { side: "right", speaker: "大島消費安全局長", text: "21種類の病害虫を対象に特定・公表し、リスク評価はナス科を含む寄主植物全体を対象に行いました。ナス、トマト、ピーマンは全国的な重要作物で、重みを受け止め協議に当たります。" },
        { side: "left", speaker: "臼木ひでたけ", text: "スーパーのジャガイモで自家栽培する動画もある。皮やむきくずが堆肥や野鳥の餌になり拡散するリスクも。水際で漏れた場合の転用・拡散リスクをどう評価しているのか。" },
        { side: "right", speaker: "大島消費安全局長", text: "既に輸入を認めている加工用は閉鎖体系で高温の油で揚げますが、今回は一般流通用で別のリスク管理が必要です。家庭の庭や農場で栽培される可能性は排除できず、リスク評価に織り込んでいます。" },
        { side: "left", speaker: "臼木ひでたけ", text: "侵入リスクは排除できないと重要な答弁。種バレイショは厳しい防疫検査の一方で所得が上がらず、生産者数・面積・生産量が減少の一途。安定供給と生産体制強化の取組と方針は。" },
        { side: "right", speaker: "武部農林水産大臣", text: "種バレイショは北海道が9割以上。高齢化、高い労働負荷、高温干ばつによる反収減が課題で基盤強化は急務です。抵抗性品種への転換、新産地形成、面積拡大、省力化機械等を支援しています。" },
        { side: "left", speaker: "臼木ひでたけ", text: "澱粉用は抵抗性品種に100%置き換わったが、男爵・メークイン・インカのめざめは抵抗性がない。長年ブランド化してきた品種も守りつつ、置き換えられる所は置き換える両輪が必要では。" },
        { side: "right", speaker: "武部農林水産大臣", text: "病害虫の侵入を防ぐことが大前提で、科学的根拠に基づき毅然と慎重に協議します。加工用需要が伸び青果用は減る中、新品種導入や実需との連携を支援し、産地の総意でブランド化を後押しします。" },
        { side: "left", speaker: "臼木ひでたけ", text: "今夏は涼しく生乳生産が伸びる一方、飲用需要は伸びず需給が緩和。Jミルクは不需要期の加工向け処理が過去10年で最大、例のない厳しい対応が必要と指摘。年末年始を前に現状認識と対策は。" },
        { side: "right", speaker: "谷村畜産局長", text: "需給は大きく緩和していると認識しています。乳業工場の稼働率やタンク貯乳量の最大化、出荷調整を呼びかけ、年末年始に搾乳を早めにやめる等の調整をした生産者に奨励金を交付する予定です。" },
        { side: "left", speaker: "臼木ひでたけ", text: "工場設備も作業員もドライバーも余力がない。生乳の道外移出で自主流通が4割超との報道もあり、系統外は需給調整に関わらないという不公平感が指定団体側に生じかねない。農水省の対応は。" },
        { side: "right", speaker: "武部農林水産大臣", text: "脱脂粉乳の在庫低減が重要で、業界の協調拠出に国も負担しています。協調対策への拠出を補助要件とするクロスコンプライアンスを令和7年度から導入。不公平感の解消へ具体策を検討します。" },

        { side: "right", speaker: "玉木雄一郎", text: "国民投票ではSNSへのルールが必要です。国民投票法の具体化を提案します。広報協議会が何を伝えるかの具体化も重要です。信任投票化を避けるため国政選挙との同日実施は避けるべきです。" },
        { side: "right", speaker: "玉木雄一郎", text: "発議するなら、この臨時国会で議論のスケジュールを定めてください。自衛隊が軍隊なのか、ネガティブリストでいけるのか、与党間で整理を。進めるなら緊急事態条項と合区解消に絞ってください。" },
        { side: "right", speaker: "新藤義孝（自民党）", text: "ハンガリー要人は、頻繁な改正は国を不安定にし、長く改正していない日本は羨ましいと述べました。揺るがない基本原則が大切だと受け止めました。時代に応じた見直しは必要だと実感しました。" },
        { side: "right", speaker: "西村ちなみ（中道）", text: "改正が最優先とは思えません。権力制限と人権保障が立憲主義です。政府・与党の提案は正当性・必要性を厳しく判断すべきです。安定性への羨望、権力維持に利用された点は示唆に富むものでした。" }
      ],
      memo: "この日の中心は「改正を重ねてきた国々から何を学ぶか」で、結論は出ていない。とりわけ切り取られやすいのが「徴兵」という言葉だが、本文の言及はすべて、ハンガリー・イタリア・スイスの担当者が自国の制度を説明した内容の報告であり、日本に徴兵制を導入しようという提案は、報告にも各委員の発言にも存在しない。ハンガリーの説明でも「復活の動きは現時点でない」ことが明記されている。次は審査会で玉木議員が求めた「議論の絞り込みとスケジュール」が示されるかどうかを追う。"
    }] },
  { id: "hashimoto", cats: [{ id: "defense", label: "防衛", icon: "🛡️", preview: "自衛官の俸給独自見直しは年内結論目標。当直・待機の負担反映と食事・医療の天引き見直しが論点に" }, { id: "work", label: "働き方", icon: "💼", preview: "艦艇乗組員の代休確保、幹部ほど多い超過勤務、2〜3年異動の人事慣行。元自衛官議員が休養と専門性蓄積の問題を提起" }], name: "橋本みきひこ", initial: "橋", dateLabel: "10/27", unread: 1, addedOn: "2026-10-27",
    preview: "自衛官の給与独自見直しは年内結論へ。食事・医療の天引き廃止や休養確保は「検討中」のまま、具体策は示されず",
    articles: [{
      date: "2026年10月27日", committee: "衆議院・安全保障委員会",
      cats: ["defense", "work"],
      title: "「食事・医療の天引きは見直すか」元空自の橋本議員、自衛官の給与・休養・異動の実態を問う",
      summary: "人事院勧告とは別の「俸給の独自見直し」について、当直・待機・艦艇勤務の反映、休養の確保、中途退職の実態把握、専門性を活かす人事、広域異動の家族負担、食事・医療費の減額調整の廃止を問うた。政府は24時間態勢や広域異動など自衛官の特殊性を給与に反映する方向で年内に結論を目指すとし、減額調整も「見直しの論点」として検討中と答弁。艦艇勤務の反映、階級別・職場別の退職分析、昨年答弁以降の具体的変化、家族負担の把握状況は明確な回答がなく、いずれも「検討」にとどまった。",
      noteUrl: "https://note.com/tamakitext/n/nebd0d501208d",
      fullUrl: "full/2026-10-27-hashimoto.html",
      bubbles: [
        { side: "left", speaker: "橋本みきひこ", text: "今回の人勧法案には賛成。その上で俸給の独自見直しを聞く。今の俸給表はどの責任や負担に報いていないのか。基本的な考え方は。" },
        { side: "right", speaker: "小泉防衛大臣", text: "24時間態勢の拘束、危険を伴う固有任務、広域異動の多さ。こうした特殊性を給与体系により適切に反映する必要があり、年内に結論を得るよう努力しています。" },
        { side: "left", speaker: "橋本みきひこ", text: "勤務実態調査では残業に加え、当直や待機をどう把握したのか。艦艇乗組員の特殊な勤務はどう反映するのか。" },
        { side: "right", speaker: "上田人事教育局長", text: "調査では超過勤務相当時間が月平均約24時間、中央値約19時間。幹部ほど多い傾向です。当直や所在態勢の拘束も確認しており、評価される体系を検討したいと考えています。" },
        { side: "left", speaker: "橋本みきひこ", text: "残業だけでなく当直・待機、そして今触れられなかった艦艇勤務も、今回の独自見直しに反映されるということでよいか。" },
        { side: "right", speaker: "上田人事教育局長", text: "ご指摘の通り、調査で把握した負担が適切に評価される体系にしたいと考えています。" },
        { side: "left", speaker: "橋本みきひこ", text: "給料も大事だが休みも大事。夜間や長時間勤務の後、必要な休養は実際に取れているのか。把握と改善は。" },
        { side: "right", speaker: "上田人事教育局長", text: "艦艇乗組員は出航増の一方、停泊中も艦内業務があり代休との両立が課題です。停泊中業務の部外委託や週末分の代休取得促進を進め、休養確保を最優先と考えています。" },
        { side: "left", speaker: "橋本みきひこ", text: "部隊により残業が慢性化している所もある。部品不足の負担は隊員に行くが、残業代が出ない仕組み。俸給だけでなく休みの実態も把握を。大臣は。" },
        { side: "right", speaker: "小泉防衛大臣", text: "全く同感です。海自は艦艇の充足率が低く、帰港時に十分休めない状況があるのは事実です。業務の棚卸しやアウトソーシングも含め、負担に見合う俸給表に最善を尽くしたいと思います。" },
        { side: "left", speaker: "橋本みきひこ", text: "軍隊は本来しっかり休む組織。平時に隊員が疲弊しているのは大問題。昨年求めた階級別・職場別の中途退職者の集計と実態調査は、今行っているのか。" },
        { side: "right", speaker: "上田人事教育局長", text: "階級別・職場別の細かい集計はしていませんが、大きな分析はしています。令和7年度の中途退職者は4,642名で前年比980名減。幹部657、准曹1,888、士2,097名です。" },
        { side: "left", speaker: "橋本みきひこ", text: "陸海空で組織文化は全く違い、同じ空自でも操縦・整備・基地業務で勤務も精神性も違う。職場別・階級別に見ないと実態はつかめないのでは。丁寧な把握を。" },
        { side: "left", speaker: "橋本みきひこ", text: "昨年11月に聞いた専門性を活かす人事と給与。大臣は「適切な人事管理に努める」と答弁したが、それ以降何か変わったか。" },
        { side: "right", speaker: "上田人事教育局長", text: "サイバー領域では自衛隊のサイバー学校に加え、国内外の大学等への留学・研修を実施。他分野でも大学院派遣で学位を取得させる場合があり、従来の取り組みを引き続き進めます。" },
        { side: "left", speaker: "橋本みきひこ", text: "高度なサイバー人材は民間の方が格段に給与が良い。米国ではGoogle在籍者を本人同意の上の命令で軍務に就かせる例も。柔軟な人材活用を検討すべきでは。" },
        { side: "right", speaker: "小泉防衛大臣", text: "官民連携は全く同感です。米国も給与は桁違いですが献身と任務の特殊性で確保し、官民の行き来も進んでいます。クリアランス整備や専門性を活かすキャリアパスを検討しており、改善したい。" },
        { side: "left", speaker: "橋本みきひこ", text: "幹部は2〜3年で配置が変わり専門性が育つのか。装備調達でも官が短期で変われば、部隊の要求と民への伝達に齟齬が生じるのでは。異動のあり方の検討を。" },
        { side: "right", speaker: "小泉防衛大臣", text: "思いは同じです。サイバー人材はまず4,000人、その後2万人に増やす計画で官民連携は不可欠。配属の改善は人事改革を検討中ですが、約25万人の人事管理は極めて難しいのも現実です。" },
        { side: "left", speaker: "橋本みきひこ", text: "防衛省・自衛隊の改革ができれば日本全体も変わる。人事・給与・組織文化を一体で議論し、世界一の人事慣行と組織文化を作るべきだ。" },
        { side: "right", speaker: "小泉防衛大臣", text: "「世界一、人を大切にする組織であろう」と掲げています。辞める人を食い止めることが必要。部隊のニーズを公表するSBIRも今月開始。ドローン技能者が希望部隊に配属された例もあります。" },
        { side: "left", speaker: "橋本みきひこ", text: "広域異動は本人だけでなく家族にも負担。防衛省はどこまで把握し、どう改善に取り組んでいるのか。" },
        { side: "right", speaker: "上田人事教育局長", text: "全国配置に必要な人員は地元採用だけでは難しく、全国異動が必要です。まず本法案の広域異動手当引き上げと転居手当新設を速やかに行い、家族支援も含めさらに検討したいと考えています。" },
        { side: "left", speaker: "橋本みきひこ", text: "二重・三重生活になりがちで、海自は特に顕著。家族に会う移動も多い。前例はないが、国会議員のJRパスのようなものを自衛官に支給するのも一考では。" },
        { side: "right", speaker: "小泉防衛大臣", text: "民間企業に自衛官優遇を積極的に依頼しています。ドイツは制服の軍人は電車もバスも無料、英国は家族旅行も割引。離島勤務の家族の航空運賃負担の声も届いており、何ができるか検討中です。" },
        { side: "left", speaker: "橋本みきひこ", text: "自衛官の給与は食事と医療の分が差し引かれる「減額調整」がある。独自見直しの中で廃止するのも一つの改革では。" },
        { side: "right", speaker: "上田人事教育局長", text: "曹士は舎内居住のため食事は無料ですが、俸給算定時に一定額を減額。医療費も傷病相当分を差し引いています。独自見直しの中で減額部分の扱いを検討しており、年末に向け進めます。" },
        { side: "left", speaker: "橋本みきひこ", text: "募集で「食事も医療もタダ」と言いながら減額調整しているなら、半分詐欺のような話。ぜひ見直しを。大臣は。" },
        { side: "right", speaker: "小泉防衛大臣", text: "全体の見直しの中の論点だと思っています。天引き部分をできる限り軽くして手取りを上げる方向で、営内の食事と医療も含めて議論を進めていきたいと思っております。" }
      ],
      memo: "橋本議員は元航空自衛官（幹部候補生出身）で、「痩せ我慢」「任地は全国」といった自身の体験を交えて現場の負担を問うたのが読みどころ。今回の法案は人事院勧告に基づく給与引き上げで、政府が別途進める「俸給表の独自見直し」とは別物。独自見直しは8月に防衛人事審議会の処遇・給与部会が中間提言を出し、年内結論が目標という段階にある。"
    }, {
      date: "2026年10月23日", committee: "衆議院・安全保障委員会",
      title: "「共食い整備」はどこまで減ったのか——元整備員の目で装備の仕組みを問う",
      summary: "論点はF-2の共食い整備の現状と整備員の負担、現場の知見を開発・調達に反映する仕組み、P-1への会計検査院の指摘、GCAPの改修の自由。共食い整備の全面解消の時期は示されなかった。",
      noteUrl: "https://note.com/tamakitext/n/n7103bd964f1b",
      fullUrl: "full/2026-10-23-hashimoto.html",
      bubbles: [
        { side: "left", speaker: "橋本みきひこ", text: "私は航空自衛隊でF-2整備の現場にいた。部品不足で他機から取り合う共食い整備が行われていた部隊だ。予算も維持整備費も増えた。共食い整備はどこまで減ったか。" },
        { side: "right", speaker: "宮本プロジェクト管理部長", text: "F-2も共食い整備が必要なくなったとは言い難い状況です。ただ、部品を適時適切に確保し、令和5年度以降は改善傾向にあります。安定供給態勢を構築し、非可動の解消に取り組みます。" },
        { side: "left", speaker: "橋本みきひこ", text: "共食い整備は取り外し作業や記録が増える。F-2整備部隊の勤務、休養、教育訓練への影響と、その追加作業をどう把握し改善しているか。" },
        { side: "right", speaker: "宮本プロジェクト管理部長", text: "取り外し、取り付け、記録を伴うため、整備員に追加的な作業負担が生じ得ると認識しています。勤務、休養、教育訓練への影響は一定程度あると考えています。負担軽減に取り組みます。" },
        { side: "left", speaker: "橋本みきひこ", text: "操縦者や整備員の知見や日本の運用環境を、要求、設計、試験運用にどう反映しているか。量産後の意見で改良する仕組みも含め答えてほしい。" },
        { side: "right", speaker: "宮本プロジェクト管理部長", text: "操縦者・整備員の経験者を幕僚幹部や防衛装備庁にも配置し、各段階で知見を踏まえ要求、設計、試験、評価を進めてきました。導入後も不具合等を検討し改修につなげるプロセスを設けています。" },
        { side: "left", speaker: "橋本みきひこ", text: "国産機P-1は、会計検査院が過去の機種の知見が設計に生かされていないと指摘している。問題を見つけ要求や計画を直す仕組みそのものを見直すべきでは。" },
        { side: "right", speaker: "小泉防衛大臣", text: "F-2の共食い件数は令和4年度と7年度で概ね約40％減っています。撤退企業の穴を埋めるサプライチェーン再構築には時間がかかります。防衛産業こそ防衛力そのものとして基盤を強化します。" },
        { side: "left", speaker: "橋本みきひこ", text: "要求段階で、サプライチェーン含む供給態勢を反映しなければならなかったのでは。戦闘機は何十年も使う。P-1やF-2の繰り返しを防ぐ政府のメッセージを示すべきでは。" },
        { side: "right", speaker: "小泉防衛大臣", text: "整備計画局長が各幕と話し、統幕長も含め全体を見て、要求段階から反映を行っています。不足は共食いだけではありません。全体の優先順位を見極め、精強性とモチベーション向上に努めます。" },
        { side: "left", speaker: "橋本みきひこ", text: "次期戦闘機GCAPでは改修の自由を最大限確保すべきだ。ソフトウェア更新だけで能力が大きく変わる。特に私が「ソフトウェア主権」と呼ぶソフト改修の自由へ、各国で連携すべきでは。" },
        { side: "right", speaker: "小泉防衛大臣", text: "運用要求の反映や改修の自由に加え、安定した維持整備、部品供給、国内生産基盤の確保が重要だと考えています。日英伊3か国で協議中であり、わが国の利益につながるよう議論を積み上げます。" }
      ],
      memo: "政府が数字で示したのは「F-2の共食い件数は令和4年度比で概ね約4割減」。ただし件数の絶対数は示されず、共食い整備は陸海空に残っていると大臣自身が認めた。橋本の問いの軸は個別の装備ではなく、現場の知見が要求・設計・評価にどう届くかという仕組み論で、大臣も仕組みの不断の改善の必要性には同感を示した。ただ、独立した評価組織や条約に基づく監査など具体策は先送りされた。次はGCAP交渉で改修の自由と部品供給がどこまで確保されるかを追う。"
    }] },
  { id: "mukaiyama", cats: [{ id: "energy", label: "エネルギー・産業", icon: "⚡", preview: "浄化槽脱炭素補助（年18億円）は削減実績が未把握で執行率36%。政府は補助率の段階設定など概算要求で改善と答弁" }, { id: "money", label: "税とお金", icon: "💰", preview: "執行団体への事務費は人件費約4700万円＋運営費約5200万円の約1億円。執行率と無関係に支出される構造を議員が問題視" }, { id: "election", label: "選挙・政治改革", icon: "🗳️", preview: "農水大臣辞任を受け、環境省の補助金が政治家や団体の働きかけで左右された過去がないか調査を要求。政府は既存の仕組みの活用にとどめた" }], name: "向山好一", initial: "向", dateLabel: "10/27", unread: 1, addedOn: "2026-10-27",
    preview: "浄化槽脱炭素補助は削減実績未把握・執行率36%で見直しを要求。政府は概算要求での改善を示したが、働きかけの調査は明言せず",
    articles: [{
      date: "2026年10月27日", committee: "衆議院・環境委員会",
      cats: ["energy", "money", "election"],
      title: "「削減効果は見込み値、執行率36%」向山議員、浄化槽脱炭素補助18億円の抜本見直しと環境省の執行透明化を要求",
      summary: "農水大臣辞任を受け、環境省の補助金等が政治家や団体の働きかけで左右された過去がないか調査すべきと求めた上で、浄化槽システム脱炭素化推進事業（年18億円）のCO2削減実績、執行率36%の費用対効果、執行団体への約1億円の事務費を問うた。政府は既存の選定委員会・監視委員会で適正執行に努めると答え、削減効果は3年間の事業報告書で検証、令和9年度概算要求で補助率の段階設定などの改善を反映したと答弁。過去の働きかけの調査を行うかは明言されず、事業の3つの問題点への大臣の認識を問うた場面では「前大臣の発言を尊重する」との一言にとどまった。",
      noteUrl: "https://note.com/tamakitext/n/n1b9e4b9a90aa",
      fullUrl: "full/2026-10-27-mukaiyama.html",
      bubbles: [
        { side: "left", speaker: "向山好一", text: "簗農水大臣の辞任で、政治家や団体の働きかけで税金がねじ曲げられたとの疑念が広がる。環境省の補助金や交付金でも過去にそうした例がないか、調査すべきでは。" },
        { side: "right", speaker: "笹川環境大臣", text: "総理の発言は重く受け止めます。環境省は外部有識者の選定委員会や年2回の入札監視委員会、地方環境局の会計検査で適正執行に努めており、まずこの取組を活用し検証してまいります。" },
        { side: "left", speaker: "向山好一", text: "調査の有無は答えず、今の仕組みを徹底するだけという印象。政治家や業界団体の働きかけは記録しているか。採択・配分の意思決定過程や事業後の成果検証の仕組みは。" },
        { side: "right", speaker: "白石大臣官房長", text: "政治家等からの働きかけは公文書管理のルールに基づき面会記録等を保存しています。執行は外部有識者会議で決定し、入札監視適正化委員会等で検証しています。" },
        { side: "left", speaker: "向山好一", text: "浄化槽脱炭素化推進事業は年18億円。6月の答弁で、令和7年度の削減効果2281トンは実績ではなく申請時の見込みと判明した。実績なしに、何を根拠に有効性を評価するのか。" },
        { side: "right", speaker: "熊倉資源循環グループ長", text: "事業完了の翌年度から3年間、毎年CO2削減効果を含む事業報告書の提出を求めています。令和7年度事業の初回報告は令和9年度の予定。必要に応じ実地検査も行い有効性を評価しています。" },
        { side: "left", speaker: "向山好一", text: "令和4〜7年度の平均執行率は36%。環境省自身が「工事費高騰で費用対効果に課題」と答えた。事業者がメリットを感じない補助制度に経済合理性はない。見直すべきでは。" },
        { side: "right", speaker: "笹川環境大臣", text: "執行率低調の要因はご指摘の通り。行政事業レビューの指摘も踏まえ、補助対象の規模絞り込み、省エネ効果に応じた段階的補助率、複数年度対応を令和9年度概算要求に反映し、改善に努めます。" },
        { side: "left", speaker: "向山好一", text: "改修事業の平均工事費は370万円と高額。現場からはブロワよりタイマー交換で十分効果が出るとの声もあり、価格は10分の1以下の可能性。丸投げせず効率的な方法を一緒に研究を。" },
        { side: "left", speaker: "向山好一", text: "執行団体の全浄連に、この事業の事務局運営費としていくら支払っているのか。" },
        { side: "right", speaker: "熊倉資源循環グループ長", text: "令和7年度事業で、補助金交付事務の人件費として約4700万円、事務局運営や広報等の経費として約5200万円を支出しています。" },
        { side: "left", speaker: "向山好一", text: "合計1億円。執行率が高くても低くても支出されるなら問題では。目標達成が不透明、費用対効果が乏しい、委託費が団体の運営維持費化。この3点で何が必要と認識しているか。" },
        { side: "right", speaker: "笹川環境大臣", text: "前大臣の発言は尊重させていただきたいと思います。" },
        { side: "left", speaker: "向山好一", text: "概算要求で18億→16億円の減額などの工夫はあるが、抜本的改善ではない。補助事業はある団体のためにあるのではない。政策目的の達成を重視して見直しを。" }
      ],
      memo: "向山議員は6月12日の環境委員会で同じ事業を取り上げており、今回はその答弁（削減効果は見込み値、執行率36%、改修工事費平均370万円）を土台にした「続編」。笹川大臣は臨時国会で就任したばかりで、事業の3つの問題点への認識を問われた場面で「前大臣の発言を尊重する」と一言だけ答えたのが象徴的な場面。冒頭の全省庁調査の要求は、10月8日の代表質問で玉木代表が求めたものを環境省に当てはめた形。"
    }] },
  { id: "kobayashi", cats: [{ id: "disaster", label: "防災・被災", icon: "⛑️", preview: "千葉豪雨で1,000か所超の崖崩れ。所有者不明土地が崩落源でも管理人選任や道路法68条で対応可能と答弁、だが災害での実績は「把握なし」" }, { id: "justice", label: "法務・人権", icon: "⚖️", preview: "検察ハラスメント調査結果を山下法相が「私の責任で公表」と明言。所有者不明土地の災害時運用では陳述聴取の省略は可能だが費用回収は民法上困難" }, { id: "infra", label: "交通・インフラ", icon: "🚃", preview: "国道・県道の通行止め133か所、停電約6万件。道路管理者は所有者不明土地でも道路法68条で立ち入り・危険除去ができると国交省が説明" }, { id: "defense", label: "防衛", icon: "🛡️", preview: "五ノ井里奈さん事案で防衛省が刑事事件継続中に特別防衛監察を実施・公表した経緯を説明。検察との対応の差を議員が指摘" }, { id: "work", label: "働き方", icon: "💼", preview: "力関係が非対称な職場で被害申告ができない構造を議員が提起。「声が上がらないのは『無い』のではなく『上げられない』」" }], name: "小林さやか", initial: "小", dateLabel: "10/27", unread: 2, addedOn: "2026-10-27",
    preview: "所有者不明土地の崖崩れ対応は災害での実績「把握なし」。検察ハラスメント調査結果は法相が「私の責任で公表」と明言",
    articles: [    {
      date: "2026年10月27日", committee: "参議院・法務委員会",
      cats: ["disaster", "justice", "infra"],
      title: "「崖が崩れても民地なら手が出せない」千葉豪雨を踏まえ小林議員、所有者不明土地の災害対応を法務・国交・最高裁に問う",
      summary: "千葉豪雨・台風25号で1,000か所超の土砂崩れが起きた経験から、民有地・所有者不明土地が崩落源の場合に誰が土砂撤去と斜面補強を行い費用を負担するのか、災害時に今の制度が機能するかを問うた。政府は、公告不要の管理不全土地管理制度を緊急対応に活用できる余地があり、所有者の陳述聴取を省略して管理人を選任できると答弁。道路については道路法68条で所有者不明でも危険除去できると説明。最高裁は災害後に管理人を選任し工事を行った実績を「把握していない」と答弁。管理人が選任されても工事費用の確保は別問題で、相手に資力がなければ回収困難という民法上の限界が確認された。",
      noteUrl: "https://note.com/tamakitext/n/na51c434cc1fa",
      fullUrl: "full/2026-10-27-kobayashi.html",
      bubbles: [
        { side: "left", speaker: "小林さやか", text: "千葉豪雨と台風25号で1,000か所超の土砂崩れが発生し、多くが民有地。誰が責任を負い誰が費用を払うのか自治体すら把握していない。災害時の緊急対応に今の制度は機能するのか。課題は。" },
        { side: "right", speaker: "山下法務大臣", text: "令和3年の改正で相続登記を義務化しました。所有者不明土地管理制度は1か月以上の公告が要件ですが、公告不要の管理不全土地管理制度は緊急時に使える余地があり、関係省庁と検討します。" },
        { side: "left", speaker: "小林さやか", text: "他人の自然の崖が崩れて住家に土砂が流入し、斜面はなお不安定。土地所有者は民法上どんな責任を負い、被害住民は撤去や再崩落防止をどう求められるのか。" },
        { side: "right", speaker: "松井民事局長", text: "所有者に崩落について過失があれば不法行為に基づく損害賠償責任を負います。損害発生前でも具体的な危険があれば、住宅所有者は妨害予防請求として危険除去の措置を請求できます。" },
        { side: "left", speaker: "小林さやか", text: "自然災害で所有者が当然に賠償責任を負うわけではない。1戸だけの被害では国交省の崖対策事業もほぼ使えない。崩落源が所有者不明土地なら泣き寝入りでは。取り得る対応は。" },
        { side: "right", speaker: "松井民事局長", text: "周辺住民は管理不全土地管理命令を裁判所に請求し、選任された管理人を通じて危険排除や二次災害予防の措置を講ずることが考えられます。" },
        { side: "left", speaker: "小林さやか", text: "最高裁に聞く。所有者不明土地管理制度や管理不全土地管理制度で、災害後に管理人を選任して実際に土砂撤去や再崩落防止工事を行った実績は本当にあるのか。" },
        { side: "right", speaker: "福田最高裁民事局長", text: "ご指摘の事例が存在するか否かについては把握しておりません。" },
        { side: "left", speaker: "小林さやか", text: "おそらくほとんどない。千葉は豪雨と台風の間が1か月。土地特定、資料、予納金と、混乱の中で被災者が手続きを進めるのは容易でない。災害時は管理人選任を急ぐ運用上の措置はないのか。" },
        { side: "right", speaker: "松井民事局長", text: "管理不全土地管理命令は原則所有者の陳述を聞きますが、緊急性があり目的を達せない事情があれば聞かずに命令できます。二次災害の恐れがあれば陳述聴取を省略して選任すると考えられます。" },
        { side: "left", speaker: "小林さやか", text: "管理人が選任されても工事費用は別問題。土地に財産価値がなければ被害住民の自費負担になる。他人の土地の安全確保に被害者が多額の費用を出すのは現実的でない。費用負担をどう見るか。" },
        { side: "right", speaker: "松井民事局長", text: "民民の関係なので費用を先に支出し求償や損害賠償請求をすることになりますが、相手が見つからない、資力がない場合は回収が難しい。そのため行政面での措置も予定されていると承知しています。" },
        { side: "left", speaker: "小林さやか", text: "国道・県道だけで通行止め133か所、停電約6万件。道路の土砂は撤去できても崩落源の民地斜面が不安定なら再流入する。所有者不明なら道路管理者はどんな法的根拠で危険除去できるのか。" },
        { side: "right", speaker: "鈴木国交省次長", text: "道路法68条で、非常災害のためやむを得ない場合は現場の土地を一時使用し、物件を使用・収用・処分できます。所有者不明でも立ち入りや危険除去を行うことができます。" },
        { side: "left", speaker: "小林さやか", text: "一時的な危険除去の後、恒久的に斜面を保持・管理する対策は道路管理者に取れるのか。" },
        { side: "right", speaker: "鈴木国交省次長", text: "ケースバイケースです。法面保護が必要なら、災害復旧でその区域を道路区域にして土地を購入することも考えられます。" },
        { side: "left", speaker: "小林さやか", text: "自治体やインフラ事業者が所有者を探索するのを、法務局が優先的に支援する仕組みはあるか。崖崩れで地番が特定できない場所も多い。" },
        { side: "right", speaker: "松井民事局長", text: "自治体の求めに応じ登記情報や地図情報を提供しており、能登半島地震や熊本地震でも行いました。地図未整備で地番や筆界が特定できない相談には、旧土地台帳付属地図等に基づき助言しています。" },
        { side: "left", speaker: "小林さやか", text: "千葉の崖崩れ1,000か所のうち、国交省事業の採択はわずか4か所、協議中15か所。資力のない自治体は民地かつ所有者不明と聞くと腰が引ける。制度と救済が合致していない。" },
        { side: "left", speaker: "小林さやか", text: "所有者の責任は維持しつつ、第三者の生命に重大な危険があれば行政が先行して工事し、費用は後から公的支援を組み合わせる横串の仕組みを。運用指針も含め大臣が中核で進めては。" },
        { side: "right", speaker: "山下法務大臣", text: "民法上の制度に加え関係法令の活用も重要です。能登では滅失登記を迅速化し公費解体に繋げました。関係府省庁の検討には民事基本法制の所管として協力し、登記情報の提供等で貢献します。" },
        { side: "left", speaker: "小林さやか", text: "正直、自治体は発災時に制度を知らない。「崖が崩れたら何ができるか」の一覧が入っている自治体はほとんどない。既に取り組んでいることの周知を。" }
      ],
      memo: "山下大臣は所有者不明土地対策に以前から取り組んできた経緯があり、小林議員はそれを踏まえて「平時の制度は整ったが災害時に機能するか」という切り口で迫った。法務省・最高裁・国交省の3者に順に聞くことで、「法的権限は取れても実績がなく、費用も確保できない」という制度の隙間を浮かび上がらせた構成。大臣は「横串の仕組みを中核で進めては」との求めに対し、「協力」「貢献」と答え、自ら主導するとは言わなかった。"
    },     {
      date: "2026年10月27日", committee: "参議院・法務委員会",
      cats: ["justice", "defense", "work"],
      title: "「握り潰すことは絶対ない」山下法相、検察ハラスメント調査の結果公表を「私の責任で」と明言——大阪地検事案は「個別事件」でコメント控える",
      summary: "相次ぐ検察不祥事、特に大阪地検元検事正による部下への性暴力事案を取り上げ、防衛省が五ノ井里奈さんの事案で刑事事件継続中でも特別防衛監察を行い結果を公表した例を引いて、検察にも第三者調査と結果公表を求めた。大臣は大阪地検事案は公判継続中の個別事件として所感を控えつつ、検察が全職員対象のハラスメント調査を実施中で、結果は「私の責任において公表する」と明言。「握り潰されることはあってはならない」と断言した。調査の立て付けそのものを第三者の枠組みで見直すかについては、「弁護士出身の大臣として見る」「犯罪なら法廷が究極の第三者」との答えにとどまり、独立機関による調査への転換は約束されなかった。",
      noteUrl: "https://note.com/tamakitext/n/na51c434cc1fa",
      fullUrl: "full/2026-10-27-kobayashi.html",
      bubbles: [
        { side: "left", speaker: "小林さやか", text: "検察不祥事が相次ぐ。再審法の議論が紛糾した根底にも検察不信がある。検察官出身の大臣として、信頼回復への思いは。" },
        { side: "right", speaker: "山下法務大臣", text: "検察の権限は国民の信頼の上に成り立ち、適正さが疑われれば基盤も揺らぎます。強い危機感と忸怩たる思いを持ち、会同で「厳しさはまず自らに課すべき」と訓示しました。綱紀保持を伝えます。" },
        { side: "left", speaker: "小林さやか", text: "看過できないのが性暴力・ハラスメント事案。2018年に大阪地検検事正が酒に酔った部下の女性検事に性的暴行を加え、2024年に逮捕起訴された。検察は懲戒せず定年退職させた。認識は。" },
        { side: "right", speaker: "山下法務大臣", text: "元幹部が部下への準強制性交等事案で逮捕起訴されたことは誠に遺憾です。ただ公判継続中の個別事件への所感は控えざるを得ません。一般論として服務規律違反には厳正に対処すべきです。" },
        { side: "left", speaker: "小林さやか", text: "個別事案にコメントできないのは非常に残念。記者時代、捜査関係者からの性的接触の話は枚挙に暇がない。力関係は非対称で被害申告しづらく、二次加害の恐れから告発に至らない。氷山の一角。" },
        { side: "left", speaker: "小林さやか", text: "防衛省は五ノ井里奈さんの告発後、刑事事件継続中でも特別防衛監察と退職者を含む調査を行い結果を公表、第三者委員会で再発防止策まで講じた。なぜそうした対応が取れたのか。" },
        { side: "right", speaker: "末富防衛省審議官", text: "従来の対策が組織全体に行き渡っていなかった現れと深刻に受け止め、令和4年9月に特別防衛監察を実施、11月に部外有識者会議を設置。令和5年8月に結果と提言を公表し、見直し中です。" },
        { side: "left", speaker: "小林さやか", text: "公表は刑事判決の前の8月だった。事件継続中でも調査の進行に影響はなかったということでよいか。" },
        { side: "right", speaker: "末富防衛省審議官", text: "監察と有識者会議は個別訴訟の事実認定が目的ではなく、組織的課題の把握と防止対策の抜本的見直しのためのものです。速やかに対策を講じる必要から令和5年8月に公表しました。" },
        { side: "left", speaker: "小林さやか", text: "6月に第三者調査を求めたが、事件継続中や捜査機関の特殊性を理由に進まなかった。防衛省にできたのだから、検察にできない理由はないのでは。" },

    },     {
      date: "2026年10月27日", committee: "参議院・内閣委員会",

      title: "「18歳の壁」に横串を——牛田議員、障害者支援は経済政策と訴え中司大臣に決意を問う。欠席時対応加算は「拡充を検討中」と厚労省",
      summary: "所信表明で障害者政策への言及がなかった点を確認した上で、偏見・差別解消の行動計画の評価体制、特別支援学校高等部専攻科など学びの継続、生活介護の欠席時対応加算、そして「18歳の壁」解消への大臣の横串と決意を問うた。中司大臣は共生社会実現の方針は変わらないと答え、行動計画は推進本部幹事会と障害者政策委員会でフォローアップ済みと説明。厚労省は令和9年度報酬改定で欠席時対応加算の拡充を検討中、文科省は専攻科を含む教育の充実に努めると答弁。「大臣が先頭に立って横串を」との求めに対し、大臣は「個別の支援策は所管省庁が運用」「内閣府はフォローアップ」と述べ、自ら主導するとは言わなかった。",
      noteUrl: "https://note.com/tamakitext/n/n6a30b2cfd242",
      fullUrl: "full/2026-10-27-ushida.html",
      bubbles: [
        { side: "left", speaker: "牛田まゆ", text: "総理は施政方針演説で障害や住む地域で不公平がない社会を目指すと述べたが、所信表明では子育て、障害者政策、孤独・孤立対策への具体的言及がない。政府方針は変わらないか。大臣の姿勢は。" },

        { side: "left", speaker: "牛田まゆ", text: "特別支援学校高等部を卒業すると生活の場が福祉サービスに大きく変わる。発達に遅れのある子は卒業時点でまだ学びの途中。教育と福祉の連携、専攻科のように学び続けられる仕組みの意義は。" },

      memo: "「18歳の壁」は、障害のある子が特別支援学校高等部を卒業する18歳を境に、放課後等デイサービスなど児童向け支援が終わり、生活の場も親の就労環境も一変する問題。牛田議員は文科省（学びの継続）・厚労省（事業所の報酬）・内閣府（横串）の3省庁を同じ場に並べ、省庁間の隙間を可視化する構成を取った。保護者の「お金を出してほしいのではなく、働き続けられる環境を」という声と、経済効果の試算を組み合わせて「福祉政策であり経済・雇用政策」と位置づけたのが本質疑の軸。大臣の答弁は「フォローアップ」にとどまり、議員は「それだけでなく制度改善を」と締めた。"

  { id: "harada", cats: [{ id: "money", label: "税とお金", icon: "💰", preview: "就業者負担軽減支援金の対象（約2000万人）はあくまで参考で、所得上限など「肝心な部分は決まっていない」と片山財務相。国債NISAは「高所得者優遇」の論点で議論中。" }, { id: "children", label: "子ども・家族", icon: "👶", preview: "制度の根拠は世帯年収510万円以下の子育て世帯の高負担だが、原田議員の試算では対象の86%が子育て世帯以外。専業主婦世帯が対象かは「個人単位なので答えられない」。" }, { id: "election", label: "選挙・政治改革", icon: "🗳️", preview: "所得上限・支援額・子ども加算など法律に数字が一つもなく政令委任。「国会への白紙委任」と議員が批判し、政令の骨子の事前提出を要求。" }], name: "原田ひでかず", initial: "原", dateLabel: "10/27", unread: 1, addedOn: "2026-10-27",
    preview: "支援金の対象者内訳は「統計上明らかでない」と政府。原田議員の独自試算では86%が子育て世帯以外。大臣は「肝心な部分は決まっていない」、議員は政令の骨子提出を要求。",
    articles: [    {
      date: "2026年10月27日", committee: "参議院・財政金融委員会",
      cats: ["money", "children", "election"],
      title: "「支援金の対象者の86%は子育て世帯ではない」原田議員が独自試算で制度の根拠を追及——片山財務相「肝心な部分は決まっていない」、政令の骨子提出を要求",
      summary: "国民民主党提出の国債NISA法案の検討状況を確認した上で、就業者負担軽減支援金について、低・中・高所得の区分、対象約2000万人の属性内訳、制度の根拠とされた純負担率の国際比較（翁カーブ）と実際の対象者の整合性、政令委任の是非を問うた。政府は国債税制について「投資家層の拡大」と「貯蓄から投資へとの整合・高所得者優遇」の両論があり議論中と答弁。支援金は「諸外国の類似制度で現役就業者の約3割が対象、日本なら約2000万人」はあくまで参考で、所得上限などの「肝心な部分は決まっていない」と大臣が認めた。対象者の配偶者・子の有無別の内訳は「統計上明らかでない」、世帯年収450万円の専業主婦世帯が対象になるかは「個人単位の制度で答えられない」とされ、議員は対象者の86%が子育て世帯ではないとの独自試算を示し、政令の骨子の事前提出を求めた。",
      noteUrl: "https://note.com/tamakitext/n/n42df97ff9f60",
      fullUrl: "full/2026-10-27-harada.html",
      bubbles: [
        { side: "left", speaker: "原田ひでかず", text: "先の国会で我が党が提出した国債NISA法案について。令和9年度税制改正要望でも金融庁と財務省が共同で国債に関する税制の検討を要望している。現在の検討状況は。" },
        { side: "right", speaker: "片山財務大臣", text: "金融庁と財務省の連名で事項要望として出しました。投資家層の拡大に意味があるとの意見がある一方、「貯蓄から投資へ」と整合しない、高所得者優遇にならないかという論点もあり、議論中です。" },
        { side: "left", speaker: "原田ひでかず", text: "総理も代表質問で「高所得者優遇にならないか」を論点に挙げた。だからこそNISAの枠に限定して税制優遇するのが理にかなうのでは。大臣の考えは。" },
        { side: "right", speaker: "片山財務大臣", text: "与党内にもその意見はあります。他方、資産運用立国はリスク資産への流れづくりなので疑問の声も。国債中心の投信はNISAにあるとの意見もあり、一筋縄ではいきませんが丁寧に議論します。" },
        { side: "left", speaker: "原田ひでかず", text: "就業者負担軽減支援金法案は第1条で目的を中所得者の就業者の可処分所得の増大としている。政府は個人年収でいくらまでを低所得、いくらからいくらを中所得、いくら以上を高所得と考えるのか。" },
        { side: "right", speaker: "岡本内閣審議官", text: "明確な定義はないと承知しています。諸外国の類似制度では現役就業者の約3割が支給対象と推計され、6000万人の3割は2000万人程度ですが、このデータのみで決めるものではありません。" },
        { side: "left", speaker: "原田ひでかず", text: "総理が参考とした年収100万円以上350万円未満の雇用者数と、そのうち①配偶者のいない方②配偶者がいて18歳未満の子がいる方③配偶者がいて子がいない方の内訳は。概算でよい。" },
        { side: "right", speaker: "岡本内閣審議官", text: "民間給与実態統計で年収100万〜350万円層は約2000万人ですが、対象者数を決めているわけではありません。配偶者や子の有無別の人数・割合は統計上明らかでなく、お答えが難しい。" },
        { side: "left", speaker: "原田ひでかず", text: "公表統計から自分で試算した。配偶者の所得制限を700万円とすると対象は1600万人。うち配偶者なしが49%、子がいないか子育てを終えた夫婦が37%、18歳未満の子がいる方は14%。" },
        { side: "left", speaker: "原田ひでかず", text: "負担率が高い子育て世代の負担軽減に、この支援金がうまくマッチしているのか疑問がわく。" },
        { side: "left", speaker: "原田ひでかず", text: "純負担率の国際比較のモデル世帯は、35歳の共働き夫婦、子2人、夫婦の給与は1対1という前提で間違いないか。" },
        { side: "right", speaker: "岡本内閣審議官", text: "給与所得の単身世帯と、35歳の共働き夫婦が同額の給与を得て2歳と5歳の子2人がいる世帯について、世帯収入と純負担率の関係を分析しています。" },
        { side: "left", speaker: "原田ひでかず", text: "世帯年収510万円以下の子育て世帯の負担率が高いという「翁カーブ」を根拠に制度設計したと総理も大臣も答弁した。だが私の試算では対象者の86%は子育て世帯ではない。" },
        { side: "left", speaker: "原田ひでかず", text: "日本の単身者の負担率は国際比較で低いのに、現状の制度は負担率の低い単身者に給付する形だ。根拠データと実際に給付が届く人が一致していないのでは。属性の内訳を試算しているのか。" },
        { side: "right", speaker: "片山財務大臣", text: "夫婦と子2人の世帯で諸外国より純負担率が高い中低所得の現役勤労者に注目して支給要件を検討します。子育て世代への配慮は当然考慮され子ども加算がつきますが、水準は審議の中で検討中です。" },
        { side: "right", speaker: "片山財務大臣", text: "2000万人・3割はあくまで試算で、肝心な部分は決まっていません。単身より夫婦と子2人の世帯の方が差が大きい統計を参考に要件を定め、他の世帯類型にも配慮します。割合は今は出ません。" },
        { side: "left", speaker: "原田ひでかず", text: "世帯年収450万円、夫婦と子2人、妻は専業主婦、対象年収が100万〜350万円の場合、この子育て世帯は支援金の対象になるのか。" },
        { side: "right", speaker: "岡本内閣審議官", text: "支援金は個人の所得に基づく個人単位の制度設計で、世帯単位で判断するものではありません。世帯収入510万円を参考に個人所得で上限をどう設定するかは今後検討するため、お答えが難しい。" },
        { side: "left", speaker: "原田ひでかず", text: "日本は低所得子育て世代への負担軽減が他国より明らかに少なく、これが翁カーブの原因。なら低所得子育て世代が対象になる設計が必要。" },
        { side: "left", speaker: "原田ひでかず", text: "法案が政令に委ねるのは所得下限・上限、純負担基準額、配偶者の所得上限、支援額、子の加算額。誰にいくら何人に配るか法律に数字が一つもない。国会への白紙委任を適切と考えるか。" },
        { side: "right", speaker: "片山財務大臣", text: "税・社会保険料の制度改正や国際比較の変化に柔軟に対応するため、具体的な支援額等は政令で定めます。高等学校等就学支援金も上限額は政令。考慮要素は法案に規定し、審議で丁寧に説明します。" },
        { side: "left", speaker: "原田ひでかず", text: "政令の骨子を法案審議の前に国会に提出することを強く強く求める。" }
      ],
      memo: "原田議員は証券会社出身で、政府が内訳を「統計上明らかでない」と答えたのに対し、就業構造基本調査と国民生活基礎調査から自ら試算して数字をぶつけたのが本質疑の核。政府が制度の根拠とする「翁カーブ」（夫婦・子2人世帯で世帯年収510万円以下の純負担率が諸外国より高い）と、実際に給付が届く層（個人年収100万〜350万円＝単身者や扶養を外れて働く層が多い）のズレを突いた。片山大臣は「肝心な部分は決まっていない」と率直に認め、「10月末に出る総務省の家計構造の統計の個票まで当たらないと分からない」とも述べた。"
    }] },
  { id: "kondo", cats: [{ id: "money", label: "税とお金", icon: "💰", preview: "国債の持ち手を個人へ。個人向け国債は「中途解約でも元本割れなし」の特徴を踏まえ見直しを検討、具体策は「予断をもって申し上げる段階ではない」" }, { id: "work", label: "働き方", icon: "💼", preview: "REVIC「レビキャリ」のマッチングは530件、登録人材は8,190人に。補正予算での拡充が続いてきた事業の継続と当初予算計上を求めた" }], name: "近藤雅彦", initial: "近", dateLabel: "10/21", unread: 1, addedOn: "2026-10-26",

    articles: [{

      memo: "この日の軸は「国債を誰が持つのか」。金融機関の国債投資余力が細る中で、財務省は個人を含む幅広い投資家層の拡大を「一層重要」と認め、個人向け国債の見直しを「早急に具体化」と一歩踏み込んだ。一方で見直しの中身は「予断をもって申し上げる段階ではない」とされ、国債のNISA対象化という党提案への直接の言及もなかった。次は商品性の見直し案と、暗号資産規制の政令等がいつ姿を見せるかを追う。"

  { id: "hamano", cats: [{ id: "money", label: "税とお金", icon: "💰", preview: "国債は日銀当座預金で買われ、政府支出で預金が生まれる——日銀は実務の仕組みを確認したが、「財政は破綻しない」との結論までは示されず" }, { id: "health", label: "医療・福祉", icon: "🏥", preview: "年金のマクロ経済スライドを物価連動に変えるべきだと提案。厚労大臣は「やめれば将来世代の給付水準が低下する」と現行維持の立場" }], name: "浜野よしふみ", initial: "浜", dateLabel: "10/19", unread: 1, addedOn: "2026-10-26",

    articles: [{

function latestArticle(m) {

          '<div class="talk-preview">' + (first.entry.preview || first.member.preview) + "（" + first.member.name + "）</div>" +
          '<div class="cat-meta">質疑 ' + roomArticleCount(entries, cat.id) + "件</div></div>" +
          (newCount ? '<div class="badge">' + newCount + "</div>" : "");
        row.addEventListener("click", () => openCategory(cat.id));
        talkList.appendChild(row);
      });
  }
  renderFtResults(filter);
  if (!talkList.children.length) {
    talkList.innerHTML = '<div style="padding:22px;text-align:center;color:#8a97a3;font-size:13px;">見つかりませんでした</div>';
  }
}

function markSelected(key) {
  document.querySelectorAll(".talk").forEach(r => r.classList.toggle("selected", r.dataset.key === key));
  const bar = document.getElementById("findBar");
  if (bar) bar.style.display = "";
}

function setTab(tab) {
  currentTab = tab;
  document.getElementById("tabMembers").classList.toggle("active", tab === "members");
  document.getElementById("tabCats").classList.toggle("active", tab === "cats");
  renderList(document.getElementById("searchBox").value.trim());
}

function renderArticle(body, member, a) {
  const date = document.createElement("div");
  date.className = "date-chip"; date.textContent = a.date + "｜" + member.name;
  body.appendChild(date);
  if (a.committee) {
    const c = document.createElement("div");
    c.className = "committee-chip"; c.textContent = a.committee;
    body.appendChild(c);
  }
  if (a.pending) {
    const p = document.createElement("div");
    p.className = "pending";
    p.innerHTML = "<strong>" + a.title + "</strong><br>この記事の吹き出し要約は準備中です。全文はnoteで読めます。";
    body.appendChild(p);
    const link = document.createElement("a");
    link.className = "full-link"; link.href = NOTE_TOP; link.target = "_blank"; link.rel = "noopener";
    link.textContent = "noteで全文を読む";
    body.appendChild(link);
    return;
  }
  const card = document.createElement("div");
  card.className = "card";
  card.innerHTML = '<b class="label">1分要約</b><br><strong>' + a.title + "</strong><br>" + a.summary;
  body.appendChild(card);
  a.bubbles.forEach(b => {
    const row = document.createElement("div");
    row.className = "row " + b.side;
    const isRight = b.side === "right";
    row.innerHTML =
      (isRight ? "" : '<div class="mini-avatar">' + member.initial + "</div>") +
      '<div class="bubble-wrap"><div class="speaker">' + b.speaker + '</div><div class="bubble">' + b.text + "</div></div>";
    body.appendChild(row);
  });
  const memo = document.createElement("div");
  memo.className = "card memo";
  memo.innerHTML = '<b class="label">こくうさメモ</b><br>' + a.memo;
  body.appendChild(memo);
  if (a.fullUrl) {
    const link = document.createElement("a");
    link.className = "full-link"; link.href = a.fullUrl;
    link.textContent = a.fullLabel || "全文文字起こしを読む";
    link.addEventListener("click", ev => { ev.preventDefault(); openFull(member, a); });
    body.appendChild(link);
  } else {
    const link = document.createElement("a");
    link.className = "full-link"; link.href = a.noteUrl; link.target = "_blank"; link.rel = "noopener";
    link.textContent = "全文文字起こしを読む（note）";
    body.appendChild(link);
  }
}

async function openFull(member, a) {
  const body = document.getElementById("threadBody");
  try {
    const res = await fetch(a.fullUrl);
    if (!res.ok) throw new Error("fetch failed");
    const html = await res.text();
    const doc = new DOMParser().parseFromString(html, "text/html");
    const content = doc.querySelector("#articleBody");
    if (!content) throw new Error("no article body");
    body.innerHTML = "";
    const back = document.createElement("button");
    back.className = "full-back"; back.type = "button";
    back.textContent = "← 要約に戻る";
    back.addEventListener("click", () => openThread(member));
    body.appendChild(back);
    const head = document.createElement("div");
    head.className = "card";
    head.innerHTML = "<strong>" + a.title + "</strong><br>" + a.date + "｜" + member.name + "｜" + (a.fullLabel ? "会議録（抜粋）" : "全文文字起こし");
    body.appendChild(head);
    const wrap = document.createElement("div");
    wrap.className = "full-doc";
    wrap.innerHTML = content.innerHTML;
    body.appendChild(wrap);
    document.getElementById("findInput").value = ""; clearHits();
    document.getElementById("threadPlaceholder").style.display = "none";
    const bar = document.getElementById("findBar");
    if (bar) bar.style.display = "";
    if (!isDesktop()) listView.style.display = "none";
    threadView.style.display = "flex";
    window.scrollTo(0, 0);
    body.scrollTop = 0;
  } catch (e) {
    window.location.href = a.fullUrl;
  }
}


function roomArticleCount(entries, catId) {
  const seen = new Set();
  entries.forEach(e => e.member.articles.forEach(a => {
    if (!a.cats || a.cats.includes(catId)) seen.add((a.fullUrl || a.noteUrl || "") + "|" + a.title);
  }));
  return seen.size;
}
function openCategory(catId) {
  const group = MEMBERS.filter(m => m.cats.some(c => c.id === catId));
  if (!group.length) return;
  const cat = group[0].cats.find(c => c.id === catId);
  document.getElementById("threadName").textContent = cat.icon + " " + cat.label;
  document.getElementById("threadSub").textContent = "テーマ別の質疑";
  const body = document.getElementById("threadBody");
  body.innerHTML = "";
  const seenRoom = new Set();
  const roomItems = [];
  group.forEach(m => m.articles.forEach(a => { if (!a.cats || a.cats.includes(catId)) roomItems.push({ m, a }); }));
  roomItems.sort((x, y) => {
    const e = (x.a.entrance ? 1 : 0) - (y.a.entrance ? 1 : 0);
    if (e) return e;
    return (articleTime(y.a) || 0) - (articleTime(x.a) || 0);
  });
  roomItems.forEach(({ m, a }) => { const key = (a.fullUrl || a.noteUrl || "") + "|" + a.title; if (seenRoom.has(key)) return; seenRoom.add(key); renderArticle(body, m, a); });
  document.getElementById("findInput").value = ""; clearHits();
  document.getElementById("threadPlaceholder").style.display = "none";
  if (!isDesktop()) listView.style.display = "none";
  threadView.style.display = "flex";
  window.scrollTo(0, 0);
  group.forEach(markRead);
  renderList(document.getElementById("searchBox").value.trim());
  markSelected(catId);
}

function openThread(member) {
  document.getElementById("threadName").textContent = member.name;
  document.getElementById("threadSub").textContent = member.articles[0].committee || "国会質疑";
  const body = document.getElementById("threadBody");
  body.innerHTML = "";
  member.articles.forEach(a => renderArticle(body, member, a));
  document.getElementById("findInput").value = ""; clearHits();
  document.getElementById("threadPlaceholder").style.display = "none";
  if (!isDesktop()) listView.style.display = "none";
  threadView.style.display = "flex";
  window.scrollTo(0, 0);
  markRead(member);
  renderList(document.getElementById("searchBox").value.trim());
  markSelected(member.id);
}

function isDesktop() { return window.matchMedia("(min-width: 900px)").matches; }
document.getElementById("backBtn").addEventListener("click", () => {
  if (isDesktop()) return;
  threadView.style.display = "none";
  listView.style.display = "";
});
function syncLayout() {
  if (isDesktop()) {
    listView.style.display = "";
    threadView.style.display = "flex";
    if (!document.getElementById("threadBody").children.length) {
      document.getElementById("findBar").style.display = "none";
    }
  } else {
    if (threadView.style.display === "flex" && document.getElementById("threadBody").children.length) {
      listView.style.display = "none";
    }
  }
}
window.addEventListener("resize", syncLayout);
syncLayout();
document.getElementById("searchBox").addEventListener("input", e => renderList(e.target.value.trim()));
document.getElementById("tabMembers").addEventListener("click", () => setTab("members"));
document.getElementById("tabCats").addEventListener("click", () => setTab("cats"));

/* full-text search (index built by make-search-index.py) */
let FT_INDEX = null, FT_LOADING = false;
function escHtml(s) { return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
function ensureFtIndex() {
  if (FT_INDEX || FT_LOADING) return;
  FT_LOADING = true;
  fetch("fulltext-index.json").then(r => r.json()).then(d => {
    FT_INDEX = d; FT_LOADING = false;
    renderList(document.getElementById("searchBox").value.trim());
  }).catch(() => { FT_LOADING = false; FT_INDEX = []; });
}
function renderFtResults(filter) {
  if (!filter) return;
  ensureFtIndex();
  if (!FT_INDEX) {
    const d = document.createElement("div");
    d.className = "ft-loading"; d.textContent = "全文も検索しています…";
    talkList.appendChild(d);
    return;
  }
  const hits = [];
  FT_INDEX.forEach(e => {
    const i = e.t.indexOf(filter);
    if (i < 0) return;
    let found = null;
    MEMBERS.forEach(m => m.articles.forEach(a => { if (!found && a.fullUrl === e.u) found = { m, a }; }));
    if (found) hits.push({ e, i, m: found.m, a: found.a });
  });
  hits.sort((x, y) => (articleTime(y.a) || 0) - (articleTime(x.a) || 0));
  if (!hits.length) return;
  const head = document.createElement("div");
  head.className = "ft-head";
  head.textContent = "全文から見つかった記事（" + hits.length + "件）";
  talkList.appendChild(head);
  hits.slice(0, 30).forEach(h => {
    const row = document.createElement("div");
    row.className = "talk";
    const start = Math.max(0, h.i - 30);
    const snipHtml = (start > 0 ? "…" : "") +
      escHtml(h.e.t.slice(start, h.i)) +
      "<mark>" + escHtml(filter) + "</mark>" +
      escHtml(h.e.t.slice(h.i + filter.length, h.i + filter.length + 42)) + "…";
    row.innerHTML =
      '<div class="avatar">' + h.m.initial + "</div>" +
      '<div class="talk-main"><div class="talk-top"><span class="talk-name">' + h.m.name + '</span>' +
      '<span class="talk-date">' + (articleDateLabel(h.a) || "") + "</span></div>" +
      '<div class="talk-preview">' + h.a.title + "</div>" +
      '<div class="ft-snippet">' + snipHtml + "</div></div>";
    row.addEventListener("click", async () => {
      await openFull(h.m, h.a);
      const fi = document.getElementById("findInput");
      fi.value = filter;
      runFind();
    });
    talkList.appendChild(row);
  });
}

/* in-article find */
let hitMarks = [], hitIdx = -1;
function clearHits() {
  document.querySelectorAll("#threadBody mark.hit").forEach(m => m.replaceWith(document.createTextNode(m.textContent)));
  document.getElementById("threadBody").normalize();
  hitMarks = []; hitIdx = -1;
  document.getElementById("findCount").textContent = "";
}
function runFind() {
  clearHits();
  const q = document.getElementById("findInput").value.trim();
  if (!q) return;
  const body = document.getElementById("threadBody");
  const walker = document.createTreeWalker(body, NodeFilter.SHOW_TEXT, {
    acceptNode: n => n.nodeValue.includes(q) ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_REJECT
  });
  const nodes = [];
  while (walker.nextNode()) nodes.push(walker.currentNode);
  nodes.forEach(node => {
    const frag = document.createDocumentFragment();
    let rest = node.nodeValue;
    while (true) {
      const i = rest.indexOf(q);
      if (i < 0) { frag.appendChild(document.createTextNode(rest)); break; }
      if (i > 0) frag.appendChild(document.createTextNode(rest.slice(0, i)));
      const mk = document.createElement("mark");
      mk.className = "hit"; mk.textContent = q;
      frag.appendChild(mk); hitMarks.push(mk);
      rest = rest.slice(i + q.length);
    }
    node.replaceWith(frag);
  });
  if (hitMarks.length) { hitIdx = 0; showHit(); }
  else document.getElementById("findCount").textContent = "0件";
}
function showHit() {
  hitMarks.forEach((m, i) => m.classList.toggle("current", i === hitIdx));
  document.getElementById("findCount").textContent = (hitIdx + 1) + "/" + hitMarks.length + "件";
  hitMarks[hitIdx].scrollIntoView({ block: "center", behavior: "smooth" });
}
document.getElementById("findNext").addEventListener("click", () => {
  if (!hitMarks.length) { runFind(); return; }
  hitIdx = (hitIdx + 1) % hitMarks.length; showHit();
});
document.getElementById("findPrev").addEventListener("click", () => {
  if (!hitMarks.length) { runFind(); return; }
  hitIdx = (hitIdx - 1 + hitMarks.length) % hitMarks.length; showHit();
});
document.getElementById("findInput").addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); runFind(); } });
document.getElementById("findInput").addEventListener("search", runFind);

renderList();
