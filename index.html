        { side: "right", speaker: "高市総理", text: "年金積立金を活用して社会保険料を引き下げることは、将来世代の給付水準の低下につながり得るため、適当ではないと考えています。" },

      noteUrl: "https://note.com/tamakitext/n/nf18e5c63411c",
      fullUrl: "full/2026-10-22-iizumi.html",
      bubbles: [
        { side: "left", speaker: "古屋圭司団長", text: "調査団は9月2日から13日まで、スイス、ハンガリー、イタリアの3か国を訪問しました。いずれも憲法改正を度々行っている国です。関心事項は、第1に国防・安全保障、第2に緊急事態条項、第3に国民投票の3つで、各国の政府・議会・有識者と意見交換を行いました。" },

        { side: "left", speaker: "古屋圭司団長", text: "ハンガリーの国防の基本原則は、自国軍による個別防衛、NATOによる集団防衛、そして憲法31条1項に定める「すべての国民による祖国防衛の義務」の3つです。同国は2011年の基本法制定後も改正を重ねており、現政権はこの秋から1年半〜2年をかけて新憲法制定のプロセスを進める予定だとの説明でした。一方でハンガリーの要人からは、80年近く改正されていない日本国憲法の安定性への羨望も一様に示されました。" },

        { side: "left", speaker: "古屋圭司団長", text: "イタリア憲法は11条で戦争の「拒絶」を、52条1項で市民の祖国防衛義務を定めています。両条文は合わせて読み、ポイントは「平和を保つための防衛」だとの説明でした。52条2項の兵役義務は2005年に停止され、現在は志願制です。なお国防省の政務次官は「個人的には」と断った上で、市民が軍の価値観を理解するために一定の兵役経験は重要だとの見解を示し、強制ではなく任意の兵役制度の法案を作ったものの、2020年に廃案になったと紹介しました。" },
        { side: "left", speaker: "古屋圭司団長", text: "緊急事態条項について。スイス憲法には議員任期延長の明文規定がなく、学会でも意見が分かれているとのことでした。ハンガリーでは事態が戦争事態・緊急事態・危険事態の3つに整理され、議員任期の延長も可能ですが、国会は政府の緊急命令を廃止でき、「何より早期に選挙を実施すること」が大原則だと強調されました。イタリアでは戦争状態の認定は国会が行い、政府の緊急法律命令は2025年に39件出されるなど増えており、「数が多すぎる点は反省すべき」との認識も示されました。" },
        { side: "left", speaker: "古屋圭司団長", text: "国民投票について。スイスには10万人の署名で国民が憲法改正を発案できる仕組みがあり、直接民主制は国のアイデンティティと結びついているとの認識でした。ハンガリーでは、憲法改正に国民投票を導入することが選択肢として検討されていますが、情報操作への懸念から反対する個人的見解も述べられました。イタリアでは今年3月、司法組織改革の憲法改正が国民投票で否決されました。「国民投票は名称こそ中立的だが、実際はまさに政治的な投票にならざるを得ない」との評価も聞かれました。" },
        { side: "left", speaker: "飯泉嘉門", text: "スイスは職業軍人ではなく、徴兵による民兵が原則の国です。10万人規模の動員には有職者を集めるため1.4倍の14万人が必要になるとの話があり、「職業軍人の方が合理的ではないか」と質問を向けたところ、有職者の知識や技術を軍に活かすことができ、災害対応や警察への支援も可能になるとの答えでした。ただし最近は人を集めづらくなり、銃を持ちたくない人向けの代替任務を選ぶ人が圧倒的になっていて、制度の改編が急務とされている、とのことでした。" },
        { side: "left", speaker: "飯泉嘉門", text: "ハンガリーでは、2011年の改正で平和主義の象徴だった戦争放棄の条項が変わり、「国が国民を守るためには戦争のできる国になる必要がある」とされた経緯について、「国民はどう反応したか」と尋ねたところ、「国民は問題としなかった」との回答がありました。イタリアでは、変えてはならない条文は139条の共和政体のみで、11条と52条は変更不可の規定ではないとの説明を受けました。あわせて、ワイマール憲法が骨抜きにされナチスの台頭を許した歴史的事実も踏まえる必要がある、と考えています。" },
        { side: "right", speaker: "玉木雄一郎", text: "国民投票を考える上では、SNSの影響にしっかりルールを定めることが必要です。認知戦による選挙への介入は、緊迫感の高い国では対応が当たり前になっています。国民投票法でも具体的なルールを深めることを提案します。また、スイスのように投票用紙と解説パンフレットが事前に郵送される仕組みを踏まえ、広報協議会がどういう形で何を伝えるのかを具体的に定めることが極めて重要です。さらに、国民投票が時の政権への信任投票になってしまう問題を避けるため、大型国政選挙と国民投票の同日実施は基本的には避けるべきだと考えます。" },
        { side: "right", speaker: "玉木雄一郎", text: "来年の自民党大会で本当に発議をするのであれば、この臨時国会でどのようなスケジュールで何を議論するか定めてください。また代表質問でも総理に聞きましたが、自衛隊が軍隊なのか否か、ネガティブリストでいけるのかどうかについて、まず与党間で考え方を整理していただきたい。限られた時間で発議に行くのであれば、議論が煮詰まってきた緊急事態条項と合区の解消に絞って進めていただくことをお願いします。" },
        { side: "right", speaker: "新藤義孝（自民党）", text: "ハンガリーの要人からは「憲法を政権の都合で頻繁に改正すれば国は不安定なままだ。長期間改正しなくて済んでいる日本は羨ましい限りだ」との言葉がありました。国家の安定にとって憲法の存在は決定的に重要で、政権が変わっても揺るがない基本原則を定めることが大切だと受け止めました。その上で、時代の変化や国際情勢に応じて必要な憲法の見直しを行っていくことが重要だと、今回の意見交換を通じて実感しました。" },
        { side: "right", speaker: "西村ちなみ（中道）", text: "憲法改正が最優先の課題とは思えません。憲法によって国家権力を制限し、国民の自由や人権を守るのが立憲主義です。改正を権力を持つ側である政府や与党が積極的に提案してくる場合、その理由の正当性、必要性を厳しく判断することは当然だと考えます。団長報告にあった、ハンガリーの要人が日本国憲法の安定性に羨望を示したという点や、憲法が権力維持に利用された経緯は、我が国にとって示唆に富むものでした。" }
      ],
      memo: "この日の中心は「改正を重ねてきた国々から何を学ぶか」で、結論は出ていない。とりわけ切り取られやすいのが「徴兵」という言葉だが、本文の言及はすべて、ハンガリー・イタリア・スイスの担当者が自国の制度を説明した内容の報告であり、日本に徴兵制を導入しようという提案は、報告にも各委員の発言にも存在しない。ハンガリーの説明でも「復活の動きは現時点でない」ことが明記されている。次は審査会で玉木議員が求めた「議論の絞り込みとスケジュール」が示されるかどうかを追う。"
    }] },
  { id: "tamaki-press", cats: [{ id: "money", label: "税とお金", icon: "💰", preview: "2年後に中間層が大増税になる——住民税の恒久減税で防ぐ対案「現役世代減税法案」と約4.6兆円の財源を提示" }], name: "玉木雄一郎（定例会見）", initial: "玉", dateLabel: "10/20", unread: 1, addedOn: "2026-10-26",
    preview: "2年後に中間層が大増税になる——住民税の恒久減税で防ぐ対案「現役世代減税法案」と財源を提示",
    articles: [{
      date: "2026年10月20日", committee: "定例記者会見",
      title: "「2年後の中間層増税」を止めよ——対案「現役世代減税法案」を提示",
      summary: "党の対案「現役世代減税法案」（正式名：就業者の租税及び社会保険料による負担軽減のために講ずべき措置に関する法律案）の発表。玉木代表は、政府案への賛否は住民税の恒久減税が入ることが必要条件だと明言。財源約4.6兆円など数字はいずれも党の試算・提示。",
      noteUrl: "https://note.com/tamakitext/n/n419afb5c1025",
      fullUrl: "full/2026-10-20-tamaki-press.html",
      bubbles: [
        { side: "left", speaker: "司会", text: "国民民主党は先ほど、衆議院に「就業者の租税及び社会保険料による負担軽減のために講ずべき措置に関する法律案」、通称「現役世代減税法案」を提出してまいりました。まず玉木代表から説明をお願いいたします。（※冒頭は法案提出に伴うぶら下がりで、記者の質問ではなく司会の進行による）" },
        { side: "right", speaker: "玉木雄一郎", text: "今日から本会議で、飲食料品の消費税減税と支援金制度の審議が始まります。我が党は反対ありきではありませんが、現行法案の問題点への対案として法案を提出しました。最大の問題は、2029年度に消費税率が戻ったとき、支援金の対象とならない年収300万円以上の中間層が大増税になることです。課税最低限を119万円程度から178万円を目指して引き上げ、5万円程度の住民税減税を恒久的に行うことが法案の骨子です。「178万円の壁」の引き上げの時限措置の解消もセットで盛り込みました。財源は合計約4.6兆円分を具体的に示しています。" },
        { side: "left", speaker: "記者", text: "国民民主党案を与党が受け入れる可能性と見通しをどう見ていますか。（Japan In-depth）" },
        { side: "right", speaker: "玉木雄一郎", text: "飲んでいただきたいですね。政府案は、給付付き税額控除を目指して作ったのに「税額控除なき給付」、単なる低所得者向け給付措置になっています。総理も代表質問で「諦めていません」とおっしゃった。根こそぎ変えろと言っているのではなく、明らかに欠けている部分を補う法案ですから、政調会長同士か税調会長同士か、真摯に協議に臨みたいと思います。" },
        { side: "left", speaker: "記者", text: "「178万円の壁」の引き上げが2年の時限措置で、所得制限も残っている点は、年末の税制改正でどう扱ってほしいのですか。（フリーランス）" },
        { side: "right", speaker: "玉木雄一郎", text: "残った宿題を解消する所得税法の改正も、この法案の中に入れています。年末の交渉では住民税が中心になりますが、所得税の減税も忘れていません。時限措置の延長に加え、基本的には所得に関わらない控除制度にしていくことをきちんと書きました。住民税と所得税を合わせて「個人課税の減税」として提案しています。" },
        { side: "left", speaker: "記者", text: "合わせて示された「早期に講ずべき物価上昇対策」の狙いを説明してください。（NHK）" },
        { side: "right", speaker: "玉木雄一郎", text: "政府の減税と給付は来年4月からで、それまで何もないことが問題です。課税所得のある方には、昨年の控除引き上げで今年の年末調整で1人3万円から6万円が戻りますが、所得の低い方には年内・年度内に何もありません。9月で切れた電気代・ガス代の支援、灯油の支援、そして給付の前倒しを、予備費の活用や必要に応じた補正予算で今年度から行うべきだと、法案とは別に予算措置として提案しています。" },
        { side: "left", speaker: "記者", text: "食料品だけの消費税減税には、外食や農家の懸念が訴えられています。今回の対案は、その懸念を見込んだ上でのものですか。（日経新聞）" },
        { side: "right", speaker: "玉木雄一郎", text: "消費税を減税するなら一律減税が今でもベストで、食料品だけ下げるのは「筋が悪い」と言わざるを得ません。インボイスも要らなくなります。ただ、総理のこだわりで変えられないということであれば、弊害を最小にするしかない。最大の弊害は、2年後に大増税になる中間層が放ったらかしになっていることです。我々の控除額引き上げによる減税は、民間の皆さんに追加負担がありません。" },
        { side: "left", speaker: "記者", text: "住民税減税が受け入れられれば政府案に賛成する可能性もあるのですか。逆に、それが入らなければ他の譲歩があっても賛成は難しいのでしょうか。（時事通信社）" },
        { side: "right", speaker: "玉木雄一郎", text: "2年後の中間層増税をいかに避けられるかということと、本来目指していた給付付き税額控除の姿にすること。これをやっていただくことが、賛成の必要条件だと思います。農家や外食への対応は、いずれにせよ対応しなければいけない課題です。" },
        { side: "left", speaker: "記者", text: "IMFの見通しでは日本の経済規模が順位を下げていきます。経済規模の目標を立てて取り組むべきではないですか。（FACTA）" },
        { side: "right", speaker: "玉木雄一郎", text: "国民民主党に経済政策を任せていただければ、もう一度日本を第3位まで戻します。日本の問題は潜在成長率の低さですし、時価総額100兆円企業が1社もないことも課題です。総理の掲げる370兆円の投資も、官民比率や分野ごとの内訳がまだ決まっていません。お金を積むだけでは投資は増えません。規制緩和やインフラ整備まで含め、経済が花開く環境を作ることが必要です。" }
      ],
      memo: "この会見は国会質疑ではなく、党の対案の発表の場。玉木代表の説明は、政府案の「空白」——支援金の対象と金額が分からないこと、2年後に支援が切れる中間層への手当てがないこと——を突く構成だった。財源も4.6兆円分を項目ごとに示したが、いずれも党の見積もりであり、与党が受け入れるかはこれからの協議次第。政府案への賛否の条件を「住民税減税が入ること」と明言した点が、この日のいちばんのニュース。"
    }] },

        { side: "right", speaker: "片山財務大臣", text: "所得上限額を350万円と仮定した場合、上限に近い所得の方は逓減により支援額が少額となり、消費税率引き下げの効果を上回る支援にはならない、というのが計算上の姿です。なお、税率をもとに戻すことをもって負担増になるという考え方はとっておりません。" },

        { side: "right", speaker: "岡本内閣審議官", text: "消費税率引き下げの効果は、単純に割ると1人当たり3.6万円です。支援額については、純負担率の国際比較で夫婦と子ども2人の世帯に最大27万円の差があることを一つの参考として検討しており、対象の方の手取りが所得に応じて増えるようになる、という方針で説明しております。" },
        { side: "left", speaker: "田中けん", text: "「手取りが増えるようにしていく」と「手取りが増えます」は違います。2年間は6000億円と決まっていますが、恒久財源が1000億円しか集まらなければ、支援は縮小し、手取りは増えないのではありませんか。" },
        { side: "right", speaker: "片山財務大臣", text: "令和11年度以降の具体的な支給要件が、令和10年度までのものと全く同一になると現時点で決めているものではありません。恒久財源の確保状況や支給実績などを踏まえて検討することになります。" },
        { side: "left", speaker: "田中けん", text: "所得に応じて給付する以上、一人一人の所得を公平かつ正確に把握することが大前提です。この支援金は給与所得だけでなく、事業所得や業務に係る雑所得も含めて所得を把握し、その全体に応じて支援額を決める、という理解でよろしいですか。" },
        { side: "right", speaker: "岡本内閣審議官", text: "そのとおりです。所得下限額の判定には給与等の収入金額のほか事業所得と業務に係る雑所得を、所得上限額にはこれらを含む合計所得金額を充てることとしております。個人事業者やフリーランスの方も対象としております。" },
        { side: "left", speaker: "田中けん", text: "確定申告をしていない人の事業所得は、どうやって把握するのですか。所得の捕捉の違いによって、正確に把握されている人ほど給付が少なくなるという不公平が起きないことを、どう担保するのですか。" },
        { side: "right", speaker: "岡本内閣審議官", text: "非課税者で事業所得等がある方にはe-Taxによる確定申告を想定しており、申告をしていない場合は、請求の際に必要な所得情報を市町村へ提出していただきます。適切な所得の把握を進めるためのさらなる取組は大綱でも検討するとされており、これを踏まえて対応してまいります。（※捕捉の違いによる不公平が起きない具体的な担保は、この日は示されなかった）" },
        { side: "left", speaker: "田中けん", text: "全国一律の制度なのに、認定も支給も支払いも市町村任せです。所得や税、社会保険料といった複雑な情報を扱う給付を、なぜ最初から国が直接実施する仕組みとして検討しなかったのですか。" },
        { side: "right", speaker: "片山財務大臣", text: "国が直接給付する場合、全国民の情報を保有するためのシステムや組織体制が必要となり、実現にかなりの期間がかかります。国と地方の協議を4回重ね、法定受託事務として市町村にお願いすることにしました。事務負担の軽減策は、国として漏れなく講じてまいります。" }
      ],
      memo: "政府の説明で固まったのは、「事業所得・雑所得も含めて同じ物差しで測る」「フリーランスも対象」という所得の測り方の一部だけ。肝心の金額・上限・財源はすべて「検討中」で、「手取りが増える」は試算に基づく保証ではなく方針の表明にとどまった。次は、理事会協議となったモデルケース試算の資料が実際に出てくるかと、法案審議で金額と上限が示されるかを追う。"
    }, {
      date: "2026年10月21日", committee: "衆議院・財務金融委員会",
      cats: ["money", "children"],
      title: "奨学金「480万円が646万円に」——金利3%時代の負担を若者と財政に問う",
      summary: "論点はIMF見通しでのGDP後退と成長力、賃上げの成果と実感のずれ、奨学金返還への金利上昇の影響、利払い費の見通し、個人向け国債のNISA対象化。NISA対象化の可否は示されず、国債の税制は令和9年度税制改正要望で「事項要望として検討中」との答弁だった。",
      noteUrl: "https://note.com/tamakitext/n/nfc9b868783cb",
      fullUrl: "full/2026-10-21-tanaka.html",
      bubbles: [
        { side: "left", speaker: "田中けん", text: "IMFの見通しでは、日本の名目GDPは2027年にインドとイギリスに抜かれ、世界6位に後退します。為替の影響は承知していますが、実質成長率も0.7%程度にとどまります。大臣はこの予測をどう受け止め、日本の成長力の構造的課題をどう見ていますか。" },
        { side: "right", speaker: "片山財務大臣", text: "2027年末の見通しは、日本4,467、イギリス4,489、インド4,521（10億ドル）で、逆転が生じます。内心忸怩たるものがあります。長年のデフレで国内投資やイノベーションが抑制され、潜在成長率が低迷してきたのは事実です。国内投資を徹底的にてこ入れし、成長型経済への移行を確実にしたいと考えます。" },
        { side: "left", speaker: "田中けん", text: "春闘で5%の賃上げと言っても、恩恵は働く人全員には届かず、中小企業や地方では上げたくても上げられません。給料が上がっても、物価や税・社会保険料の負担が増えれば手取りは増えません。成長の成果が国民の豊かさの実感にどうつながっていると評価しますか。" },
        { side: "right", speaker: "片山財務大臣", text: "実質1%・名目3%を上回る成長の定着を目指し、令和11年度まで実質賃金の年1%程度の上昇を社会通念として定着させたい。実質賃金は足元で9か月連続プラスです。中小企業の稼ぐ力の強化や価格転嫁を進め、消費税と支援金の法案で中低所得者の負担も直接軽減します。" },
        { side: "left", speaker: "田中けん", text: "第二種奨学金は有利子です。大学4年間で平均480万円を借り、20年で返すと、金利0.5%では返還総額506万円ですが、3%では646万円になり、差は140万円です。金利上昇が若い世代の返還負担を重くすることに、政府として対応が必要ではありませんか。" },
        { side: "right", speaker: "片山財務大臣", text: "在学中は無利子で、返還利率は原則3%を上限とし、超えた分の利子は国が負担する措置を講じています。給付型奨学金の拡充、減額返還制度の拡充、企業による代理返還の促進も進めています。金利のある世界でも、意欲のある若者の進学が断念されることのないよう取り組みます。" },
        { side: "left", speaker: "田中けん", text: "9月28日の長期金利は3.085%と、今年度予算の想定金利3%を上回りました。今年度の国債利払い費は当初予算の範囲内に収まる見通しですか。また、補正予算の財源にも使われてきた国債費の不用額は、今後どう見込んでいますか。" },
        { side: "right", speaker: "片山財務大臣", text: "既発国債の利率は発行時に確定しており、足元の金利上昇が直ちに利払い費全体に反映されるものではありません。現時点で今年度の利払い費が不足する状況は見込んでおりません。不用額がどうなるかは、現時点では申し上げられる状況にはありません。" },
        { side: "left", speaker: "田中けん", text: "内閣府の試算（現状投影ケース）では、国の利払い費は2026年度の13兆円から2040年度には約38兆円と、3倍近くに膨らみます。利払い費の増加で政策に使える財源が狭まる懸念に、大臣はどう対応しますか。" },
        { side: "right", speaker: "片山財務大臣", text: "利払い費が増えれば政策的経費を圧迫し、財政の硬直化を招く恐れがあることは認識しています。成長率を高め、複数年でプライマリーバランスを管理・改善し、債務残高の対GDP比を安定的に引き下げます。成長実現ケースでは、利払いの押し上げを成長とPB黒字が上回り、対GDP比は安定的に低下します。" },
        { side: "left", speaker: "田中けん", text: "個人向け国債のNISA対象化と相続税の非課税化を提案しています。「高所得者優遇」との課題は、非課税枠に保有限度額を定めれば制度設計で対応できます。総理が掲げた「貯蓄から投資へ」との整合性と高所得者優遇という2つの課題について、大臣のお考えを聞かせてください。" },
        { side: "right", speaker: "片山財務大臣", text: "財務省と金融庁の連名で、令和9年度の税制改正要望に、国債の税制の検討を事項要望として出しています。具体的な内容は定めておりませんが、国民の皆様にとって一番ベストな方法を、与党内や関係各所と丁寧に議論して検討してまいります。" }
      ],
      memo: "この日の軸は「金利のある世界」の負担を誰が負うのか。田中が示した奨学金の試算（480万円→646万円）に対し、大臣は利率上限3%という既存の安全網を挙げて応じたが、新しい軽減策は出なかった。一方、利払い費38兆円という数字は政府自身の中長期試算（現状投影ケース）で、大臣も否定はしなかった。ただし大臣の答えは成長実現ケースを前提にした見通しで、田中は「最悪のケースも考えるべき」と釘を刺した。"
    }] },
  { id: "okano", cats: [{ id: "health", label: "医療・福祉", icon: "🏥", preview: "海外工場のトラブルで小児の便秘薬が供給制限に。政府は優先供給で「影響は最小限」、供給網の強靭化の具体策は示されず" }, { id: "children", label: "子ども・家族", icon: "👶", preview: "1歳から使える慢性便秘症の第一選択薬が供給制限に。子どもへの優先供給は取られたが、長期化すれば影響が広がる恐れ" }], name: "岡野純子", initial: "岡", dateLabel: "10/23", unread: 1, addedOn: "2026-10-26",
    preview: "海外工場のトラブルで小児の便秘薬が供給制限に。政府は「影響は最小限」、強靭化の具体策は示されず",
    articles: [{
      date: "2026年10月23日", committee: "衆議院・厚生労働委員会",
      title: "薬の供給は海外頼み、障害を理由に手術を断られる現実も",
      summary: "論点は2つ。医薬品の安定供給（モビコールの供給制限、薬機法改正、供給網の強靭化）と、障害を理由とする手術拒否。政府は「障害のみを理由に断ることは応召義務の正当な事由とは言えない」との見解を示した。",
      noteUrl: "https://note.com/tamakitext/n/n60d2d291becd",
      fullUrl: "full/2026-10-23-okano.html",
      bubbles: [
        { side: "left", speaker: "岡野純子", text: "慢性便秘症の薬モビコールが、英国の製造所の品質問題で供給が制限され、通常出荷の再開は来年6月が目処とされています。代替薬に切り替えても効果が得られない声があり、1歳から使える小児の治療では特に切り替えが困難です。患者や医療現場への影響をどう把握し、販売元のEAファーマにどう指導・要請を行いましたか。" },
        { side: "right", speaker: "安藤医薬産業振興審議官", text: "モビコールは学会ガイドラインで小児の慢性便秘症の第一選択薬とされる、医療現場で必要性の高い医薬品です。厚労省はEAファーマに医療機関・薬局への適切な情報提供を指導し、小児の患者さんへ優先的に供給されるよう協力を求めたほか、英国の規制当局にも早期の問題解決を働きかけました。現時点で影響は最小限に抑えられていますが、長引くと小児への供給にさらなる影響が生じる恐れがあります。" },
        { side: "left", speaker: "岡野純子", text: "昨年の薬機法改正で安定供給の制度が強化され、施行から間もなく1年です。限定出荷・供給停止は薬価削除予定品目を除き1366品目で、数字上は改善傾向にあります。法改正によって供給不安を早い段階で把握できた、供給不足そのものを回避できたといった具体的な変化はありましたか。運用を通じて明らかになった課題も伺います。" },
        { side: "right", speaker: "安藤医薬産業振興審議官", text: "従前は行政指導により求めていた供給不安や供給状況の報告が法律上の義務となり、確実に行われることで、代替薬の調整といった対策を講じやすくなりました。令和9年5月からは、製造販売業者に供給体制の管理責任者の設置や安定供給に向けた手順書の作成も義務づけられます。また供給確保医薬品を指定する仕組みが創設され、約1万6000品目の中から医療上の必要性が高いものに対策の優先順位をつけられるようになりました。" },
        { side: "left", speaker: "岡野純子", text: "医薬品の製造や原薬は海外に頼るところが大きく、今回も海外工場のトラブルが発端でした。国内の製造基盤の確保、製造拠点・調達先の複数化、必要な備蓄を組み合わせて、供給網の強靭化をさらに加速していくべきです。政府の認識と今後の方針を伺います。" },
        { side: "right", speaker: "安藤医薬産業振興審議官", text: "サプライチェーンの脆弱性については、厚生労働省としても強い問題意識を持っています。抗菌性物質製剤を経済安全保障推進法に基づく特定重要物資に指定し、国内での原薬製造体制の整備を進めるほか、原薬の調達先の複数化に取り組む企業を支援してきました。製剤の製造拠点と原薬の関係を調べる「マッピング」も含め、医療上の必要性が高い医薬品から順次サプライチェーン調査を実施し、潜在的なリスクの点検も進めています。（※岡野はこの後、政府全体で人員と予算を確保し「国家的な危機管理」として取り組むべきだと求めたが、直接の答弁はなかった）" },
        { side: "left", speaker: "岡野純子", text: "統合失調症のある知人が腰の病気で手術を必要とした際、一般病院で「うちの病院では障害のある方の対応ができません」と言われ、手術を受けることができませんでした。障害があることを理由に、個々の患者の状態を十分確認せずに予防的に手術を断るケースがあるのではないかと懸念します。厚労省はこの事態をどのように把握し、どう考えますか。" },
        { side: "right", speaker: "佐々木医政局長", text: "障害者差別解消法は、医療機関を含む事業者が障害を理由としてサービス等の提供を拒否することを禁止しており、このような事例は適切ではないものと考えております。医師法の応召義務についても、正当な事由に当たるかは個々の事情に即して判断する必要がありますが、一般的には、障害があることのみを理由として診療を拒否することは、正当な事由があるものとは言えないと考えております。" },
        { side: "left", speaker: "岡野純子", text: "対応できないと判断した場合も、医学的な理由なのか、設備や人員の問題なのか、具体的な理由を患者本人に伝えることが重要です。医療計画の指針が示す、精神・身体双方に対応できる医療機関の整備や連携体制について伺います。状態が安定している方の予定手術も対象として想定されていますか。対応できる医療機関の明確化や連携はどこまで進んでいますか。" },
        { side: "right", speaker: "水谷障害保健福祉部長", text: "指針において身体合併症への対応を求めており、本年6月には指針の見直しを行い、地域における協議の場で議論することも求めました。身体合併症には、手術を要するような急性疾患から慢性疾患まで含まれますので、精神疾患が比較的安定している患者さんが身体疾患の予定手術を受ける場合も対象に含まれると考えてございます。改正医療法で精神医療が地域医療構想に位置づけられ、本年9月からワーキンググループで病床機能の在り方も含めて議論が行われています。" }
      ],
      memo: "モビコール問題で政府は「小児への優先供給で影響は最小限」としたが、通常出荷の再開は来年6月の目処で、政府自身が「長引けば小児への影響が広がる恐れ」を認めた。手術拒否の問題では「障害のみを理由に断ることは正当な事由とは言えない」との見解と、予定手術も指針の対象に含まれるとの答弁を引き出したのが収穫。次は、対応できる医療機関の明確化が実際に進むかと、モビコールの供給再開の見通しを追う。"
    }] },
  { id: "hino", cats: [{ id: "health", label: "医療・福祉", icon: "🏥", preview: "傷病手当金は5年で約1.6倍に増加。発達障害と障害年金の取扱いは「一律同一疾病ではない」と政府が説明" }, { id: "children", label: "子ども・家族", icon: "👶", preview: "子どもの発達障害の受診が、将来の障害年金の落とし穴に？ 親の不安に大臣は「受診を控える事態は望ましくない」" }], name: "日野さりあ", initial: "日", dateLabel: "10/23", unread: 0,

      bubbles: [
        { side: "left",  speaker: "日野さりあ", text: "消費税は社会保障を支える重要な財源です。減税の穴埋めで医療や介護、子育て支援が削られないよう、「社会保障の財源に手を付けない」と総理に申し入れていただけますか。" },
        { side: "right", speaker: "上野厚生労働大臣", text: "財源は租税特別措置や補助金の見直しなど、歳出歳入全般の見直しで確保されるものと承知しています。社会保障財源に穴が開くことにはならない、という認識です。" },
        { side: "left",  speaker: "日野さりあ", text: "傷病手当金の支給額は2018年度の約3,800億円から2023年度には約6,100億円へ、5年で約1.6倍に増えました。精神疾患の総患者数は微減しているのに、なぜですか。（※金額・倍率は日野議員が質問で提示した数字）" },
        { side: "right", speaker: "宮崎保険局長", text: "要因は労働環境や受診行動の変化、高齢化、賃上げなど複合的で、一概にはお答えできません。協会けんぽでは精神・行動の障害が支給額の41％を占め、この間の伸びは約2.0倍です。" },
        { side: "left",  speaker: "日野さりあ", text: "「誰でも傷病手当金を受給できる」と誤認させる申請支援ビジネスについて、保険者や医師、経営者から具体的な事例が私たちに寄せられています。厚労省に寄せられた声に、どう対応してきましたか。" },
        { side: "right", speaker: "上野厚生労働大臣", text: "業者の存在は承知していますが、個別の詳細な事例の報告は届いていない状況です。保険者へのヒアリングで実態把握を進め、必要に応じて対応を検討します。" },
        { side: "left",  speaker: "日野さりあ", text: "福祉避難所の情報が自治体のホームページの避難所一覧に載っていないという声があります。ガイドラインに沿った指定福祉避難所は全ての市町村に準備されているのですか。妊婦への周知はどうしていますか。" },
        { side: "right", speaker: "西田内閣副大臣", text: "令和7年10月現在、福祉避難所は全国26,784か所、1,740市町村のうち1,671市町村に設置されています。好事例を年2回の全国会議で横展開し、周知に努めます。" },
        { side: "left",  speaker: "日野さりあ", text: "子どもの頃の発達障害の受診が初診日になると、将来うつ病を発症しても障害厚生年金の対象外になることがあると聞きます。なぜ発達障害とうつ病を同一疾病として扱うのですか。医学的根拠でしょうか。" },
        { side: "right", speaker: "伊澤大臣官房年金管理審議官", text: "疑義照会は、発達障害とうつ病を一律に同一疾病として取り扱うと示したものではありません。発症が発達障害に起因するかは、経過や症状、就労状況などから個々の事案ごとに医学的に総合判断しています。" },
        { side: "left",  speaker: "日野さりあ", text: "その取扱いのせいで、必要な早期受診をためらう保護者が出ています。初診日や同一疾病の取扱いを見直すのか、別の救済措置を検討するのか、受診をためらわずに済む具体的な対応策を示してください。" },
        { side: "right", speaker: "上野厚生労働大臣", text: "早期受診を控える事態は望ましくありません。早期支援の重要性の周知に取り組み、疑義照会についても誤解が生じないよう、どういった対応ができるか考えていきたいと思います。" }
      ],
      memo: "この日決まったことはほぼなし。「一律同一疾病ではない」と政府が公式に説明したのが最大の収穫だが、見直しや救済の具体策、総理への申し入れ、介護の基本報酬引上げ率はすべて示されなかった。次は疑義照会への対応方針と、令和9年度介護報酬改定の審議会論議を追う。"
    }] },
  { id: "ido", cats: [{ id: "children", label: "子ども・家族", icon: "👶", preview: "韓国の保護出産をめぐる調査では、登録されなかった子249人の死亡が判明。「まず登録を」と迫るが、政府は戸籍の趣旨を理由に慎重姿勢" }, { id: "justice", label: "法務・人権", icon: "⚖️", preview: "「売春は違法」と大臣が明言し、法案は「速やかに提出」。一方、本籍の見直しは「意義を失っていない」と政府、本籍なき登録には局長が否定的" }], name: "井戸まさえ", initial: "井", dateLabel: "10/23", unread: 1, addedOn: "2026-10-26",
    preview: "韓国の保護出産を引き合いに戸籍の壁を問う。本籍は「意義を失っていない」、法整備の時期も示されず",
    articles: [{
      date: "2026年10月23日", committee: "衆議院・法務委員会",
      title: "「まず登録を」——韓国の保護出産から戸籍と本籍の壁を問う",
      summary: "論点は2つ。売買春の法整備（時期と法律の名称）と、戸籍・本籍・無戸籍問題。大臣は「売春は違法」と明言し法案は「速やかに提出」としたが時期は示されず、本籍の見直しには「意義を失っていない」と答えた。",
      noteUrl: "https://note.com/tamakitext/n/n92fae38704c2",
      fullUrl: "full/2026-10-23-ido.html",
      bubbles: [
        { side: "left", speaker: "井戸まさえ", text: "現行の売春防止法は売春を禁止していますが、行為自体を一律に処罰する仕組みにはなっていません。まず、売春は違法であることを確認させてください。その上で、法整備の具体的なプロセスとタイムスケジュールをお示しください。" },
        { side: "right", speaker: "山下法務大臣", text: "売春は違法ということでございます。検討会の取りまとめを踏まえ、買う側による勧誘等に関する処罰規定など、具体的な内容の検討を進めているところです。法案提出の時期は今はお話しできませんが、できるだけ速やかに国会に提出するようにしていきたいと思います。" },
        { side: "left", speaker: "井戸まさえ", text: "「売春防止法」という名称は、売る側だけに焦点を当て、買う側の存在を見えなくしてしまっています。買う側の関与も規制していく方針が示された以上、「売買春防止法」に改めるべきだと考えますが、大臣の御所見を伺います。" },
        { side: "right", speaker: "山下法務大臣", text: "名称を改めた場合、売春をする者の保護支援の視点がかえってぼやけてしまうのではないかと、慎重に検討すべきだという見解もあります。こうした検討会の議論も踏まえて、必要な法整備について検討を進めていきたいと考えております。（※名称変更への賛否自体は、この日示されなかった）" },
        { side: "left", speaker: "井戸まさえ", text: "韓国では、病院が付けた臨時番号のまま出生届が出されなかった子が2236人と判明し、うち249人の死亡が確認されました。2024年7月には出生通知制度と保護出産（内密出産）が同時施行されました。番号や仮名でまず登録できるデジタル化こそ、制度の狭間に落ちる子どもを救う鍵です。" },
        { side: "right", speaker: "山下法務大臣", text: "デジタル化の進展に向けて適切な技術を取り入れることは重要と認識しております。一方で、親族的身分関係を公証するという戸籍の趣旨もしっかり確保しなければなりません。制度の趣旨を没却しない範囲で、戸籍のデジタル化を進めていきたいと考えております。" },
        { side: "left", speaker: "井戸まさえ", text: "本籍とは何でしょうか。マイナンバー時代に本籍は本当に必要なのか。これは私の問いではなく、法務省の戸籍制度に関する研究会自身が立てた問いです。紙の時代は市町村に置く必要がありましたが、今も本籍を市町村に定める必要があるのでしょうか。" },
        { side: "right", speaker: "松井民事局長", text: "本籍は、戸籍の編成基準である一定の場所であって、戸籍の所在する市町村を明らかにするとともに、特定の戸籍を他の戸籍と区別して表示するために用いられてきたものであり、重要な意義・役割を有するものと考えております。" },
        { side: "left", speaker: "井戸まさえ", text: "本籍はある日突然消えることがあります。サハリンでは日本領でなくなった瞬間に本籍がなくなり、本籍を持っていた方々は無戸籍になりました。災害で紙の戸籍が流されることもあります。生活と関わりのない場所に置かれた本籍に、今どのような実質的な意味があるのでしょうか。" },
        { side: "right", speaker: "山下法務大臣", text: "本籍地の市町村が戸籍事務を担うという管轄の基準でもあり、本籍には戸籍やそこに記載された個人を特定する機能も有しております。本籍を基準とすることは、いまだ意義を失っていないのではないかと考えております。" },
        { side: "left", speaker: "井戸まさえ", text: "無戸籍の子どもたちにとって、まずは登録することが何よりも大事な第一歩です。父未定であることに注記をつけて登録し、これから必要になる裁判手続きを一人一人に通知することも、デジタル化すれば可能になるのではないでしょうか。" },
        { side: "right", speaker: "松井民事局長", text: "嫡出推定が重なる場合でも法律上の父は定まっており、内密出産の場合とは異なると考えています。それにもかかわらず父未定という戸籍を作成することは、戸籍制度の機能に照らして困難であると考えております。" }
      ],
      memo: "この日の収穫は、大臣が「売春は違法」と明言し、法案提出に前向きな姿勢を示したこと。一方で本籍をめぐっては、政府は「意義を失っていない」の一点張りで、法務省の研究会が投げかけた「マイナンバー時代に本籍は必要か」という問いへの答えは示されなかった。「父未定」の注記付き登録にも局長は否定的で、韓国式の出生通知・保護出産を導入するかどうかに政府は一切触れなかった。次は売買春の法案がいつ国会に出てくるかを追う。"
    }] },
  { id: "asano", cats: [{ id: "work", label: "働き方", icon: "💼", preview: "裁量労働制の拡大、政府の根拠は「時間が著しく長くはならない」「約8割が満足」。浅野は「生産性・成果で評価すべき」と評価軸の追加を求めた" }, { id: "health", label: "医療・福祉", icon: "🏥", preview: "企業立病院への税制上の措置、大臣は「医療法の考え方から難しい」。地域医療を担う病院への支援は「応援できる部分は応援したい」" }], name: "浅野さとし", initial: "浅", dateLabel: "10/23", unread: 1, addedOn: "2026-10-26",
    preview: "裁量労働制は「時間」でなく「成果」で測れ。政府の根拠データは労働時間と満足度が中心、生産性・創造性の検証はこれから",
    articles: [{
      date: "2026年10月23日", committee: "衆議院・厚生労働委員会",
      title: "裁量労働制は「時間」でなく「成果」で測れ——拡大議論の根拠を問う",
      summary: "論点は3つ。技能五輪全国大会の開催転換／裁量労働制の拡大を検討する根拠データと評価軸／企業立病院への税制措置。拡大の是非は労政審で議論中で、生産性・創造性の検証はこれから。税制措置は「難しい」と答弁された。",
      noteUrl: "https://note.com/tamakitext/n/n722781340e59",
      fullUrl: "full/2026-10-23-asano.html",
      bubbles: [
        { side: "left", speaker: "浅野さとし", text: "2028年度の技能五輪全国大会は、当初は国際大会の愛知開催に伴い見送る予定でしたが、開催すると発表されました。一度は見送りと公表されたものが、なぜ開催する判断に変わったのですか。どのような意見が寄せられ、どのような検討を経たのか、お答えください。" },
        { side: "right", speaker: "青山人材開発統括官", text: "競技関係者のご負担を考慮して見送ることとしておりましたが、開催を希望するご意見が寄せられ、国会でのご議論や超党派議員連盟の決議も踏まえ、競技関係者に改めて書面調査を実施いたしました。開催を希望する職種が多数だったことなどから、本年8月、2028年度技能五輪全国大会を2029年2月に開催することといたしました。" },
        { side: "left", speaker: "浅野さとし", text: "2028年の技能五輪国際大会は21年ぶりに愛知県で開かれます。全国大会は国際大会の代表選手の選考も兼ねています。愛知大会の成功に向けて、全国大会をどのように位置づけ、選手の裾野の拡大や技能尊重の機運づくりにつなげていくのか、大臣の認識を伺います。" },
        { side: "right", speaker: "上野厚生労働大臣", text: "技能五輪国際大会は、我が国の優れた技能を伝える絶好の機会です。全国大会は国際大会の選手選考を兼ねており、青年技能者の水準向上や選手の裾野の拡大を図る上で大変重要です。全世代型リスキリング国民運動による周知広報や教材による職業技能教育の促進などを通じて、技能の魅力を伝え、技能を尊重する機運の醸成に取り組んでまいります。" },
        { side: "left", speaker: "浅野さとし", text: "過労死に関する労災請求・支給決定件数が過去最多を記録するなど、過労死等ゼロにはまだ道のりがあります。労働時間規制を見直すのであれば、その根拠となるデータが示されるべきです。裁量労働制の拡大を検討する根拠として、これまでどのようなデータが示されてきたのですか。" },
        { side: "right", speaker: "岸本労働基準局長", text: "令和元年に実施した裁量労働制実態調査によりますと、1日の平均実労働時間数は適用労働者の方が非適用労働者よりも若干長い一方、専門型・企画型ともに約8割が制度の適用に満足していると回答しております。また調査結果を回帰分析したところ、制度の適用によって労働時間が著しく長くなるとは言えない、処遇が低くなるとは言えない、健康状態が悪化するとは言えないこと等が明らかになっております。" },
        { side: "left", speaker: "浅野さとし", text: "労働時間が長めでも満足していることを、裁量労働制を肯定する理由にしてはいけません。裁量労働制の本質は、本人が仕事の内容や進め方を自分で決められることです。ですから評価の軸は労働時間ではなく、本人の生産性や成果であるべきです。政府の分析は十分なのでしょうか。" },
        { side: "right", speaker: "岸本労働基準局長", text: "裁量労働制の本質については、ご指摘のとおりであると思います。働く本人に裁量を与えて仕事の進め方を任せ、その代わりに成果を重視した評価を行う、そのことで労使双方にメリットがある形で運用される場合に、制度の意義は最大限に発揮されます。一方で、長時間労働の助長や、時間外労働手当の節約手段として使われる例があるのではないかといった懸念も従来から寄せられており、そうした点も調査をしてきたものでございます。" },
        { side: "left", speaker: "浅野さとし", text: "適用範囲を拡大すべきかどうかを議論するには、創造性や生産性を高める効果が出ているかどうかのデータが必要です。今年度行われている実態調査では、労働時間の観点だけでなく、生産性・創造性の観点と、本当に自己裁量のもとで働けているかどうかを評価軸に入れていただきたい。" },
        { side: "right", speaker: "岸本労働基準局長", text: "裁量労働制の実態調査については、改めて今年度調査を今行っているところでございまして、その結果がまとまりましたら、関係の審議会にもご提出をし、議論の材料にしていただきたいと考えております。なお意識の面では、裁量が与えられることでメリハリのある仕事ができる、ワークライフバランスが確保できるといった項目で、適用者の方が非適用の方よりも高い率で回答しているというデータもございます。" },
        { side: "left", speaker: "浅野さとし", text: "過労死や労災申請件数が過去最高を更新し続けている今、裁量労働制の議論を進めるのであれば、上限規制の検証や勤務間インターバル制度の導入など、働き方改革の一層の強化と同時に進めるべきではないですか。大臣のお考えを伺います。" },
        { side: "right", speaker: "上野厚生労働大臣", text: "働くことで命を落としたり健康を損なうということはあってはならないと考えております。裁量労働制の対象のあり方については、健康確保、長時間労働防止、適切な処遇確保などの乱用防止措置を前提に見直しの検討を行うこととされております。同時に、連続勤務規制や勤務間インターバル制度の法的な位置づけ、いわゆる「つながらない権利」のあり方などについても検討を進めることとされており、現在、労政審において労使の皆様のご意見を十分にお伺いしながら議論を進めているところでございます。" },
        { side: "left", speaker: "浅野さとし", text: "企業立病院は、公立病院と同じ救急・周産期・小児などの政策医療を担いながら、法人税や事業税、固定資産税などが全て課税されています。誰が担っているかではなく、どのような医療を担っているかに着目し、政策医療の実績に応じて、企業立病院にも税制上の措置や継続的な財政支援が及ぶ仕組みを検討すべきではないでしょうか。" },
        { side: "right", speaker: "上野厚生労働大臣", text: "医療法の下では、医療機関の開設者は営利を目的とする法人でないことが求められております。企業立病院は、地域の医療機関が不足していた時代背景の下で、主として従業員の福利厚生のために設置されたものに限って認めてきた経緯があり、昭和41年を最後に設立されておりません。こうした考え方に照らせば、株式会社などの営利法人に対して新たに税制措置を設けるというのは、なかなか難しいと考えております。もっとも、地域医療を守る観点から、そうした病院の役割は重要だと認識しておりますので、応援ができる部分があれば応援をしていきたいと考えております。" }
      ],
      memo: "この日の収穫は2つ。技能五輪全国大会の開催転換の経緯が明確になったことと、裁量労働制の議論で労働基準局長が「本質は指摘のとおり」と認め、評価の軸をめぐる論点が残ったこと。肝心の拡大の是非は労政審に委ねられたままで、今年度の実態調査に生産性・創造性の評価軸が入るかどうかが焦点になる。次は今年度の実態調査の結果と労政審の議論を追う。"
    }] },
  { id: "usuki", cats: [{ id: "infra", label: "交通・インフラ", icon: "🚃", preview: "鉄道貨物の目標は2030年度に221億トンキロ。北海道の黄線区の行方は、令和8年度末の改善方策と新たな協議の場に委ねられた" }], name: "臼木ひでたけ", initial: "臼", dateLabel: "10/23", unread: 1, addedOn: "2026-10-26",
    preview: "北海道の黄線区から船員教育まで。大臣は「令和8年度末までに改善方策」と答えたが、財政の抜本見直しは示されず",
    articles: [{
      date: "2026年10月23日", committee: "衆議院・国土交通委員会",
      title: "黄線区の先行きは令和8年度末の改善方策に——暮らしのライフラインを問う",
      summary: "論点は公共交通のグランドデザイン、鉄道貨物のモーダルシフト、北海道のJR黄線区、二種免許ドライバー、建築確認の長期化、船員養成。黄線区は「令和8年度末までに改善方策を取りまとめ」という期限と協議の場が示された。",
      noteUrl: "https://note.com/tamakitext/n/n63f60dc9833b",
      fullUrl: "full/2026-10-23-usuki.html",
      bubbles: [
        { side: "left", speaker: "臼木ひでたけ", text: "インフラの大規模更新が必要な今こそ、公共交通のグランドデザインを中長期の視点で考え直すべきです。鉄道の大量輸送・定時性など、交通モードごとの特性や長所を発揮できるリデザインが必要ではないですか。" },
        { side: "right", speaker: "井林国土交通大臣", text: "交通政策基本法第5条では、交通はそれぞれの特性に応じて適切に役割分担し、連携することを旨とされています。本年1月に取りまとめた交通政策基本計画のもと、モードごとの特性を考慮しつつ、中長期的な観点からも適切に取り組んでまいりたいと考えております。" },
        { side: "left", speaker: "臼木ひでたけ", text: "鉄道貨物の目標は2030年度に221億トンキロですが、前大綱の目標209億トンキロに対し、2024年の実績は164億トンキロまで減っています。モーダルシフトを確実に進めるため、政府として制度改正や政策誘導が必要ではないですか。" },
        { side: "right", speaker: "井林国土交通大臣", text: "貨物鉄道の輸送量はここ数年おおむね横ばいであり、輸送力の増強や災害対応、荷主が利用しやすい環境整備が課題です。大型コンテナの導入やコンテナホームの拡幅、貨物駅の施設整備を支援し、JR貨物の増発や荷主への働きかけも後押しして、目標達成に全力で取り組みます。" },
        { side: "left", speaker: "臼木ひでたけ", text: "網走・北見から札幌まで約350キロ。北海道の農産品は、重くて単価が安く距離の長い輸送で、鉄道以外では代替が効きません。黄線区を含む鉄路について、防衛関係予算の鉄道維持への活用など、既存の枠組みにとらわれない分野横断的な制度・財政の見直しが必要です。" },
        { side: "right", speaker: "井林国土交通大臣", text: "JR北海道の黄線区については、令和8年度末までに抜本的な改善方策を取りまとめるよう監督命令で求めています。今月からはJR北海道と沿線自治体との協議の場を、国や北海道も関与する形で立ち上げました。まずはこの場で関係者の合意形成に取り組みます。（※防衛関係予算の活用など他省庁に関わる点は、「関係省庁ともしっかり連携しながら取り組む」と述べるにとどまった）" },
        { side: "left", speaker: "臼木ひでたけ", text: "普通二種免許は、旅客の生命・身体の安全を預かるプロのドライバーであることを確認する制度です。タクシーの人手不足対策は急務ですが、利便性や効率性を重視しすぎて安全基準を後退させることのないよう、二種免許を持つドライバーの育成・雇用促進を進めるべきです。" },
        { side: "right", speaker: "井林国土交通大臣", text: "バス・タクシーの運転士不足は極めて喫緊の課題です。二種免許の取得費用の支援、運賃改定手続の迅速化による賃上げの促進、配車アプリ導入やキャッシュレス化への支援などを進めています。安全基準を後退させることなく、あらゆる政策ツールを総動員して取り組みます。" },
        { side: "left", speaker: "臼木ひでたけ", text: "建築物省エネ法の改正後、建築確認や省エネ適判の審査に手戻りが増え、長期化していると現場から聞いています。実態を引き続き把握し、審査が長期化している審査機関への重点的な支援や手続の改善につなげるべきではないですか。" },
        { side: "right", speaker: "井林国土交通大臣", text: "施行から約1年半の時点で改めて実態調査を行い、一定の改善は見られるものの、一部の民間の審査機関では審査日数が長い実態を把握しています。AIを活用した申請図書の事前チェックや審査補助ツールの開発支援などで、円滑化に向けた対策を講じてまいります。" },
        { side: "left", speaker: "臼木ひでたけ", text: "船を作っても、働く人がいなければ意味がありません。船員養成の中核である海技教育機構は、設備の老朽化や教員への対応不足が指摘されています。安定的な船員養成のため、運営交付金などの予算をしっかり確保すべきです。" },
        { side: "right", speaker: "井林国土交通大臣", text: "海技教育機構を取り巻く環境は厳しさを増していると認識しております。令和9年度概算要求において、教員や乗組員の人件費、老朽化した学校施設や練習船の修繕費、訓練に必要な船舶燃料費などを要求しているところであり、必要な予算の確保に努めてまいります。" }
      ],
      memo: "黄線区については「令和8年度末までに改善方策」という期限と、新たな協議の場が示されたのがこの日の具体的な前進。ただ、それは存続・廃止の結論ではなく、財政の負担のあり方も協議行きである。鉄道貨物の目標と現状の開き、防衛予算の活用といった踏み込んだ提案には、大臣は既存の支援策の説明と「関係省庁と連携」で答えるにとどまった。次は協議の場で黄線区の費用負担がどう議論されるかを追う。"
    }] },
  { id: "iizumi", cats: [{ id: "justice", label: "法務・人権", icon: "⚖️", preview: "再犯時に無職だった人は72.2%。保護司は過去最少の4万5033人、拘禁刑のもとで再犯防止の実効性を問う" }, { id: "work", label: "働き方", icon: "💼", preview: "協力雇用主は約2万5000社が登録するも、実際に雇用しているのは約800社。出所者の就労をどう広げるかは示されず" }, { id: "defense", label: "防衛", icon: "🛡️", preview: "欧州3か国の国防規定と兵役制度を現地で調査。「徴兵」への言及は各国の制度説明の報告で、日本への導入提案ではない" }], name: "飯泉嘉門", initial: "飯", dateLabel: "10/23", unread: 2, addedOn: "2026-10-26",
    preview: "再犯時に無職だった人は72.2%。協力雇用主は約2万5000社登録も、実際に雇用しているのは約800社",
    articles: [{
      date: "2026年10月23日", committee: "衆議院・法務委員会",
      cats: ["justice", "work"],
      title: "再犯した人の7割が無職だった——拘禁刑と再犯防止の実効性を問う",
      summary: "論点は拘禁刑の趣旨、保護司のなり手不足と安全対策、出所者の就労支援、刑務作業を通じた技能維持。協力雇用主の実雇用を増やす具体策や数値目標は示されなかった。",
      noteUrl: "https://note.com/tamakitext/n/n5c6c84eff0de",
      fullUrl: "full/2026-10-23-iizumi.html",
      bubbles: [
        { side: "left", speaker: "飯泉嘉門", text: "「罪を憎んで人を憎まず」。出所した人が再犯をしないためには、社会から孤立させず、責任ある社会人として地域に復帰してもらうことが重要です。昨年6月に施行された拘禁刑への一本化、この明治以来の大改革の趣旨・目的を教えてください。" },
        { side: "right", speaker: "佐藤刑事局長", text: "令和4年の刑法等の一部改正により、懲役及び禁錮が廃止されて拘禁刑が創設されました。刑法犯の検挙人員のうち約5割を再犯者が占めていた状況を踏まえ、個々の受刑者の特性に応じた処遇をきめ細やかに行うことを可能にして、より一層の改善更生・再犯防止を図るためです。" },
        { side: "left", speaker: "飯泉嘉門", text: "更生保護の第一線を担う保護司は、今何人ですか。その数は統計開始以来の過去最少で、令和6年5月には大津市で保護観察中の男が担当保護司を殺害する事件も起きました。なり手不足への対策をお聞かせください。" },
        { side: "right", speaker: "滝田保護局長", text: "保護司は令和8年1月1日現在、全国で4万5033人となっており、減少傾向が続いています。本年12月1日施行の改正保護司法には、適任者確保や安全確保のための施策についての国の責務が明記されました。自宅以外の面接場所の確保（公的施設7793箇所）や、1人の対象者を複数の保護司で担当する複数指名制などに取り組んでいます。" },
        { side: "left", speaker: "飯泉嘉門", text: "再犯の要因で一番大きいのは経済苦だと言われてきました。昨今の状況はどのようになっていますか。" },
        { side: "right", speaker: "滝田保護局長", text: "経済的な困窮は再犯に結びつき得る重要な要因の一つであると認識しております。参考になる統計として、令和7年において刑務所に再び入所した者のうち72.2%が、再犯時に無職であったというものがあります。就労を確保できなかったことが再犯の大きな原因になっていると考えられます。" },
        { side: "left", speaker: "飯泉嘉門", text: "民間企業に雇用を求めるだけでなく、「隗より始めよ」で、国や地方公共団体が特別の枠を設けて率先して雇い、再犯防止と経済苦をカバーする。こうした点はいかがでしょうか。" },
        { side: "right", speaker: "滝田保護局長", text: "出所者等を承知の上で雇用する協力雇用主は約2万5000社が登録していますが、実際に雇用しているのは約800社にとどまります。地方公共団体では71団体が保護観察対象者等を雇用する取組を実施し、これまで延べ87名を雇用しました。マッチングや支援の充実で、実際の雇用につながるよう努めてまいります。" },
        { side: "left", speaker: "飯泉嘉門", text: "拘禁刑では刑務作業が義務ではなくなりました。手に職のある受刑者が、施設にいる間に技能やモチベーションを落とさないよう、特性や年齢に応じた対応はどのようになっていますか。" },
        { side: "right", speaker: "山本矯正局長", text: "一人ひとりの受刑者が有する全ての特殊な技能について、その維持に向けた処遇を個々に実施することは、実務上非常に困難です。もっとも、受刑者の技能や職歴等も勘案しながら処遇を実施しており、資格や職歴を生かした作業のほか、つがる塗りや藍染めなど伝統産業の人材養成の作業を通じて、技能の習得と意欲の維持を図っています。" },
        { side: "left", speaker: "飯泉嘉門", text: "拘禁刑の導入は明治以来のパラダイムシフトです。大臣の任期中に「これを成し遂げたのは山下大臣だ」と言われるよう、この大改革への決意表明をお願いします。" },
        { side: "right", speaker: "山下法務大臣", text: "新たな被害者を生まない安全で安心な社会を実現するために、再犯防止の取組は必要です。懲らしめではなく、拘禁刑を通じて更生してもらうことが非常に重要だと考えております。保護司の活動環境の改善や担い手の確保、協力雇用主についてもこの割合をもっと高めるということで、民間の皆さんとも連携しながら力強く政策を進めてまいります。" }
      ],
      memo: "この日明らかになったのは数字の重さだ。保護司は4万5033人で過去最少、協力雇用主は登録約2万5000社に対して実雇用は約800社、再入所者の72.2%は再犯時に無職だった。一方で、実雇用をどう増やすかの具体策や数値目標は示されず、受刑者の技能維持も「困難」との答弁で、大臣の言葉は決意の表明にとどまった。次は改正保護司法が12月に施行された後、保護司の数がどう動くかを追う。"
    }, {
      date: "2026年10月22日", committee: "衆議院・憲法審査会",
      cats: ["defense", "justice"],
      title: "欧州3か国の憲法と国民投票を調査——海外調査の報告と各党の受け止め",
      summary: "憲法審査会の調査団（自民・中道・維新・国民民主・チームみらいの7名）がスイス、ハンガリー、イタリアを訪問した海外調査の報告と、各党委員の意見表明。政府への質疑ではなく、この日に結論や合意はなし。「徴兵」への言及はすべて各国の制度説明の報告で、日本への導入提案ではない。",
      noteUrl: "https://note.com/tamakitext/n/nf18e5c63411c",
      fullUrl: "full/2026-10-22-iizumi.html",
      bubbles: [
        { side: "left", speaker: "古屋圭司団長", text: "調査団は9月2日から13日まで、スイス、ハンガリー、イタリアの3か国を訪問しました。いずれも憲法改正を度々行っている国です。関心事項は、第1に国防・安全保障、第2に緊急事態条項、第3に国民投票の3つで、各国の政府・議会・有識者と意見交換を行いました。" },
        { side: "left", speaker: "古屋圭司団長", text: "スイスの安全保障の基本は中立です。中立を厳格に捉えウクライナ支援を控えるべきだという保守派と、EUの枠組みの下で柔軟に捉えるべきだというリベラル派で理解が分かれているとの説明でした。政府は中立の概念を固定しないことが重要だとして、厳格な中立を憲法に書き込む改正案に反対。帰国後の9月27日の国民投票では反対が7割を占め、改正案は否決されました。" },
        { side: "left", speaker: "古屋圭司団長", text: "ハンガリーの国防の基本原則は、自国軍による個別防衛、NATOによる集団防衛、そして憲法31条1項に定める「すべての国民による祖国防衛の義務」の3つです。同国は2011年の基本法制定後も改正を重ねており、現政権はこの秋から1年半〜2年をかけて新憲法制定のプロセスを進める予定だとの説明でした。一方でハンガリーの要人からは、80年近く改正されていない日本国憲法の安定性への羨望も一様に示されました。" },
        { side: "left", speaker: "古屋圭司団長", text: "ハンガリーの徴兵制について説明を受けました。徴兵制は2004年の憲法改正で「廃止された」と一般的には説明されていますが、それは誤解で、正確には徴兵制の一時停止、すなわち平時における徴兵の廃止であり、有事となった場合は国会はいつでも徴兵制を復活できるとのことでした。ただし、徴兵制の復活に対しては国民の反発が見込まれ、また現時点でもそのような動きはないとのことでした。（※これはハンガリー側の説明を報告したもので、日本への導入提案ではない）" },
        { side: "left", speaker: "古屋圭司団長", text: "イタリア憲法は11条で戦争の「拒絶」を、52条1項で市民の祖国防衛義務を定めています。両条文は合わせて読み、ポイントは「平和を保つための防衛」だとの説明でした。52条2項の兵役義務は2005年に停止され、現在は志願制です。なお国防省の政務次官は「個人的には」と断った上で、市民が軍の価値観を理解するために一定の兵役経験は重要だとの見解を示し、強制ではなく任意の兵役制度の法案を作ったものの、2020年に廃案になったと紹介しました。" },
        { side: "left", speaker: "古屋圭司団長", text: "緊急事態条項について。スイス憲法には議員任期延長の明文規定がなく、学会でも意見が分かれているとのことでした。ハンガリーでは事態が戦争事態・緊急事態・危険事態の3つに整理され、議員任期の延長も可能ですが、国会は政府の緊急命令を廃止でき、「何より早期に選挙を実施すること」が大原則だと強調されました。イタリアでは戦争状態の認定は国会が行い、政府の緊急法律命令は2025年に39件出されるなど増えており、「数が多すぎる点は反省すべき」との認識も示されました。" },
        { side: "left", speaker: "古屋圭司団長", text: "国民投票について。スイスには10万人の署名で国民が憲法改正を発案できる仕組みがあり、直接民主制は国のアイデンティティと結びついているとの認識でした。ハンガリーでは、憲法改正に国民投票を導入することが選択肢として検討されていますが、情報操作への懸念から反対する個人的見解も述べられました。イタリアでは今年3月、司法組織改革の憲法改正が国民投票で否決されました。「国民投票は名称こそ中立的だが、実際はまさに政治的な投票にならざるを得ない」との評価も聞かれました。" },
        { side: "left", speaker: "飯泉嘉門", text: "スイスは職業軍人ではなく、徴兵による民兵が原則の国です。10万人規模の動員には有職者を集めるため1.4倍の14万人が必要になるとの話があり、「職業軍人の方が合理的ではないか」と質問を向けたところ、有職者の知識や技術を軍に活かすことができ、災害対応や警察への支援も可能になるとの答えでした。ただし最近は人を集めづらくなり、銃を持ちたくない人向けの代替任務を選ぶ人が圧倒的になっていて、制度の改編が急務とされている、とのことでした。" },

function latestArticleTime(m) {
  let best = null;
  (m.articles || []).forEach(a => {
    const mm = /([0-9]+)年([0-9]+)月([0-9]+)日/.exec(a.date || "");
    if (mm) {
      const t = Date.UTC(+mm[1], +mm[2] - 1, +mm[3]) - 9 * 3600 * 1000;
      if (best === null || t > best) best = t;
    }
  });
  return best;
}
function showBadge(m) {
  if (!m.unread) return false;
  let t = null;
  if (m.addedOn) {
    const mm = /([0-9]+)-([0-9]+)-([0-9]+)/.exec(m.addedOn);
    if (mm) t = Date.UTC(+mm[1], +mm[2] - 1, +mm[3]) - 9 * 3600 * 1000;
  }
  if (t === null) t = latestArticleTime(m);
  if (t === null) return true;
  return Date.now() < t + 33 * 3600 * 1000;
}
function renderList(filter = "") {
  talkList.innerHTML = "";
  if (currentTab === "members") {
    addKokuusaRow(filter);
    MEMBERS
      .filter(m => (m.name + m.preview + m.cats.map(c => c.label).join("")).includes(filter))
      .forEach(m => {
        const row = document.createElement("div");
        row.className = "talk";
        row.dataset.key = m.id;
        row.innerHTML =
          '<div class="avatar' + (showBadge(m) ? " new" : "") + '">' + m.initial + "</div>" +
          '<div class="talk-main"><div class="talk-top"><span class="talk-name">' + m.name + '</span>' +
          '<span class="talk-date">' + m.dateLabel + "</span></div>" +
          '<div class="talk-preview">' + m.preview + "</div></div>" +
          (showBadge(m) ? '<div class="badge">' + m.unread + "</div>" : "");
        row.addEventListener("click", () => openThread(m));
        talkList.appendChild(row);
      });
  } else {
    addKokuusaRow(filter);
    const rooms = {};
    MEMBERS.forEach(m => m.cats.forEach(c => {
      (rooms[c.id] = rooms[c.id] || { cat: c, entries: [] }).entries.push({ member: m, entry: c });
    }));
    Object.values(rooms)
      .filter(({ cat, entries }) => (cat.label + entries.map(e => e.member.name + (e.entry.preview || e.member.preview)).join("")).includes(filter))
      .forEach(({ cat, entries }) => {
        const first = entries[0];
        const newCount = entries.filter(e => showBadge(e.member)).length;
        const row = document.createElement("div");
        row.className = "talk";
        row.dataset.key = cat.id;
        row.innerHTML =
          '<div class="avatar">' + cat.icon + "</div>" +
          '<div class="talk-main"><div class="talk-top"><span class="talk-name">' + cat.label + '</span>' +
          '<span class="talk-date">' + first.member.dateLabel + "</span></div>" +
          '<div class="talk-preview">' + (first.entry.preview || first.member.preview) + "（" + first.member.name + "）</div>" +
          '<div class="cat-meta">質疑 ' + roomArticleCount(entries, cat.id) + "件</div></div>" +
          (newCount ? '<div class="badge">' + newCount + "</div>" : "");
        row.addEventListener("click", () => openCategory(cat.id));
        talkList.appendChild(row);
      });
  }
  if (!talkList.children.length) {
    talkList.innerHTML = '<div style="padding:22px;text-align:center;color:#8a97a3;font-size:13px;">見つかりませんでした</div>';
  }
}

function markSelected(key) {

function setTab(tab) {

function renderArticle(body, member, a) {
  const date = document.createElement("div");
  date.className = "date-chip"; date.textContent = a.date + "｜" + member.name;
  body.appendChild(date);
  if (a.committee) {
    const c = document.createElement("div");
    c.className = "committee-chip"; c.textContent = a.committee;
    body.appendChild(c);
  }
  if (a.pending) {
    const p = document.createElement("div");
    p.className = "pending";
    p.innerHTML = "<strong>" + a.title + "</strong><br>この記事の吹き出し要約は準備中です。全文はnoteで読めます。";
    body.appendChild(p);
    const link = document.createElement("a");
    link.className = "full-link"; link.href = NOTE_TOP; link.target = "_blank"; link.rel = "noopener";
    link.textContent = "noteで全文を読む";
    body.appendChild(link);
    return;
  }
  const card = document.createElement("div");
  card.className = "card";
  card.innerHTML = '<b class="label">1分要約</b><br><strong>' + a.title + "</strong><br>" + a.summary;
  body.appendChild(card);
  a.bubbles.forEach(b => {
    const row = document.createElement("div");
    row.className = "row " + b.side;
    const isRight = b.side === "right";
    row.innerHTML =
      (isRight ? "" : '<div class="mini-avatar">' + member.initial + "</div>") +
      '<div class="bubble-wrap"><div class="speaker">' + b.speaker + '</div><div class="bubble">' + b.text + "</div></div>";
    body.appendChild(row);
  });
  const memo = document.createElement("div");
  memo.className = "card memo";
  memo.innerHTML = '<b class="label">鶴亀のメモ</b><br>' + a.memo;
  body.appendChild(memo);
  if (a.fullUrl) {
    const link = document.createElement("a");
    link.className = "full-link"; link.href = a.fullUrl;
    link.textContent = "全文文字起こしを読む";
    link.addEventListener("click", ev => { ev.preventDefault(); openFull(member, a); });
    body.appendChild(link);
    const sub = document.createElement("a");
    sub.className = "full-link"; sub.href = a.noteUrl; sub.target = "_blank"; sub.rel = "noopener";
    sub.style.fontSize = "13px"; sub.style.opacity = "0.75";
    sub.textContent = "noteでも読む";
    body.appendChild(sub);
  } else {
    const link = document.createElement("a");
    link.className = "full-link"; link.href = a.noteUrl; link.target = "_blank"; link.rel = "noopener";
    link.textContent = "全文文字起こしを読む（note）";
    body.appendChild(link);
  }
}

async function openFull(member, a) {
  const body = document.getElementById("threadBody");
  try {
    const res = await fetch(a.fullUrl);
    if (!res.ok) throw new Error("fetch failed");
    const html = await res.text();
    const doc = new DOMParser().parseFromString(html, "text/html");
    const content = doc.querySelector("#articleBody");
    if (!content) throw new Error("no article body");
    body.innerHTML = "";
    const back = document.createElement("button");
    back.className = "full-back"; back.type = "button";
    back.textContent = "← 要約に戻る";
    back.addEventListener("click", () => openThread(member));
    body.appendChild(back);
    const head = document.createElement("div");
    head.className = "card";
    head.innerHTML = "<strong>" + a.title + "</strong><br>" + a.date + "｜" + member.name + "｜全文文字起こし";
    body.appendChild(head);
    const wrap = document.createElement("div");
    wrap.className = "full-doc";
    wrap.innerHTML = content.innerHTML;
    body.appendChild(wrap);
    document.getElementById("findInput").value = ""; clearHits();
    document.getElementById("threadPlaceholder").style.display = "none";
    const bar = document.getElementById("findBar");
    if (bar) bar.style.display = "";
    if (!isDesktop()) listView.style.display = "none";
    threadView.style.display = "flex";
    window.scrollTo(0, 0);
    body.scrollTop = 0;
  } catch (e) {
    window.location.href = a.fullUrl;
  }
}


function roomArticleCount(entries, catId) {
  const seen = new Set();
  entries.forEach(e => e.member.articles.forEach(a => {
    if (!a.cats || a.cats.includes(catId)) seen.add(a.fullUrl || a.noteUrl || a.title);
  }));
  return seen.size;
}
function openCategory(catId) {
  const group = MEMBERS.filter(m => m.cats.some(c => c.id === catId));
  if (!group.length) return;
  const cat = group[0].cats.find(c => c.id === catId);
  document.getElementById("threadName").textContent = cat.icon + " " + cat.label;
  document.getElementById("threadSub").textContent = "テーマ別の質疑";
  const body = document.getElementById("threadBody");
  body.innerHTML = "";
  const seenRoom = new Set();
  const roomItems = [];
  group.forEach(m => m.articles.forEach(a => { if (!a.cats || a.cats.includes(catId)) roomItems.push({ m, a }); }));
  roomItems.sort((x, y) => (x.a.entrance ? 1 : 0) - (y.a.entrance ? 1 : 0));
  roomItems.forEach(({ m, a }) => { const key = a.fullUrl || a.noteUrl || a.title; if (seenRoom.has(key)) return; seenRoom.add(key); renderArticle(body, m, a); });
  document.getElementById("findInput").value = ""; clearHits();
  document.getElementById("threadPlaceholder").style.display = "none";
  if (!isDesktop()) listView.style.display = "none";
  threadView.style.display = "flex";
  window.scrollTo(0, 0);
  markSelected(catId);
}

function openThread(member) {
  document.getElementById("threadName").textContent = member.name;
  document.getElementById("threadSub").textContent = member.articles[0].committee || "国会質疑";
  const body = document.getElementById("threadBody");
  body.innerHTML = "";
  member.articles.forEach(a => renderArticle(body, member, a));
  document.getElementById("findInput").value = ""; clearHits();
  document.getElementById("threadPlaceholder").style.display = "none";
  if (!isDesktop()) listView.style.display = "none";
  threadView.style.display = "flex";
  window.scrollTo(0, 0);
  markSelected(member.id);
}

/* in-article find */
let hitMarks = [], hitIdx = -1;
function clearHits() {
  document.querySelectorAll("#threadBody mark.hit").forEach(m => m.replaceWith(document.createTextNode(m.textContent)));
  document.getElementById("threadBody").normalize();
  hitMarks = []; hitIdx = -1;
  document.getElementById("findCount").textContent = "";
}
function runFind() {
  clearHits();
  const q = document.getElementById("findInput").value.trim();
  if (!q) return;
  const body = document.getElementById("threadBody");
  const walker = document.createTreeWalker(body, NodeFilter.SHOW_TEXT, {
    acceptNode: n => n.nodeValue.includes(q) ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_REJECT
  });
  const nodes = [];
  while (walker.nextNode()) nodes.push(walker.currentNode);
  nodes.forEach(node => {
    const frag = document.createDocumentFragment();
    let rest = node.nodeValue;
    while (true) {
      const i = rest.indexOf(q);
      if (i < 0) { frag.appendChild(document.createTextNode(rest)); break; }
      if (i > 0) frag.appendChild(document.createTextNode(rest.slice(0, i)));
      const mk = document.createElement("mark");
      mk.className = "hit"; mk.textContent = q;
      frag.appendChild(mk); hitMarks.push(mk);
      rest = rest.slice(i + q.length);
    }
    node.replaceWith(frag);
  });
  if (hitMarks.length) { hitIdx = 0; showHit(); }
  else document.getElementById("findCount").textContent = "0件";
}
function showHit() {
  hitMarks.forEach((m, i) => m.classList.toggle("current", i === hitIdx));
  document.getElementById("findCount").textContent = (hitIdx + 1) + "/" + hitMarks.length + "件";
  hitMarks[hitIdx].scrollIntoView({ block: "center", behavior: "smooth" });
}
document.getElementById("findNext").addEventListener("click", () => {
  if (!hitMarks.length) { runFind(); return; }
  hitIdx = (hitIdx + 1) % hitMarks.length; showHit();
});
document.getElementById("findPrev").addEventListener("click", () => {
  if (!hitMarks.length) { runFind(); return; }
  hitIdx = (hitIdx - 1 + hitMarks.length) % hitMarks.length; showHit();
});
document.getElementById("findInput").addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); runFind(); } });
document.getElementById("findInput").addEventListener("search", runFind);

function horoDay() {
  const n = new Date();
  if (n.getHours() < 7) n.setDate(n.getDate() - 1);
  return n;
}
function fortuneHTML(i) {
  const d = horoDay();
  const seed = d.getFullYear() * 10000 + (d.getMonth() + 1) * 100 + d.getDate();
  const stars = 3 + ((seed + i * 7) % 3);
  const idx = (seed * 3 + i * 5) % FORTUNES.length;
  const text = FORTUNES[idx];
  const item = LUCKY[idx];
  return "<span class='stars'>" + "★".repeat(stars) + "</span> " + text +
    "<br><span class='lucky'>ラッキーアイテム：" + item + "</span>";
}
